name: Deep Company Analysis Chapter 8 Phase 8O Gap OCR V60

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-gap-directed-ocr-v60
    paths:
      - 'modules/deep_company_analysis/**'
      - 'scripts/qa_chapter8_gap_directed_ocr_v60.py'
      - 'docs/CHAPTER8_PHASE8O_GAP_DIRECTED_OCR_V60.md'
      - 'packages.txt'
      - '.github/workflows/chapter8-phase8o-gap-ocr-v60.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter8-phase8o:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install OCR runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V60 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_gap_directed_ocr_v60.py
          python -m py_compile modules/deep_company_analysis/chapter8_official_file_ingestion_v60.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v60.py
          python -m py_compile scripts/qa_chapter8_gap_directed_ocr_v60.py

      - name: Chapter 8 Phase 8A-8O deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            modules/deep_company_analysis/test_chapter8_phase8l.py \
            modules/deep_company_analysis/test_chapter8_phase8m.py \
            modules/deep_company_analysis/test_chapter8_phase8n.py \
            modules/deep_company_analysis/test_chapter8_phase8o.py \
            2>&1 | tee reports/CH8_V60_DETERMINISTIC_TESTS.log

      - name: Live DGC gap-directed high-resolution OCR acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_gap_directed_ocr_v60.py \
            2>&1 | tee reports/CH8_DGC_GAP_OCR_LIVE_V60.log

      - name: Chapter 8 V60 source and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V60_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks

          core = Path('modules/deep_company_analysis/chapter8_gap_directed_ocr_v60.py').read_text(encoding='utf-8').casefold()
          ingestion = Path('modules/deep_company_analysis/chapter8_official_file_ingestion_v60.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH8_DGC_GAP_OCR_ACCEPTANCE_V60.json').read_text(encoding='utf-8'))
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert 'candidate — analyst verify' in ingestion or 'candidate-only' in core
          assert acceptance['ocr_text_is_preapproved_evidence'] is False
          assert acceptance['auto_promoted_evidence'] is False
          assert acceptance['analyst_workspace_mutated'] is False
          assert acceptance['candidate_page_provenance_markers'] is True
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V60 OCR is gap-directed, original-page-provenanced and analyst-controlled.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V60_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8532 \
            > reports/CH8_V60_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8532/_stcore/health \
              | tee reports/CH8_V60_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V60_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V60 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8O V60\nBranch: feature/deep-company-analysis-chapter8-gap-directed-ocr-v60\nCommit: %s\nPurpose: gap-directed high-resolution OCR for remaining source-locked management research gaps; all OCR rows remain analyst-verified candidates.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V60.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8O_V60.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8O_V60.zip | tail -n 3

      - name: Upload V60 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8O_V60
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8O_GAP_DIRECTED_OCR_V60.md
            reports/CH8_DGC_GAP_OCR_ACCEPTANCE_V60.json
            reports/CH8_DGC_GAP_OCR_MANIFEST_V60.csv
            reports/CH8_DGC_GAP_OCR_DOWNLOADS_V60.csv
            reports/CH8_DGC_GAP_OCR_FILE_ATTEMPTS_V60.csv
            reports/CH8_DGC_GAP_OCR_DOCUMENTS_V60.csv
            reports/CH8_DGC_GAP_OCR_NEW_CANDIDATES_V60.csv
            reports/CH8_DGC_GAP_OCR_COVERAGE_V60.csv
            reports/CH8_DGC_GAP_OCR_DIAGNOSTICS_V60.csv
            reports/CH8_DGC_V59_OPEN_GAPS_NEWLY_COVERED_V60.csv
            reports/CH8_DGC_V59_OPEN_GAPS_REMAINING_V60.csv
            reports/CH8_DGC_GAP_OCR_LIVE_V60.log
            reports/CH8_V60_DETERMINISTIC_TESTS.log
            reports/CH8_V60_BOUNDARY_AUDIT.log
            reports/CH8_V60_FULL_DCA_REGRESSION.log
            reports/CH8_V60_STREAMLIT_SERVER.log
            reports/CH8_V60_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8O_V60.zip
