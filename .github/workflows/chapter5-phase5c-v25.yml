name: Chapter 5 Phase 5C Research Assistant V25

on:
  push:
    branches: [feature/deep-company-analysis-checklist]
    paths:
      - 'modules/deep_company_analysis/chapter5_evidence.py'
      - 'modules/deep_company_analysis/test_chapter5_phase5c.py'
      - 'tools/dgc_chapter5_phase5c_e2e.py'
      - 'scripts/apply_ch5_phase5c_patch.py'
      - 'docs/CHAPTER5_PHASE5C_RESEARCH_ASSISTANT.md'
      - 'docs/formulas/DEEP_COMPANY_ANALYSIS_CHAPTER5_PHASE5C_FORMULAS.md'
      - '.github/workflows/chapter5-phase5c-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase5c-v25:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Apply Phase 5C UI integration
        run: python scripts/apply_ch5_phase5c_patch.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Chapter 5 Phase 5C
        run: |
          python -m compileall -q \
            modules/deep_company_analysis/chapter5.py \
            modules/deep_company_analysis/chapter5_quant.py \
            modules/deep_company_analysis/chapter5_evidence.py \
            modules/deep_company_analysis/chapter5_page_support.py \
            pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            tools/dgc_chapter5_phase5c_e2e.py

      - name: Run Phase 5C acceptance tests
        run: python -m pytest -q modules/deep_company_analysis/test_chapter5_phase5c.py

      - name: Run Chapter 5 regression
        run: |
          python -m pytest -q \
            modules/deep_company_analysis/test_chapter5.py \
            modules/deep_company_analysis/test_chapter5_q23_deletable_defaults.py \
            modules/deep_company_analysis/test_chapter5_q23_ui.py \
            modules/deep_company_analysis/test_chapter5_phase5b.py \
            modules/deep_company_analysis/test_chapter5_phase5c.py

      - name: Run full Deep Analysis regression
        run: python -m pytest -q modules/deep_company_analysis

      - name: Run DGC Phase 5C real source-first diagnostic
        shell: bash
        run: |
          set -o pipefail
          python tools/dgc_chapter5_phase5c_e2e.py | tee dgc_chapter5_phase5c_e2e.log

      - name: Smoke-test unified Deep Analysis page
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8526 > /tmp/ch5_v25.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8526/_stcore/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then cat /tmp/ch5_v25.log; kill "$PID" 2>/dev/null || true; exit 1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Commit tested Phase 5C integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter5_page_support.py
          if ! git diff --cached --quiet; then
            git commit -m "feat(deep-analysis): integrate Chapter 5 Phase 5C Research Assistant"
            git push origin HEAD:feature/deep-company-analysis-checklist
          fi

      - name: Build Windows offline package V25
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="Trecapital_Deep_Analysis_Offline_V25_CHAPTER5_PHASE5C"
          rm -rf dist
          mkdir -p "dist/${PKG_NAME}"
          rsync -a ./ "dist/${PKG_NAME}/" \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'offline_wheels' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.log' \
            --exclude 'data_cache/deep_company_analysis_evidence_ci'
          mkdir -p "dist/${PKG_NAME}/data_cache"
          test -f "dist/${PKG_NAME}/CHAY_TRECAPITAL_OFFLINE.bat"
          test -f "dist/${PKG_NAME}/pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter5_evidence.py"
          test -f "dist/${PKG_NAME}/docs/CHAPTER5_PHASE5C_RESEARCH_ASSISTANT.md"
          test -f "dist/${PKG_NAME}/docs/formulas/DEEP_COMPANY_ANALYSIS_CHAPTER5_PHASE5C_FORMULAS.md"
          (cd dist && zip -qr "${PKG_NAME}.zip" "${PKG_NAME}")
          sha256sum "dist/${PKG_NAME}.zip" > "dist/${PKG_NAME}.zip.sha256"

      - name: Upload DGC Phase 5C audit
        uses: actions/upload-artifact@v4
        with:
          name: DGC_Chapter5_Phase5C_Audit_V25
          path: dgc_chapter5_phase5c_e2e.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload offline package V25
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Offline_V25_CHAPTER5_PHASE5C
          path: |
            dist/Trecapital_Deep_Analysis_Offline_V25_CHAPTER5_PHASE5C.zip
            dist/Trecapital_Deep_Analysis_Offline_V25_CHAPTER5_PHASE5C.zip.sha256
          if-no-files-found: error
          retention-days: 30
