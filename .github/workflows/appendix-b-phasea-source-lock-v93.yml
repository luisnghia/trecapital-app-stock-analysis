name: Deep Company Analysis Appendix B Phase A Source Lock V93

on:
  push:
    branches:
      - feature/deep-company-analysis-appendix-b-phasea-v93
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  appendix-b-phasea-v93:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Appendix B V93
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/appendix_b.py
          python -m py_compile modules/deep_company_analysis/test_appendix_b_phasea_v93.py
          python -m py_compile scripts/qa_appendix_b_source_lock_v93.py
          python -m py_compile app.py

      - name: Appendix B V93 deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_appendix_b_phasea_v93.py \
            2>&1 | tee reports/APPENDIX_B_V93_DETERMINISTIC_TESTS.log

      - name: Appendix B V93 source-lock acceptance
        run: |
          set -euo pipefail
          python scripts/qa_appendix_b_source_lock_v93.py \
            2>&1 | tee reports/APPENDIX_B_V93_SOURCE_LOCK_ACCEPTANCE.log

      - name: Appendix B V93 source, SSOT and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/APPENDIX_B_V93_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.appendix_b as appb

          source = Path('modules/deep_company_analysis/appendix_b.py').read_text(encoding='utf-8').casefold()
          docs = Path('docs/FORMULA_EXPLANATION_APPENDIX_B_PHASEA_V93.md').read_text(encoding='utf-8').casefold()
          report = json.loads(Path('reports/APPENDIX_B_PHASEA_SOURCE_LOCK_V93.json').read_text(encoding='utf-8'))

          assert appb.APPENDIX_KEY == 'B'
          assert appb.APPENDIX_TITLE == 'How to Interview the Management Team'
          assert appb.SOURCE_PRINT_PAGES == (331, 334)
          assert len(appb.SECTION_KEYS) == 2
          assert len(appb.MANAGEMENT_INTERVIEW_TOPICS) == 8
          assert 'import streamlit' not in source
          assert 'sqlite3' not in source
          assert 'import requests' not in source
          assert 'import httpx' not in source
          assert 'no new financial formulas' in docs
          assert report['acceptance'] == 'PASS'
          assert report['unknown_first'] is True
          assert report['open_ended_one_at_a_time'] is True
          assert report['listen_and_clarify'] is True
          assert report['past_behavior_over_hypothetical'] is True
          assert report['face_to_face_false_confidence_caveat'] is True
          assert report['automatic_management_score'] is False
          assert report['automatic_ceo_quality_classifier'] is False
          assert report['automatic_credibility_or_personality_score'] is False
          assert report['automatic_investment_signal'] is False
          assert report['automatic_mos_change'] is False
          assert report['automatic_research_gate_change'] is False
          assert report['duplicate_financial_ssot_added'] is False
          print('PASS: Appendix B V93 preserves source lock, analyst ownership, SSOT and investment boundaries.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/APPENDIX_B_V93_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 \
            > reports/APPENDIX_B_V93_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health \
              | tee reports/APPENDIX_B_V93_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/APPENDIX_B_V93_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V93 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Appendix B Phase A V93\nBranch: feature/deep-company-analysis-appendix-b-phasea-v93\nCommit: %s\nPurpose: Michael Shearn Appendix B source lock and management-interview protocol; no management/CEO/credibility score, duplicate financial SSOT, MOS/Research Gate change, or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_APPENDIX_B_V93.txt
          zip -qr Trecapital_Deep_Analysis_AppendixB_PhaseA_V93.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_AppendixB_PhaseA_V93.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_AppendixB_PhaseA_V93.zip | tee reports/APPENDIX_B_V93_OFFLINE_ZIP_SHA256.txt

      - name: Upload V93 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_AppendixB_PhaseA_V93
          retention-days: 90
          path: |
            docs/APPENDIX_B_PHASEA_SOURCE_LOCK_V93.md
            docs/FORMULA_EXPLANATION_APPENDIX_B_PHASEA_V93.md
            reports/APPENDIX_B_PHASEA_SOURCE_LOCK_V93.json
            reports/APPENDIX_B_V93_DETERMINISTIC_TESTS.log
            reports/APPENDIX_B_V93_SOURCE_LOCK_ACCEPTANCE.log
            reports/APPENDIX_B_V93_BOUNDARY_AUDIT.log
            reports/APPENDIX_B_V93_FULL_DCA_REGRESSION.log
            reports/APPENDIX_B_V93_STREAMLIT_SERVER.log
            reports/APPENDIX_B_V93_STREAMLIT_HEALTH.txt
            reports/APPENDIX_B_V93_OFFLINE_ZIP_SHA256.txt
            Trecapital_Deep_Analysis_AppendixB_PhaseA_V93.zip
