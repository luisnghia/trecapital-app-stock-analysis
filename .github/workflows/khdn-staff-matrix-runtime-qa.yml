name: KHDN staff workload installed runtime diagnostics
on:
  push:
    branches:
      - fix/khdn-staff-matrix-runtime-qa-20261028
jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r khdn_apps/requirements.txt
      - run: python -m khdn_apps.runtime_page_qa
