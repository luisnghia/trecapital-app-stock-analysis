name: Deep Company Analysis Chapter 8 Phase 8P Section Retrieval V61

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-section-retrieval-v61
    paths:
      - 'modules/deep_company_analysis/**'
      - 'scripts/qa_chapter8_section_retrieval_v61.py'
      - 'docs/CHAPTER8_PHASE8P_SECTION_RETRIEVAL_V61.md'
      - '.github/workflows/chapter8-phase8p-section-retrieval-v61.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter8-phase8p:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install OCR runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V61 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_section_directed_retrieval_v61.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v61.py
          python -m py_compile scripts/qa_chapter8_section_retrieval_v61.py

      - name: Chapter 8 Phase 8A-8P deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            modules/deep_company_analysis/test_chapter8_phase8l.py \
            modules/deep_company_analysis/test_chapter8_phase8m.py \
            modules/deep_company_analysis/test_chapter8_phase8n.py \
            modules/deep_company_analysis/test_chapter8_phase8o.py \
            modules/deep_company_analysis/test_chapter8_phase8p.py \
            2>&1 | tee reports/CH8_V61_DETERMINISTIC_TESTS.log

      - name: Live DGC official document expansion and section-directed retrieval acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_section_retrieval_v61.py \
            2>&1 | tee reports/CH8_DGC_SECTION_LIVE_V61.log

      - name: Chapter 8 V61 source and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V61_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks

          core = Path('modules/deep_company_analysis/chapter8_section_directed_retrieval_v61.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH8_DGC_SECTION_ACCEPTANCE_V61.json').read_text(encoding='utf-8'))
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert acceptance['auto_promoted_evidence'] is False
          assert acceptance['analyst_workspace_mutated'] is False
          assert acceptance['automatic_management_score'] is False
          assert acceptance['automatic_investment_signal'] is False
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V61 expands only official issuer documents and remains analyst-controlled.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V61_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8533 \
            > reports/CH8_V61_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8533/_stcore/health \
              | tee reports/CH8_V61_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V61_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V61 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8P V61\nBranch: feature/deep-company-analysis-chapter8-section-retrieval-v61\nCommit: %s\nPurpose: expand official historical documents by open research section before bounded OCR; all extracted rows remain analyst-verified candidates.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V61.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8P_V61.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8P_V61.zip | tail -n 3

      - name: Upload V61 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8P_V61
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8P_SECTION_RETRIEVAL_V61.md
            reports/CH8_DGC_SECTION_ACCEPTANCE_V61.json
            reports/CH8_DGC_SECTION_TARGETS_V61.csv
            reports/CH8_DGC_SECTION_PLAN_V61.csv
            reports/CH8_DGC_SECTION_DISCOVERY_V61.csv
            reports/CH8_DGC_SECTION_DOWNLOADS_V61.csv
            reports/CH8_DGC_SECTION_FILE_ATTEMPTS_V61.csv
            reports/CH8_DGC_SECTION_DOCUMENTS_V61.csv
            reports/CH8_DGC_SECTION_NEW_CANDIDATES_V61.csv
            reports/CH8_DGC_SECTION_COVERAGE_V61.csv
            reports/CH8_DGC_SECTION_OCR_DIAGNOSTICS_V61.csv
            reports/CH8_DGC_V59_OPEN_GAPS_NEWLY_COVERED_V61.csv
            reports/CH8_DGC_V59_OPEN_GAPS_REMAINING_V61.csv
            reports/CH8_DGC_SECTION_LIVE_V61.log
            reports/CH8_V61_DETERMINISTIC_TESTS.log
            reports/CH8_V61_BOUNDARY_AUDIT.log
            reports/CH8_V61_FULL_DCA_REGRESSION.log
            reports/CH8_V61_STREAMLIT_SERVER.log
            reports/CH8_V61_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8P_V61.zip
