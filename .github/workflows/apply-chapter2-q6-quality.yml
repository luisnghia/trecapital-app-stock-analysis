name: Apply Chapter 2 Q6 Evidence Quality Patch

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'tools/apply_chapter2_q6_quality_patch.py'
      - '.github/workflows/apply-chapter2-q6-quality.yml'

permissions:
  contents: write

jobs:
  apply-q6-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Q6 evidence quality patch
        run: python tools/apply_chapter2_q6_quality_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed sources
        run: python -m compileall -q modules/deep_company_analysis
      - name: Run deep-analysis regression suite
        run: python -m pytest -q modules/deep_company_analysis
      - name: Commit Q6 hardening
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter2_auto.py modules/deep_company_analysis/chapter2_evidence.py
          git commit -m "fix(deep-analysis): harden Q6 geography and PDF fallback"
          git push origin HEAD:feature/deep-company-analysis-checklist
