name: Deep Company Analysis Chapter 9 Phase 9I Management Synthesis V70

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter9-phase9i-v70
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  chapter9-phase9i:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Chapter 9 V70
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter7.py
          python -m py_compile modules/deep_company_analysis/chapter7_closure.py
          python -m py_compile modules/deep_company_analysis/chapter8.py
          python -m py_compile modules/deep_company_analysis/chapter8_completion.py
          python -m py_compile modules/deep_company_analysis/chapter9.py
          python -m py_compile modules/deep_company_analysis/chapter9_source_contract_v63.py
          python -m py_compile modules/deep_company_analysis/chapter9_completion.py
          python -m py_compile modules/deep_company_analysis/chapter9_history.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis.py
          python -m py_compile pages/04_Bao_cao_tong_hop.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          python -m py_compile scripts/qa_chapter9_management_synthesis_v70.py

      - name: Chapter 9 Phase 9A-9I deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter9_phase9a.py \
            modules/deep_company_analysis/test_chapter9_phase9b.py \
            modules/deep_company_analysis/test_chapter9_phase9c.py \
            modules/deep_company_analysis/test_chapter9_phase9d.py \
            modules/deep_company_analysis/test_chapter9_phase9e.py \
            modules/deep_company_analysis/test_chapter9_phase9f.py \
            modules/deep_company_analysis/test_chapter9_phase9g.py \
            modules/deep_company_analysis/test_chapter9_phase9g_app_rules.py \
            modules/deep_company_analysis/test_chapter9_phase9h.py \
            modules/deep_company_analysis/test_chapter9_phase9i.py \
            2>&1 | tee reports/CH9_V70_DETERMINISTIC_TESTS.log

      - name: Chapter 9 V70 management synthesis acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter9_management_synthesis_v70.py \
            2>&1 | tee reports/CH9_V70_MANAGEMENT_SYNTHESIS_ACCEPTANCE.log

      - name: Chapter 9 V70 source analyst synthesis and app-rule boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH9_V70_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter7 as ch7
          import modules.deep_company_analysis.chapter8 as ch8
          import modules.deep_company_analysis.chapter9 as ch9
          import modules.deep_company_analysis.chapter9_synthesis as synthesis
          import modules.deep_company_analysis.chapter9_source_contract_v63 as contract

          engine = Path('modules/deep_company_analysis/chapter9_synthesis.py').read_text(encoding='utf-8')
          page = Path('pages/04_Bao_cao_tong_hop.py').read_text(encoding='utf-8')
          docs = Path('docs/FORMULA_EXPLANATION_CHAPTER9_PHASE9I_V70.md').read_text(encoding='utf-8')
          report = json.loads(Path('reports/CH9_PHASE9I_MANAGEMENT_SYNTHESIS_V70.json').read_text(encoding='utf-8'))
          source = contract.validate_source_contract()

          assert ch7.QUESTION_KEYS == ('Q33', 'Q34', 'Q35', 'Q36', 'Q37', 'Q38')
          assert ch8.QUESTION_KEYS == ('Q39', 'Q40', 'Q41', 'Q42', 'Q43', 'Q44', 'Q45', 'Q46', 'Q47')
          assert ch9.QUESTION_KEYS == ('Q48', 'Q49', 'Q50', 'Q51', 'Q52')
          assert source['total_dimensions'] == 26
          assert source['dimension_counts'] == {'Q48': 6, 'Q49': 4, 'Q50': 8, 'Q51': 3, 'Q52': 5}
          assert synthesis.MANAGER_IDENTITY_SSOT == 'Chapter 7 manager master'
          assert 'Management Synthesis Handoff — Chapters 7–9' in page
          assert 'build_management_handoff' in page
          assert 'ready_for_analyst_synthesis' in page
          assert 'static_table_html' in page
          assert 'st.html(table_html)' in page
          assert 'import streamlit' not in engine.casefold()
          assert 'sqlite3' not in engine.casefold()
          assert 'save_record(' not in engine
          assert 'create_snapshot(' not in engine
          assert 'no financial valuation formula' in docs.casefold()
          assert report['total_questions'] == 20
          assert report['manager_roster_from_chapter7_only'] is True
          assert report['cross_chapter_question_ledger'] is True
          assert report['cross_chapter_evidence_lineage'] is True
          assert report['cross_chapter_research_gap_ledger'] is True
          assert report['manager_lineage_reconciliation'] is True
          assert report['input_payloads_immutable'] is True
          assert report['analyst_synthesis_generated'] is False
          assert report['automatic_management_score'] is False
          assert report['automatic_character_classification'] is False
          assert report['automatic_investment_signal'] is False
          assert report['mos_or_investment_research_gate_changed'] is False
          assert 'management quality score' in synthesis.SYNTHESIS_BOUNDARY.casefold()
          print('PASS: Phase 9I preserves Q33-Q52 source ownership, Chapter 7 manager SSOT, analyst conclusions and read-only synthesis handoff boundaries.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH9_V70_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8542 \
            > reports/CH9_V70_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8542/_stcore/health \
              | tee reports/CH9_V70_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH9_V70_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V70 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 9 Phase 9I V70\nBranch: feature/deep-company-analysis-chapter9-phase9i-v70\nCommit: %s\nPurpose: read-only Chapters 7-9 management research synthesis handoff; Chapter 7 manager SSOT and analyst-owned conclusions preserved; no management score.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH9_V70.txt
          zip -qr Trecapital_Deep_Analysis_Chapter9_Phase9I_V70.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter9_Phase9I_V70.zip | tail -n 3

      - name: Upload V70 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter9_Phase9I_V70
          retention-days: 90
          path: |
            docs/CHAPTER9_PHASE9I_MANAGEMENT_SYNTHESIS_V70.md
            docs/FORMULA_EXPLANATION_CHAPTER9_PHASE9I_V70.md
            reports/CH9_PHASE9I_MANAGEMENT_SYNTHESIS_V70.json
            reports/CH9_V70_DETERMINISTIC_TESTS.log
            reports/CH9_V70_MANAGEMENT_SYNTHESIS_ACCEPTANCE.log
            reports/CH9_V70_BOUNDARY_AUDIT.log
            reports/CH9_V70_FULL_DCA_REGRESSION.log
            reports/CH9_V70_STREAMLIT_SERVER.log
            reports/CH9_V70_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter9_Phase9I_V70.zip
