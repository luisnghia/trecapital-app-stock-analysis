name: Apply Approved Chapter 3 Specification

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'scripts/apply_chapter3_approved_spec_patch.py'
      - '.github/workflows/apply-chapter3-approved-spec.yml'

permissions:
  contents: write

jobs:
  apply-approved-chapter3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Apply approved Chapter 3 patch
        run: python scripts/apply_chapter3_approved_spec_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed sources
        run: |
          python -m compileall -q modules/deep_company_analysis/chapter3.py modules/deep_company_analysis/chapter3_page_support.py
      - name: Run Chapter 3 core tests
        run: python -m pytest -q modules/deep_company_analysis/test_chapter3.py
      - name: Run Chapter 3 evidence tests
        run: python -m pytest -q modules/deep_company_analysis/test_chapter3_auto.py
      - name: Run full deep-analysis regression
        run: python -m pytest -q modules/deep_company_analysis
      - name: Commit approved Chapter 3 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter3.py \
                  modules/deep_company_analysis/chapter3_page_support.py \
                  modules/deep_company_analysis/test_chapter3.py \
                  docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER3.md \
                  .github/workflows/deep-company-analysis.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat(ch3): implement approved customer-perspective workspace"
            git push origin HEAD:feature/deep-company-analysis-checklist
          fi
