name: Apply Chapter 3 Phase 3B UI Integration

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - '.github/workflows/apply-chapter3-phase3b.yml'

permissions:
  contents: write

jobs:
  integrate-phase3b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch unified Chapter 3 tab
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from modules.deep_company_analysis.chapter3 import render_chapter3\n'
          new_import = 'from modules.deep_company_analysis.chapter3_page_support import render_chapter3_tab\n'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('Chapter 3 import anchor not found')
              text = text.replace(old_import, new_import, 1)
          old_call = '    render_chapter3(chapter3_ticker)\n'
          new_call = '    render_chapter3_tab(chapter3_ticker)\n'
          if new_call not in text:
              if old_call not in text:
                  raise SystemExit('Chapter 3 render anchor not found')
              text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate Phase 3B
        run: |
          python -m compileall -q modules/deep_company_analysis/chapter3.py modules/deep_company_analysis/chapter3_auto.py modules/deep_company_analysis/chapter3_page_support.py pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py tools/dgc_chapter3_e2e.py
          python -m pytest -q modules/deep_company_analysis/test_chapter3.py modules/deep_company_analysis/test_chapter3_auto.py
          python -m pytest -q modules/deep_company_analysis
      - name: Commit Phase 3B UI integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luisnghia"
          git config user.email "nghia1214@gmail.com"
          git add pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          if git diff --cached --quiet; then
            echo "No UI integration change."
            exit 0
          fi
          git commit -m "feat(deep-analysis): integrate Chapter 3 Research Assistant"
          git fetch origin feature/deep-company-analysis-checklist
          git rebase origin/feature/deep-company-analysis-checklist
          git push origin HEAD:feature/deep-company-analysis-checklist
