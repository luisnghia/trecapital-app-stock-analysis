name: Deep Company Analysis Chapter 8 Phase 8L V57

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-official-file-v57
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chapter8-phase8l:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Apply idempotent V57 UI wiring
        run: |
          set -euo pipefail
          python scripts/apply_chapter8_phase8l_ui_v57.py

      - name: Commit V57 UI wiring if needed
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "trecapital-ci"
            git config user.email "actions@users.noreply.github.com"
            git add modules/deep_company_analysis/chapter8_page_support.py
            git commit -m "feat(dca): wire Phase 8L official file ingestion into Chapter 8 UI"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No V57 UI migration changes to commit."
          fi

      - name: Compile V57 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_official_file_ingestion.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v57.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile scripts/qa_chapter8_official_file_v57.py

      - name: Chapter 8 Phase 8A-8L deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            modules/deep_company_analysis/test_chapter8_phase8l.py \
            2>&1 | tee reports/CH8_V57_DETERMINISTIC_TESTS.log

      - name: DGC local official-file acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_official_file_v57.py \
            2>&1 | tee reports/CH8_DGC_OFFICIAL_FILE_LIVE_V57.log

      - name: Chapter 8 V57 source, ticker and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V57_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks

          compat = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8')
          page = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          core = Path('modules/deep_company_analysis/chapter8_official_file_ingestion.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH8_DGC_OFFICIAL_FILE_ACCEPTANCE_V57.json').read_text(encoding='utf-8'))
          assert 'chapter8_research_v57 import *' in compat
          assert 'Phase 8L — Official File / PDF Ingestion' in page
          assert 'st.file_uploader' in page
          assert 'ingest_official_files' in page
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert 'candidate — analyst verify' in core
          assert acceptance['fixture_is_real_evidence'] is False
          assert acceptance['network_required_for_uploaded_file'] is False
          assert acceptance['auto_promoted_evidence'] is False
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V57 local file ingestion is ticker-gated, provenance-gated, offline-capable and analyst-controlled.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V57_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8529 \
            > reports/CH8_V57_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8529/_stcore/health \
              | tee reports/CH8_V57_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V57_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V57 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8L V57\nBranch: feature/deep-company-analysis-chapter8-official-file-v57\nCommit: %s\nPurpose: local PDF/DOCX/TXT/HTML official-file ingestion with ticker/provenance gating; analyst verification and promotion remain required.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V57.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8L_V57.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8L_V57.zip | tail -n 3

      - name: Upload V57 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8L_V57
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8L_OFFICIAL_FILE_V57.md
            reports/CH8_DGC_OFFICIAL_FILE_ACCEPTANCE_V57.json
            reports/CH8_DGC_OFFICIAL_FILE_ATTEMPTS_V57.csv
            reports/CH8_DGC_OFFICIAL_FILE_DOCUMENTS_V57.csv
            reports/CH8_DGC_OFFICIAL_FILE_NEW_CANDIDATES_V57.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_BEFORE_FILE_V57.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_AFTER_FILE_V57.csv
            reports/CH8_DGC_REMAINING_GAPS_FILE_V57.csv
            reports/CH8_DGC_OFFICIAL_FILE_LIVE_V57.log
            reports/CH8_V57_DETERMINISTIC_TESTS.log
            reports/CH8_V57_BOUNDARY_AUDIT.log
            reports/CH8_V57_FULL_DCA_REGRESSION.log
            reports/CH8_V57_STREAMLIT_SERVER.log
            reports/CH8_V57_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8L_V57.zip
