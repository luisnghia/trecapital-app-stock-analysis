name: Deep Company Analysis Chapter 8 Phase 8G V52

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-subtopic-gap-v52
    paths:
      - modules/deep_company_analysis/chapter8_gap_engine.py
      - modules/deep_company_analysis/chapter8_research_v52.py
      - modules/deep_company_analysis/chapter8_page_support.py
      - modules/deep_company_analysis/test_chapter8_phase8g.py
      - scripts/qa_chapter8_subtopic_gap_v52.py
      - docs/CHAPTER8_PHASE8G_SUBTOPIC_GAP_ENGINE.md
      - .github/workflows/chapter8-phase8g-subtopic-gap-v52.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  chapter8-phase8g:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V52 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_gap_engine.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v52.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile scripts/qa_chapter8_subtopic_gap_v52.py

      - name: Chapter 8 Phase 8A-8G deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            2>&1 | tee reports/CH8_V52_DETERMINISTIC_TESTS.log

      - name: Live DGC dimension-gap acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_subtopic_gap_v52.py \
            2>&1 | tee reports/CH8_DGC_SUBTOPIC_GAP_LIVE_V52.log

      - name: Chapter 8 V52 source and UI boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V52_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks

          page_support = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          engine = Path('modules/deep_company_analysis/chapter8_gap_engine.py').read_text(encoding='utf-8').casefold()
          wrapper = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8').casefold()
          assert 'chapter8_research_v52 import CANDIDATE_COLUMNS, Chapter8ResearchAgent' in page_support
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          assert 'not a management score' in engine
          assert 'auto-promote' not in wrapper or 'does not auto-promote' in wrapper
          assert 'buy/hold/sell' not in engine
          print('PASS: V52 dimension-gap engine is source-locked, analyst-controlled and wired into Chapter 8 UI.')
          PY

      - name: Full Deep Company Analysis regression
        shell: bash
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V52_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8524 \
            > reports/CH8_V52_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8524/_stcore/health \
              | tee reports/CH8_V52_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V52_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V52 package
        shell: bash
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8G V52\nBranch: feature/deep-company-analysis-chapter8-subtopic-gap-v52\nCommit: %s\nPurpose: dimension/subtopic evidence-gap engine; no automatic management score or investment signal.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V52.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8G_V52.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8G_V52.zip | tail -n 3

      - name: Upload V52 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8G_V52
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8G_SUBTOPIC_GAP_ENGINE.md
            reports/CH8_DGC_SUBTOPIC_GAP_ACCEPTANCE_V52.json
            reports/CH8_DGC_SUBTOPIC_GAP_ACCEPTANCE_V52.md
            reports/CH8_DGC_DIMENSION_COVERAGE_V52.csv
            reports/CH8_DGC_QUESTION_COVERAGE_V52.csv
            reports/CH8_DGC_RESEARCH_GAPS_V52.csv
            reports/CH8_DGC_CANDIDATES_V52.csv
            reports/CH8_DGC_SOURCE_ATTEMPTS_V52.csv
            reports/CH8_DGC_SUBTOPIC_GAP_LIVE_V52.log
            reports/CH8_V52_DETERMINISTIC_TESTS.log
            reports/CH8_V52_BOUNDARY_AUDIT.log
            reports/CH8_V52_FULL_DCA_REGRESSION.log
            reports/CH8_V52_STREAMLIT_SERVER.log
            reports/CH8_V52_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8G_V52.zip
