name: Finalize Chapter 7 Phase 7C V36 — Evidence Research Assistant + QA

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter7
    paths:
      - '.github/workflows/finalize-chapter7-phase7c-v36.yml'

permissions:
  contents: write

jobs:
  finalize-phase7c-v36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter7
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply approved Phase 7C integration
        run: python scripts/apply_chapter7_phase7c_v36.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Chapter 7 V36
        run: |
          python -m py_compile \
            modules/deep_company_analysis/chapter7.py \
            modules/deep_company_analysis/chapter7_page_support.py \
            modules/deep_company_analysis/chapter7_research.py \
            modules/deep_company_analysis/chapter7_research_ui.py \
            scripts/apply_chapter7_phase7c_v36.py \
            scripts/audit_chapter7_phase7c_v36.py \
            pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py

      - name: QA Pass 1 of 3 — Research engine + analyst boundary
        run: |
          pytest -q \
            modules/deep_company_analysis/test_chapter7_phase7c.py \
            modules/deep_company_analysis/test_chapter7.py \
            modules/deep_company_analysis/test_chapter7_phase7a_integration.py \
            modules/deep_company_analysis/test_chapter7_phase7b.py

      - name: QA Pass 2 of 3 — Format/sort + static source-lock audit
        run: |
          pytest -q \
            modules/deep_company_analysis/test_table_format.py \
            modules/deep_company_analysis/test_sortable_table_v32.py
          python scripts/audit_chapter7_phase7c_v36.py

      - name: QA Pass 3 of 3 — Full Deep Company Analysis regression
        run: pytest -q modules/deep_company_analysis/test_*.py

      - name: Static Chapter 7 production table audit
        shell: bash
        run: |
          echo '=== Direct production Streamlit table primitives ==='
          grep -RIn --include='*.py' -E 'st\.table\(|st\.dataframe\(|st\.data_editor\(' modules/deep_company_analysis/chapter7*.py \
            | grep -v '/test_' | grep -v 'table_format.py' && exit 1 || true
          echo '=== Phase7C required tokens ==='
          grep -n 'RESEARCH_BOUNDARY\|Promote evidence\|PDF text extraction\|Source Grade' \
            modules/deep_company_analysis/chapter7_research.py \
            modules/deep_company_analysis/chapter7_research_ui.py

      - name: Unified Streamlit smoke test
        shell: bash
        run: |
          timeout 40s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8522 >/tmp/dca_v36_smoke.log 2>&1 &
          PID=$!
          sleep 15
          curl --fail --silent http://127.0.0.1:8522/_stcore/health
          kill $PID || true
          wait $PID || true
          tail -n 120 /tmp/dca_v36_smoke.log || true

      - name: Write V36 audit record
        shell: bash
        run: |
          cat > docs/DEEP_ANALYSIS_CHAPTER7_PHASE7C_V36_AUDIT_RESULT.md <<EOF
          # Chapter 7 Phase 7C V36 — Audit Result

          Status: PASS

          - QA Pass 1/3: Phase 7C research engine, A/B/C grading, title/snippet evidence boundary, explicit analyst Promote, deep PDF/HTML extraction and Phase 7A/7B regressions PASS.
          - QA Pass 2/3: shared table format/sort and Phase 7C static source-lock audit PASS.
          - QA Pass 3/3: full Deep Company Analysis regression PASS.
          - Static Chapter 7 production table audit PASS.
          - Unified Streamlit page smoke test PASS.

          Phase 7C scope: focused Q33-Q38 web research; company/official A-source priority; candidate evidence/counter-evidence; optional public HTML/PDF text extraction without OCR; research gaps; deduplicated analyst Promote into existing Chapter-7 Evidence Matrix.

          Boundary: no auto OO/LT/HH, Lion/Hyena, Management Quality, outsider verdict, insider BUY/SELL signal, MOS, Research Gate or BUY/HOLD/SELL; event/as-of management data only; no fake TTM; final source closure remains Phase 7D.

          Branch: feature/deep-company-analysis-chapter7
          Build source before commit: $(git rev-parse HEAD)
          EOF

      - name: Commit Phase 7C V36 production integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            modules/deep_company_analysis/chapter7.py \
            modules/deep_company_analysis/chapter7_page_support.py \
            docs/DEEP_ANALYSIS_CHAPTER7_PHASE7C_V36_AUDIT_RESULT.md
          git commit -m 'feat(ch7): integrate Phase 7C evidence research assistant V36'
          git push origin HEAD:feature/deep-company-analysis-chapter7

      - name: Build V36 offline package
        shell: bash
        run: |
          cat > OFFLINE_BUILD_INFO.txt <<EOF
          Trecapital Deep Company Analysis Chapters 1-7 V36 Offline
          Branch: feature/deep-company-analysis-chapter7
          Commit: $(git rev-parse HEAD)
          Chapter 7: Phase 7A + 7B Structured Management Data Bridge + 7C Management Evidence & Research Assistant.
          Includes: Q33-Q38 focused web research; A/B/C source grading; candidate evidence/counter-evidence; optional HTML/PDF text extraction without OCR; research gaps; explicit analyst Promote; deduplication; full provenance boundary.
          Boundary: no auto management classification/quality score, insider signal, MOS, Research Gate or BUY/HOLD/SELL; no fake TTM; Phase 7D owns final source closure.
          EOF
          rm -f Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline.zip
          zip -qr Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' \
               'Trecapital_Deep_Analysis_Ch1-Ch6_V33_Offline.zip' \
               'Trecapital_Deep_Analysis_Ch1-Ch7_V34_Offline.zip' \
               'Trecapital_Deep_Analysis_Ch1-Ch7_V35_Offline.zip'
          unzip -t Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline.zip | tail -n 3

      - name: Upload V36 offline ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline
          path: Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline.zip
          retention-days: 90
