name: Deep Company Analysis Chapter 8 Phase 8B V43 — Structured Data Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-phase8b-v43
    paths:
      - '.github/workflows/chapter8-phase8b-structured-bridge-v43.yml'
      - 'modules/deep_company_analysis/chapter8.py'
      - 'modules/deep_company_analysis/chapter8_data_bridge.py'
      - 'modules/deep_company_analysis/test_chapter8_phase8*.py'
      - 'docs/CHAPTER8_PHASE8B_STRUCTURED_DATA_BRIDGE.md'

permissions:
  contents: read

jobs:
  chapter8-phase8b-v43:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Phase 8B
        run: |
          set -euo pipefail
          python -m py_compile \
            modules/deep_company_analysis/chapter8.py \
            modules/deep_company_analysis/chapter8_data_bridge.py \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py

      - name: QA 1 — Phase 8A + 8B contracts
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            2>&1 | tee reports/CH8_PHASE8B_TESTS_V43.log

      - name: QA 2 — DGC live canonical bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_PHASE8B_DGC_LIVE_V43.log
          import json
          from pathlib import Path
          import pandas as pd
          import module1_dashboard as m1
          from module1_engine import append_ttm_row
          from modules.deep_company_analysis.chapter4_peer_auto import refresh_peer_canonical_bundle
          from modules.deep_company_analysis.chapter8_data_bridge import build_phase8b_context

          ticker = 'DGC'
          ok, paths, note = refresh_peer_canonical_bundle(ticker)
          assert ok and paths, f'DGC canonical refresh failed: {note}'
          overview_path, annual_path, quarter_path = paths
          annual_raw = m1._load_timeseries_cached(str(annual_path), ticker, 'Y', 11)
          quarterly = m1._load_timeseries_cached(str(quarter_path), ticker, 'Q', 20)
          annual = append_ttm_row(annual_raw, quarterly)
          assert isinstance(annual, pd.DataFrame) and not annual.empty

          package = build_phase8b_context(ticker, annual, chapter7_payload=None, guidance_rows=None)
          q45 = package['q45_cost_context']
          q46 = package['q46_capital_allocation_context']
          q47 = package['q47_buyback_context']
          assert not q45.empty and not q46.empty and not q47.empty
          assert package['financial_ssot'] == 'Trecapital canonical financial data / Module 1'
          assert all(src == package['financial_ssot'] for src in q45['Source'].dropna().tolist())
          assert len([c for c in q46.columns if c[:2] in {'1.','2.','3.','4.','5.'}]) == 5
          assert not any('debt' in c.lower() for c in q46.columns if c[:2] in {'1.','2.','3.','4.','5.'})
          assert set(q47['Explicit buyback field available?'].dropna().unique()).issubset({'Yes','No'})

          out = {
              'ticker': ticker,
              'canonical_refresh_ok': True,
              'canonical_note': str(note),
              'q45_rows': len(q45),
              'q46_rows': len(q46),
              'q47_rows': len(q47),
              'latest_period': str(q46.iloc[-1]['Kỳ']) if len(q46) else '',
              'warnings': package['warnings'],
              'financial_ssot': package['financial_ssot'],
              'manager_ssot': package['manager_ssot'],
          }
          Path('reports/CH8_PHASE8B_DGC_LIVE_V43.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2, default=str), encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, indent=2, default=str))
          PY

      - name: QA 3 — Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH8_PHASE8B_FULL_REGRESSION_V43.log

      - name: QA 4 — Static SSOT and analyst-boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          import modules.deep_company_analysis.chapter8_data_bridge as b
          source = inspect.getsource(b).casefold()
          assert 'chapter 7 manager master' in source
          assert 'trecapital canonical financial data / module 1' in source
          assert 'no management score' in source
          assert 'share-count decline is context only and is not proof of buyback' in source
          assert 'web research' in source and 'does not perform' in source
          print('Phase 8B SSOT / analyst boundary: PASS')
          PY

      - name: Streamlit smoke — existing integrated surface remains healthy
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8538 >/tmp/dca_v43_smoke.log 2>&1 &
          PID=$!
          sleep 15
          curl --fail --silent http://127.0.0.1:8538/_stcore/health
          kill $PID || true
          wait $PID || true
          tail -n 100 /tmp/dca_v43_smoke.log || true

      - name: Write V43 acceptance marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          marker = {
              'phase': 'Chapter 8 Phase 8B Structured Data Bridge V43',
              'acceptance': 'PASS',
              'questions': [f'Q{i}' for i in range(39,48)],
              'manager_ssot': 'Chapter 7 manager master',
              'financial_ssot': 'Trecapital canonical financial data / Module 1',
              'guidance_bridge': 'structured disclosure evidence',
              'q45': 'canonical cost context',
              'q46': 'five Shearn capital-allocation buckets',
              'q47': 'explicit buyback fields separated from share-count changes',
              'analyst_boundary': 'locked',
              'automated_research': 'deferred to Phase 8C',
          }
          Path('reports/CHAPTER8_PHASE8B_V43_ACCEPTANCE.json').write_text(
              json.dumps(marker, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(marker, ensure_ascii=False, indent=2))
          PY

      - name: Build V43 offline source package
        shell: bash
        run: |
          set -euo pipefail
          cat > OFFLINE_BUILD_INFO_CH8_V43.txt <<EOF
          Trecapital Deep Company Analysis Chapter 8 Phase 8B V43
          Branch: feature/deep-company-analysis-chapter8-phase8b-v43
          Commit: $(git rev-parse HEAD)
          Scope: Chapter 8 Q39-Q47 source lock + structured data bridge.
          Manager SSOT: Chapter 7 manager master.
          Financial SSOT: Trecapital canonical financial data / Module 1.
          Phase 8C automated evidence research is not included yet.
          EOF
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8B_V43.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8B_V43.zip | tail -n 3

      - name: Upload V43 acceptance + offline package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8B_V43
          path: |
            reports/CHAPTER8_PHASE8B_V43_ACCEPTANCE.json
            reports/CH8_PHASE8B_DGC_LIVE_V43.json
            reports/CH8_PHASE8B_TESTS_V43.log
            reports/CH8_PHASE8B_FULL_REGRESSION_V43.log
            docs/CHAPTER8_PHASE8B_STRUCTURED_DATA_BRIDGE.md
            Trecapital_Deep_Analysis_Chapter8_Phase8B_V43.zip
          retention-days: 90
