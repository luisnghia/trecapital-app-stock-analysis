name: Deep Company Analysis Chapter 8 Phase 8J V55

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-official-archive-v55
  workflow_dispatch:

jobs:
  chapter8-phase8j:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V55 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_official_archive_retrieval.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v55.py
          python -m py_compile scripts/qa_chapter8_official_archive_v55.py

      - name: Chapter 8 Phase 8A-8J deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            2>&1 | tee reports/CH8_V55_DETERMINISTIC_TESTS.log

      - name: Live DGC official archive acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_official_archive_v55.py \
            2>&1 | tee reports/CH8_DGC_OFFICIAL_ARCHIVE_LIVE_V55.log

      - name: Chapter 8 V55 source and analyst boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V55_BOUNDARY_AUDIT.log
          from pathlib import Path
          import pandas as pd
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_official_archive_retrieval import (
              OFFICIAL_ARCHIVE_DOMAINS,
              build_archive_query_plan,
          )
          from modules.deep_company_analysis.chapter8_official_deep_retrieval import build_official_deep_targets
          from modules.deep_company_analysis.chapter8_research import source_grade_from_url

          compatibility = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8')
          core = Path('modules/deep_company_analysis/chapter8_official_archive_retrieval.py').read_text(encoding='utf-8').casefold()
          assert 'chapter8_research_v53 import *' in compatibility
          assert 'chapter8_research_v54 import *' in compatibility
          assert 'chapter8_research_v55 import *' in compatibility
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert 'no management score' in core
          assert OFFICIAL_ARCHIVE_DOMAINS
          assert all(source_grade_from_url('https://' + d + '/x', 'DGC').startswith('A —') for d in OFFICIAL_ARCHIVE_DOMAINS)
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          targets = build_official_deep_targets(pd.DataFrame(), max_targets=64)
          assert 'discipline_hurdle_context' not in set(targets['Dimension Key'])
          plan = build_archive_query_plan('DGC', 'Đức Giang', targets, max_queries=10)
          assert len(plan) <= 10
          assert plan['Query'].astype(str).str.startswith('site:').all()
          print('PASS: V55 searches only bounded company/exchange/regulator archive routes and preserves analyst control.')
          PY

      - name: Full Deep Company Analysis regression
        shell: bash
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V55_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8527 \
            > reports/CH8_V55_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8527/_stcore/health \
              | tee reports/CH8_V55_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V55_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V55 package
        shell: bash
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8J V55\nBranch: feature/deep-company-analysis-chapter8-official-archive-v55\nCommit: %s\nPurpose: bounded historical company/IR + exchange/regulator archive retrieval; analyst verification/promotion remains required.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V55.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8J_V55.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8J_V55.zip | tail -n 3

      - name: Upload V55 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8J_V55
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8J_OFFICIAL_ARCHIVE_V55.md
            reports/CH8_DGC_OFFICIAL_ARCHIVE_ACCEPTANCE_V55.json
            reports/CH8_DGC_OFFICIAL_ARCHIVE_TARGETS_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_QUERY_PLAN_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_SEARCH_RESULTS_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_ATTEMPTS_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_DOCUMENTS_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_NEW_CANDIDATES_V55.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_BEFORE_V55.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_AFTER_V55.csv
            reports/CH8_DGC_REMAINING_GAPS_V55.csv
            reports/CH8_DGC_OFFICIAL_ARCHIVE_LIVE_V55.log
            reports/CH8_V55_DETERMINISTIC_TESTS.log
            reports/CH8_V55_BOUNDARY_AUDIT.log
            reports/CH8_V55_FULL_DCA_REGRESSION.log
            reports/CH8_V55_STREAMLIT_SERVER.log
            reports/CH8_V55_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8J_V55.zip
