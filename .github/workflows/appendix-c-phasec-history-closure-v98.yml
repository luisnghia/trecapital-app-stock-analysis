name: Deep Company Analysis Appendix C Phase C History Closure V98

on:
  push:
    branches:
      - feature/deep-company-analysis-appendix-c-phasec-v98
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  appendix-c-phasec-v98:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V98
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/appendix_c.py
          python -m py_compile modules/deep_company_analysis/appendix_c_workspace.py
          python -m py_compile modules/deep_company_analysis/appendix_c_history.py
          python -m py_compile modules/deep_company_analysis/appendix_c_history_store.py
          python -m py_compile modules/deep_company_analysis/test_appendix_c_phasec_v98.py
          python -m py_compile modules/deep_company_analysis/test_appendix_c_history_store_v98.py
          python -m py_compile scripts/qa_appendix_c_history_closure_v98.py
          python -m py_compile pages/12_Appendix_C_Investment_Checklist.py
          python -m py_compile app.py

      - name: Appendix C V96-V98 deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_appendix_c_phasea_v96.py \
            modules/deep_company_analysis/test_appendix_c_phaseb_v97.py \
            modules/deep_company_analysis/test_appendix_c_phasec_v98.py \
            modules/deep_company_analysis/test_appendix_c_history_store_v98.py \
            2>&1 | tee reports/APPENDIX_C_V98_DETERMINISTIC_TESTS.log

      - name: Appendix C V98 closure acceptance
        run: |
          set -euo pipefail
          python scripts/qa_appendix_c_history_closure_v98.py \
            2>&1 | tee reports/APPENDIX_C_V98_CLOSURE_ACCEPTANCE.log

      - name: Source SSOT investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/APPENDIX_C_V98_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          from modules.deep_company_analysis import appendix_c_history as hist
          from modules.deep_company_analysis import appendix_c_workspace as ws

          rows = ws.build_live_rows('QA', owner_payloads={})
          payload = hist.build_snapshot_payload(rows)
          assert not hist.validate_snapshot_payload(payload)
          assert all('analyst_assessment' not in x for x in payload['question_refs'])
          assert all(not (set(x) & hist.FORBIDDEN_SNAPSHOT_KEYS) for x in payload['question_refs'])
          report = json.loads(Path('reports/APPENDIX_C_PHASEC_CLOSURE_V98.json').read_text(encoding='utf-8'))
          assert report['acceptance'] == 'PASS'
          assert report['question_count'] == 59
          assert report['section_count'] == 10
          assert report['duplicate_financial_or_question_ssot_added'] is False
          assert report['automatic_weighted_score'] is False
          assert report['automatic_management_or_growth_score'] is False
          assert report['automatic_buy_hold_sell'] is False
          assert report['automatic_intrinsic_value_or_mos_change'] is False
          assert report['automatic_research_gate_change'] is False
          assert report['ai_role'] == 'Research Assistant'
          assert report['conclusion_owner'] == 'Analyst'
          page = Path('pages/12_Appendix_C_Investment_Checklist.py').read_text(encoding='utf-8').casefold()
          assert 'immutable checklist snapshot' in page
          assert 'explicit re-review' in page
          assert 'unchanged / added / removed / changed' in page
          print('PASS: Appendix C V98 remains source-locked, referential and investment-boundary neutral.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/APPENDIX_C_V98_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 \
            > reports/APPENDIX_C_V98_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health \
              | tee reports/APPENDIX_C_V98_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/APPENDIX_C_V98_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V98 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Appendix C Phase C V98\nBranch: feature/deep-company-analysis-appendix-c-phasec-v98\nCommit: %s\nPurpose: source-locked Q01-Q59 referential snapshot/history, neutral delta, explicit analyst re-review, and final-book closure audit.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_APPENDIX_C_V98.txt
          zip -qr Trecapital_Deep_Analysis_AppendixC_PhaseC_V98.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_AppendixC_PhaseC_V98.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_AppendixC_PhaseC_V98.zip | tee reports/APPENDIX_C_V98_OFFLINE_ZIP_SHA256.txt

      - name: Upload V98 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_AppendixC_PhaseC_V98
          retention-days: 90
          path: |
            docs/APPENDIX_C_PHASEC_HISTORY_CLOSURE_V98.md
            docs/FORMULA_EXPLANATION_APPENDIX_C_PHASEC_V98.md
            docs/BOOK_IMPLEMENTATION_COMPLETE.md
            reports/APPENDIX_C_PHASEC_CLOSURE_V98.json
            reports/APPENDIX_C_V98_DETERMINISTIC_TESTS.log
            reports/APPENDIX_C_V98_CLOSURE_ACCEPTANCE.log
            reports/APPENDIX_C_V98_BOUNDARY_AUDIT.log
            reports/APPENDIX_C_V98_FULL_DCA_REGRESSION.log
            reports/APPENDIX_C_V98_STREAMLIT_SERVER.log
            reports/APPENDIX_C_V98_STREAMLIT_HEALTH.txt
            reports/APPENDIX_C_V98_OFFLINE_ZIP_SHA256.txt
            Trecapital_Deep_Analysis_AppendixC_PhaseC_V98.zip
