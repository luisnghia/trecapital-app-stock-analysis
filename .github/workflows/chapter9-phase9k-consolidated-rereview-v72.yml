name: Deep Company Analysis Chapter 9 Phase 9K Consolidated Re-review V72

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter9-phase9k-v72
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  chapter9-phase9k:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Chapter 9 V72
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter7.py
          python -m py_compile modules/deep_company_analysis/chapter7_closure.py
          python -m py_compile modules/deep_company_analysis/chapter8.py
          python -m py_compile modules/deep_company_analysis/chapter8_completion.py
          python -m py_compile modules/deep_company_analysis/chapter9.py
          python -m py_compile modules/deep_company_analysis/chapter9_completion.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis_workspace.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis_review.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis_store.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis_ui.py
          python -m py_compile modules/deep_company_analysis/chapter9_synthesis_report.py
          python -m py_compile modules/deep_company_analysis/chapter9_page_support.py
          python -m py_compile pages/04_Bao_cao_tong_hop.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          python -m py_compile scripts/qa_chapter9_consolidated_rereview_v72.py

      - name: Chapter 9 Phase 9A-9K deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter9_phase9a.py \
            modules/deep_company_analysis/test_chapter9_phase9b.py \
            modules/deep_company_analysis/test_chapter9_phase9c.py \
            modules/deep_company_analysis/test_chapter9_phase9d.py \
            modules/deep_company_analysis/test_chapter9_phase9e.py \
            modules/deep_company_analysis/test_chapter9_phase9f.py \
            modules/deep_company_analysis/test_chapter9_phase9g.py \
            modules/deep_company_analysis/test_chapter9_phase9g_app_rules.py \
            modules/deep_company_analysis/test_chapter9_phase9h.py \
            modules/deep_company_analysis/test_chapter9_phase9i.py \
            modules/deep_company_analysis/test_chapter9_phase9j.py \
            modules/deep_company_analysis/test_chapter9_phase9k.py \
            2>&1 | tee reports/CH9_V72_DETERMINISTIC_TESTS.log

      - name: Chapter 9 V72 consolidated re-review acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter9_consolidated_rereview_v72.py \
            2>&1 | tee reports/CH9_V72_CONSOLIDATED_REREVIEW_ACCEPTANCE.log

      - name: Chapter 9 V72 source re-review and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH9_V72_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter9_synthesis_workspace as workspace

          review = Path('modules/deep_company_analysis/chapter9_synthesis_review.py').read_text(encoding='utf-8')
          ui = Path('modules/deep_company_analysis/chapter9_synthesis_ui.py').read_text(encoding='utf-8')
          report_ui = Path('modules/deep_company_analysis/chapter9_synthesis_report.py').read_text(encoding='utf-8')
          consolidated = Path('pages/04_Bao_cao_tong_hop.py').read_text(encoding='utf-8')
          store = Path('modules/deep_company_analysis/chapter9_synthesis_store.py').read_text(encoding='utf-8')
          docs = Path('docs/FORMULA_EXPLANATION_CHAPTER9_PHASE9K_V72.md').read_text(encoding='utf-8')
          report = json.loads(Path('reports/CH9_PHASE9K_CONSOLIDATED_REREVIEW_V72.json').read_text(encoding='utf-8'))

          assert 'import streamlit' not in review.casefold()
          assert 'sqlite3' not in review.casefold()
          assert 'accept_current_source_after_re_review' in ui
          assert 'disabled=not confirmed' in ui
          assert 'giữ nguyên baseline cũ' in ui
          assert 'create_snapshot(ticker, workspace)' in ui
          assert 'render_saved_management_synthesis_report' in consolidated
          assert 'Final Analyst Management Synthesis — Chapters 7–9' in report_ui
          assert 'Needs Re-review' in report_ui
          assert 'st.html(html)' in report_ui
          assert 'SCHEMA_VERSION = 2' in store
          assert 'no financial valuation formula' in docs.casefold()
          assert report['source_question_range'] == 'Q33–Q52'
          assert report['total_questions'] == 20
          assert report['manager_identity_ssot'] == 'Chapter 7 manager master'
          assert report['current_source_state'] == 'Current'
          assert report['stale_source_state'] == 'Needs Re-review'
          assert report['accepted_source_state'] == 'Current'
          assert report['ordinary_save_preserves_old_baseline_contract'] is True
          assert report['explicit_confirmation_required'] is True
          assert report['normal_snapshot_does_not_rebaseline'] is True
          assert report['consolidated_report_integrated'] is True
          assert report['report_read_only'] is True
          assert report['automatic_workspace_status_change'] is False
          assert report['automatic_analyst_text_change'] is False
          assert report['automatic_management_score'] is False
          assert report['automatic_investment_signal'] is False
          assert report['mos_or_investment_research_gate_changed'] is False
          assert 'management quality score' in workspace.SYNTHESIS_WORKSPACE_BOUNDARY.casefold()
          assert 'investment research gate' in workspace.SYNTHESIS_WORKSPACE_BOUNDARY.casefold()
          print('PASS: Phase 9K preserves analyst ownership, explicit re-review, Chapter 7 manager SSOT and investment boundaries.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH9_V72_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8544 \
            > reports/CH9_V72_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8544/_stcore/health \
              | tee reports/CH9_V72_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH9_V72_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V72 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 9 Phase 9K V72\nBranch: feature/deep-company-analysis-chapter9-phase9k-v72\nCommit: %s\nPurpose: consolidated saved analyst management synthesis with Current/Needs Re-review source freshness and explicit baseline acceptance; no management score or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH9_V72.txt
          zip -qr Trecapital_Deep_Analysis_Chapter9_Phase9K_V72.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter9_Phase9K_V72.zip | tail -n 3

      - name: Upload V72 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter9_Phase9K_V72
          retention-days: 90
          path: |
            docs/CHAPTER9_PHASE9K_CONSOLIDATED_REREVIEW_V72.md
            docs/FORMULA_EXPLANATION_CHAPTER9_PHASE9K_V72.md
            reports/CH9_PHASE9K_CONSOLIDATED_REREVIEW_V72.json
            reports/CH9_V72_DETERMINISTIC_TESTS.log
            reports/CH9_V72_CONSOLIDATED_REREVIEW_ACCEPTANCE.log
            reports/CH9_V72_BOUNDARY_AUDIT.log
            reports/CH9_V72_FULL_DCA_REGRESSION.log
            reports/CH9_V72_STREAMLIT_SERVER.log
            reports/CH9_V72_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter9_Phase9K_V72.zip
