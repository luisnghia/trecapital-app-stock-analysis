name: KHDN Production Snapshot Package

on:
  push:
    branches:
      - feature/khdn-official-bidv-ios-icon
    paths:
      - '.github/workflows/khdn-package-snapshot-temp.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: daaaeffa3884bb990047fa7e1a69a22afa038b1c
          fetch-depth: 1

      - name: Add snapshot metadata
        shell: bash
        run: |
          cat > KHDN_PRODUCTION_SNAPSHOT.txt <<'EOF'
          KHDN App Production Snapshot
          Snapshot date: 2026-09-14
          Railway project: Trecapital-KHDNApps
          Railway service: KHDNApps
          GitHub repository: luisnghia/trecapital-app-stock-analysis
          Branch: feature/khdn-official-bidv-ios-icon
          Production commit: daaaeffa3884bb990047fa7e1a69a22afa038b1c
          Railway start command: python -m khdn_apps.runtime
          Railway Dockerfile: khdn_apps/Dockerfile
          This package was generated from the exact production commit above.
          EOF

      - name: Upload KHDN production snapshot
        uses: actions/upload-artifact@v4
        with:
          name: KHDN_App_Production_2026-09-14_daaaeffa
          path: |
            khdn_apps/**
            tests/test_device_sessions.py
            tests/test_khdn_storage.py
            KHDN_PRODUCTION_SNAPSHOT.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
