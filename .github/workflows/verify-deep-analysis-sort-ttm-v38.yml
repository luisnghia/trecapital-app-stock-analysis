name: Deep Analysis V38 — Header Sort Everywhere + TTM Latest

on:
  push:
    branches: [feature/deep-company-analysis-sort-ttm-v38]
    paths:
      - 'modules/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'docs/DEEP_ANALYSIS_V38_HEADER_SORT_TTM_AUDIT.md'
      - '.github/workflows/verify-deep-analysis-sort-ttm-v38.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-sort-ttm-v38
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile production table layer and page
        run: |
          python -m py_compile modules/deep_company_analysis/table_format.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py

      - name: QA 1 — Header-sort contract
        run: pytest -q modules/deep_company_analysis/test_sortable_table_v32.py

      - name: QA 2 — TTM coverage and no fabrication
        run: pytest -q modules/deep_company_analysis/test_ttm_coverage_v32.py

      - name: QA 3 — Full Deep Company Analysis regression
        run: pytest -q modules/deep_company_analysis/test_*.py

      - name: Static audit — old sort implementation is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.py' \
            -e '"Sort theo cột"' \
            -e '"Thứ tự"' \
            -e 'ORIGINAL_ORDER_LABEL' \
            -e 'ASC_LABEL' \
            -e 'DESC_LABEL' \
            -e 'interactive_sort_frame' \
            -e '^def sort_frame(' \
            modules/deep_company_analysis | grep -v '/test_'; then
            echo 'Legacy sort implementation/control remains in production.'
            exit 1
          fi

      - name: Static audit — every Streamlit table goes through the shared renderer
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.py' \
            -e 'st\.dataframe(' \
            -e 'st\.data_editor(' \
            -e 'st\.table(' \
            modules/deep_company_analysis | grep -v '/test_' | grep -v 'table_format.py'; then
            echo 'A production table bypasses the shared header-sort layer.'
            exit 1
          fi
          if grep -R --line-number --include='*.py' 'num_rows="dynamic"' modules/deep_company_analysis/table_format.py; then
            echo 'Underlying shared Streamlit editor still uses dynamic rows and therefore disables header sort.'
            exit 1
          fi

      - name: Audit possible HTML table renderers
        shell: bash
        run: |
          echo 'Potential HTML table calls (review output; not an automatic failure unless interactive production UI uses them):'
          grep -R --line-number --include='*.py' \
            -e 'static_table_html(' \
            -e 'financial_table_html(' \
            -e 'st\.html(' \
            modules/deep_company_analysis | grep -v '/test_' || true

      - name: Audit period selectors
        shell: bash
        run: |
          echo 'Period-selector candidates for manual review:'
          grep -R --line-number --include='*.py' -i \
            -e 'selectbox.*kỳ' \
            -e 'selectbox.*period' \
            -e 'radio.*kỳ' \
            -e 'radio.*period' \
            modules/deep_company_analysis | grep -v '/test_' || true

      - name: Streamlit smoke
        shell: bash
        run: |
          mkdir -p reports
          timeout 60s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            --server.headless true --server.port 8548 >reports/DCA_V38_streamlit.log 2>&1 &
          PID=$!
          sleep 20
          curl --fail --silent http://127.0.0.1:8548/_stcore/health
          STATUS=$?
          kill $PID || true
          wait $PID || true
          tail -n 120 reports/DCA_V38_streamlit.log || true
          exit $STATUS

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DCA_V38_HEADER_SORT_TTM_REPORT
          path: reports/DCA_V38_streamlit.log
          if-no-files-found: warn
          retention-days: 30
