name: Deep Company Analysis Chapter 8 Phase 8K V56

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-direct-official-v56
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chapter8-phase8k:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Apply idempotent V56 UI wiring
        run: |
          set -euo pipefail
          python scripts/apply_chapter8_phase8k_ui_v56.py

      - name: Commit V56 UI wiring if needed
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "trecapital-ci"
            git config user.email "actions@users.noreply.github.com"
            git add modules/deep_company_analysis/chapter8_page_support.py
            git commit -m "feat(dca): wire Phase 8K direct official URLs into Chapter 8 UI"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No V56 UI migration changes to commit."
          fi

      - name: Compile V56 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_official_source_adapters.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v56.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile scripts/qa_chapter8_direct_official_v56.py

      - name: Chapter 8 Phase 8A-8K deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            2>&1 | tee reports/CH8_V56_DETERMINISTIC_TESTS.log

      - name: Live DGC direct official URL acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_direct_official_v56.py \
            2>&1 | tee reports/CH8_DGC_DIRECT_OFFICIAL_LIVE_V56.log

      - name: Chapter 8 V56 source, ticker and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V56_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_official_source_adapters import (
              OFFICIAL_DISCLOSURE_HOSTS, is_official_url,
          )

          compat = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8')
          page = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          core = Path('modules/deep_company_analysis/chapter8_official_source_adapters.py').read_text(encoding='utf-8').casefold()
          assert 'chapter8_research_v56 import *' in compat
          assert 'Phase 8K — Direct Official Source URLs' in page
          assert 'ingest_official_urls' in page
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert 'candidate — analyst verify' in core
          assert OFFICIAL_DISCLOSURE_HOSTS
          assert is_official_url('https://staticfile.hsx.vn/Uploads/UploadDocuments/x.pdf', 'DGC')
          assert not is_official_url('https://cafef.vn/x', 'DGC')
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V56 accepts only official allow-listed direct URLs, rejects wrong-source paths, and preserves analyst control.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V56_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8528 \
            > reports/CH8_V56_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8528/_stcore/health \
              | tee reports/CH8_V56_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V56_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V56 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8K V56\nBranch: feature/deep-company-analysis-chapter8-direct-official-v56\nCommit: %s\nPurpose: direct allow-listed company/exchange/regulator URL ingestion with ticker validation; analyst verification/promotion remains required.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V56.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8K_V56.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8K_V56.zip | tail -n 3

      - name: Upload V56 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8K_V56
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8K_DIRECT_OFFICIAL_URL_V56.md
            reports/CH8_DGC_DIRECT_OFFICIAL_ACCEPTANCE_V56.json
            reports/CH8_DGC_DIRECT_OFFICIAL_ATTEMPTS_V56.csv
            reports/CH8_DGC_DIRECT_OFFICIAL_DOCUMENTS_V56.csv
            reports/CH8_DGC_DIRECT_OFFICIAL_NEW_CANDIDATES_V56.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_BEFORE_V56.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_AFTER_V56.csv
            reports/CH8_DGC_REMAINING_GAPS_V56.csv
            reports/CH8_DGC_DIRECT_OFFICIAL_LIVE_V56.log
            reports/CH8_V56_DETERMINISTIC_TESTS.log
            reports/CH8_V56_BOUNDARY_AUDIT.log
            reports/CH8_V56_FULL_DCA_REGRESSION.log
            reports/CH8_V56_STREAMLIT_SERVER.log
            reports/CH8_V56_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8K_V56.zip
