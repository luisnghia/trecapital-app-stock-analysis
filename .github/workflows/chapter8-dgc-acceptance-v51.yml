name: Deep Company Analysis Chapter 8 DGC Acceptance V51

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-dgc-acceptance-v51
    paths:
      - '.github/workflows/chapter8-dgc-acceptance-v51.yml'
      - 'scripts/qa_chapter8_dgc_acceptance_v51.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter8-dgc-acceptance:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Chapter 8 acceptance
        run: |
          set -euo pipefail
          python -m compileall -q modules/deep_company_analysis
          python -m py_compile scripts/qa_chapter8_dgc_acceptance_v51.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py

      - name: Chapter 8 Phase 8A-8F deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            2>&1 | tee reports/CH8_V51_DETERMINISTIC_TESTS.log

      - name: Live DGC Q39-Q47 evidence acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_dgc_acceptance_v51.py \
            2>&1 | tee reports/CH8_DGC_LIVE_ACCEPTANCE_V51.log

      - name: DGC unified UI runtime acceptance
        run: |
          set -euo pipefail
          python scripts/qa_dca_dgc_interactive_v50.py \
            2>&1 | tee reports/CH8_DGC_UI_RUNTIME_V51.log
          if grep -qi "Tried to use SessionInfo before it was initialized" reports/CH8_DGC_UI_RUNTIME_V51.log; then
            echo "SessionInfo initialization race detected"
            exit 1
          fi
          if grep -qi "Bad message format" reports/CH8_DGC_UI_RUNTIME_V51.log; then
            echo "Bad message format detected"
            exit 1
          fi

      - name: Chapter 8 UI and source-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V51_UI_BOUNDARY_AUDIT.log
          import inspect
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8
          import modules.deep_company_analysis.chapter8_page_support as ui
          import modules.deep_company_analysis.chapter8_research as research

          page = Path('pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py').read_text(encoding='utf-8')
          ui_source = inspect.getsource(ui)
          research_source = inspect.getsource(research).casefold()
          assert 'render_chapter8_tab(chapter8_ticker)' in page
          assert 'if active_chapter == CHAPTER_OPTIONS[7]:' in page
          for q in ch8.QUESTION_KEYS:
              assert q in ui_source
          assert len(ch8.EMPLOYEE_RELATION_DIMENSIONS) == 14
          assert tuple(ch8.CAPITAL_ALLOCATION_ACTIONS) == (
              'Reinvest in business / new projects',
              'Hold cash',
              'Pay dividends',
              'Buy back stock',
              'Make acquisitions',
          )
          assert 'chapter 7 remains the manager identity/background single source of truth' in research_source
          assert 'trecapital canonical financial data remains the financial single source of truth' in research_source
          assert 'analyst_assessment' not in research_source
          assert 'no management score' in research_source
          assert 'no buy/hold/sell' in research_source
          print('PASS: Chapter 8 is integrated, source-locked, analyst-controlled and Q39-Q47 UI contract is present.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V51_FULL_DCA_REGRESSION.log

      - name: Production server health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8523 \
            > reports/CH8_V51_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8523/_stcore/health \
              | tee reports/CH8_V51_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V51_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline acceptance package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 DGC Acceptance V51\nBranch: feature/deep-company-analysis-chapter8-dgc-acceptance-v51\nCommit: %s\nPurpose: live DGC Q39-Q47 evidence coverage and gap acceptance; no auto promotion or analyst conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_DGC_V51.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_DGC_Acceptance_V51.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_DGC_Acceptance_V51.zip | tail -n 3

      - name: Upload V51 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_DGC_Acceptance_V51
          retention-days: 90
          path: |
            reports/CH8_DGC_ACCEPTANCE_V51.json
            reports/CH8_DGC_ACCEPTANCE_V51.md
            reports/CH8_DGC_Q39_Q47_EVIDENCE_COVERAGE_V51.csv
            reports/CH8_DGC_RESEARCH_GAPS_V51.csv
            reports/CH8_DGC_CANDIDATES_V51.csv
            reports/CH8_DGC_MANAGERS_FROM_CH7_V51.csv
            reports/CH8_DGC_SOURCE_ATTEMPTS_V51.csv
            reports/CH8_DGC_LIVE_ACCEPTANCE_V51.log
            reports/CH8_DGC_UI_RUNTIME_V51.log
            reports/CH8_V51_DETERMINISTIC_TESTS.log
            reports/CH8_V51_UI_BOUNDARY_AUDIT.log
            reports/CH8_V51_FULL_DCA_REGRESSION.log
            reports/CH8_V51_STREAMLIT_SERVER.log
            reports/CH8_V51_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_DGC_Acceptance_V51.zip
