name: Deep Company Analysis Cyclical Normalization V100

on:
  push:
    branches:
      - feature/deep-company-analysis-cyclical-normalization-v100
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  cyclical-normalization-v100:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V100
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/cyclical_normalization.py
          python -m py_compile modules/deep_company_analysis/test_cyclical_normalization_v100.py
          python -m py_compile scripts/qa_cyclical_normalization_v100.py
          python -m py_compile app.py

      - name: V100 deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_cyclical_normalization_v100.py \
            2>&1 | tee reports/CYCLICAL_NORMALIZATION_V100_DETERMINISTIC_TESTS.log

      - name: V100 deterministic acceptance
        run: |
          set -euo pipefail
          python scripts/qa_cyclical_normalization_v100.py \
            2>&1 | tee reports/CYCLICAL_NORMALIZATION_V100_ACCEPTANCE.log

      - name: SSOT and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CYCLICAL_NORMALIZATION_V100_BOUNDARY_AUDIT.log
          import json
          from pathlib import Path
          report = json.loads(Path('reports/CYCLICAL_NORMALIZATION_V100_ACCEPTANCE.json').read_text(encoding='utf-8'))
          assert report['acceptance'] == 'PASS'
          assert report['duplicate_financial_ssot_added'] is False
          assert report['valuation_formula_changed'] is False
          assert report['automatic_weighted_score'] is False
          assert report['automatic_buy_hold_sell'] is False
          assert report['automatic_research_gate_change'] is False
          assert report['ai_role'] == 'Research Assistant'
          assert report['conclusion_owner'] == 'Analyst'
          print('PASS: V100 remains a read-only cycle context layer over canonical financial data.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CYCLICAL_NORMALIZATION_V100_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 \
            > reports/CYCLICAL_NORMALIZATION_V100_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health \
              | tee reports/CYCLICAL_NORMALIZATION_V100_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CYCLICAL_NORMALIZATION_V100_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V100 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Cyclical Normalization V100\nBranch: feature/deep-company-analysis-cyclical-normalization-v100\nCommit: %s\nPurpose: 5-10Y descriptive cycle normalization over canonical Trecapital data.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CYCLICAL_NORMALIZATION_V100.txt
          zip -qr Trecapital_Deep_Analysis_Cyclical_Normalization_V100.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Cyclical_Normalization_V100.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_Cyclical_Normalization_V100.zip \
            | tee reports/CYCLICAL_NORMALIZATION_V100_OFFLINE_ZIP_SHA256.txt

      - name: Upload V100 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Cyclical_Normalization_V100
          retention-days: 90
          path: |
            CHANGELOG_V100_DEEP_ANALYSIS_CYCLICAL_NORMALIZATION.md
            docs/DEEP_ANALYSIS_CYCLICAL_NORMALIZATION_V100.md
            reports/CYCLICAL_NORMALIZATION_V100_ACCEPTANCE.json
            reports/CYCLICAL_NORMALIZATION_V100_DETERMINISTIC_TESTS.log
            reports/CYCLICAL_NORMALIZATION_V100_ACCEPTANCE.log
            reports/CYCLICAL_NORMALIZATION_V100_BOUNDARY_AUDIT.log
            reports/CYCLICAL_NORMALIZATION_V100_FULL_DCA_REGRESSION.log
            reports/CYCLICAL_NORMALIZATION_V100_STREAMLIT_SERVER.log
            reports/CYCLICAL_NORMALIZATION_V100_STREAMLIT_HEALTH.txt
            reports/CYCLICAL_NORMALIZATION_V100_OFFLINE_ZIP_SHA256.txt
            Trecapital_Deep_Analysis_Cyclical_Normalization_V100.zip
