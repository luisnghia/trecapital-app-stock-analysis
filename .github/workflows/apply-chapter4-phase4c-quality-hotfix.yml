name: Apply Chapter 4 Phase 4C Quality Hotfix

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'scripts/apply_chapter4_phase4c_quality_hotfix.py'
      - '.github/workflows/apply-chapter4-phase4c-quality-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Apply hotfix
        run: python scripts/apply_chapter4_phase4c_quality_hotfix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
      - name: Run Phase 4C peer/evidence tests
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter4_peer_auto.py
          python -m pytest -q modules/deep_company_analysis/test_chapter4_evidence.py
      - name: Run full Deep Analysis regression
        run: python -m pytest -q modules/deep_company_analysis
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8511 > /tmp/ch4c_hotfix.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8511/_stcore/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then cat /tmp/ch4c_hotfix.log; kill "$PID" 2>/dev/null || true; exit 1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter4_peer_auto.py \
                  modules/deep_company_analysis/chapter4_evidence.py \
                  modules/deep_company_analysis/chapter4_page_support.py \
                  modules/deep_company_analysis/test_chapter4_evidence.py
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "fix(ch4): complete auto-industry Q17 and evidence quality guardrails"
            git push origin HEAD:feature/deep-company-analysis-checklist
          fi
