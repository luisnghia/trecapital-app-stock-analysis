name: Deep Company Analysis CI

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'modules/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'tre_sidebar_nav.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'
  pull_request:
    paths:
      - 'modules/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'tre_sidebar_nav.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'

jobs:
  chapter1-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Chapter 1
        run: |
          python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py tre_sidebar_nav.py
      - name: Run Chapter 1 offline tests
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter1.py
      - name: Build Windows offline source package
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="Trecapital_Deep_Analysis_Offline_V1"
          mkdir -p "dist/${PKG_NAME}"
          rsync -a ./ "dist/${PKG_NAME}/" \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.log'
          mkdir -p "dist/${PKG_NAME}/data_cache"
          (cd dist && zip -qr "${PKG_NAME}.zip" "${PKG_NAME}")
          sha256sum "dist/${PKG_NAME}.zip" > "dist/${PKG_NAME}.zip.sha256"
      - name: Upload downloadable offline package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Offline_V1
          path: |
            dist/Trecapital_Deep_Analysis_Offline_V1.zip
            dist/Trecapital_Deep_Analysis_Offline_V1.zip.sha256
          if-no-files-found: error
          retention-days: 30
