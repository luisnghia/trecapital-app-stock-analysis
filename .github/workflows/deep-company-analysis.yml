name: Deep Company Analysis CI

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'modules/deep_company_analysis/**'
      - 'sample_data/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'pages/08_Phan_tich_chuyen_sau_Chuong_2.py'
      - 'tre_sidebar_nav.py'
      - 'tools/dgc_chapter2_e2e.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER2.md'
      - 'docs/CHAPTER2_PHASE2B_TRECAPITAL_EVIDENCE_BRIDGE.md'
      - 'docs/DGC_CHAPTER1_TRIAL_AUTODATA_AUDIT.md'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'
  pull_request:
    paths:
      - 'modules/deep_company_analysis/**'
      - 'sample_data/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'pages/08_Phan_tich_chuyen_sau_Chuong_2.py'
      - 'tre_sidebar_nav.py'
      - 'tools/dgc_chapter2_e2e.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER2.md'
      - 'docs/CHAPTER2_PHASE2B_TRECAPITAL_EVIDENCE_BRIDGE.md'
      - 'docs/DGC_CHAPTER1_TRIAL_AUTODATA_AUDIT.md'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'

permissions:
  contents: read

jobs:
  deep-analysis-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile deep-analysis Chapters 1-2
        run: |
          python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/08_Phan_tich_chuyen_sau_Chuong_2.py tre_sidebar_nav.py tools/dgc_chapter2_e2e.py
      - name: Run full deep-analysis regression suite
        run: |
          python -m pytest -q modules/deep_company_analysis
      - name: Run Chapter 1 final DGC acceptance explicitly
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter1_final_acceptance.py
      - name: Run Chapter 2 Phase 2A acceptance explicitly
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter2.py
      - name: Run Chapter 2 Phase 2B data/evidence bridge explicitly
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter2_auto.py
      - name: Run Chapter 2 source-first evidence tests explicitly
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter2_evidence.py
      - name: Run live DGC Chapter 2 end-to-end diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python tools/dgc_chapter2_e2e.py | tee dgc_chapter2_e2e.log
      - name: Smoke-test unified Deep Analysis page startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            --server.headless true --server.port 8507 > /tmp/trecapital_dca.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8507/_stcore/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then cat /tmp/trecapital_dca.log; kill "$PID" 2>/dev/null || true; exit 1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - name: Smoke-test legacy Chapter 2 compatibility page
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/08_Phan_tich_chuyen_sau_Chuong_2.py \
            --server.headless true --server.port 8508 > /tmp/trecapital_dca_ch2_legacy.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8508/_stcore/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then cat /tmp/trecapital_dca_ch2_legacy.log; kill "$PID" 2>/dev/null || true; exit 1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - name: Build lightweight Windows offline package V11
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="Trecapital_Deep_Analysis_Offline_V11"
          rm -rf dist
          mkdir -p "dist/${PKG_NAME}"
          rsync -a ./ "dist/${PKG_NAME}/" \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'offline_wheels' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.log'
          mkdir -p "dist/${PKG_NAME}/data_cache"
          test -f "dist/${PKG_NAME}/CHAY_TRECAPITAL_OFFLINE.bat"
          test -f "dist/${PKG_NAME}/pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py"
          test -f "dist/${PKG_NAME}/pages/08_Phan_tich_chuyen_sau_Chuong_2.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter1.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter2.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter2_auto.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter2_evidence.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter2_page_support.py"
          test -f "dist/${PKG_NAME}/docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER2.md"
          test -f "dist/${PKG_NAME}/docs/CHAPTER2_PHASE2B_TRECAPITAL_EVIDENCE_BRIDGE.md"
          test ! -d "dist/${PKG_NAME}/offline_wheels"
          (cd dist && zip -qr "${PKG_NAME}.zip" "${PKG_NAME}")
          sha256sum "dist/${PKG_NAME}.zip" > "dist/${PKG_NAME}.zip.sha256"
      - name: Upload DGC E2E audit
        uses: actions/upload-artifact@v4
        with:
          name: DGC_Chapter2_E2E_Audit
          path: dgc_chapter2_e2e.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload offline package V11
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Offline_V11
          path: |
            dist/Trecapital_Deep_Analysis_Offline_V11.zip
            dist/Trecapital_Deep_Analysis_Offline_V11.zip.sha256
          if-no-files-found: error
          retention-days: 30
