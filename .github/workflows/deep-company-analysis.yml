name: Deep Company Analysis CI

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'modules/deep_company_analysis/**'
      - 'sample_data/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'tre_sidebar_nav.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'docs/DGC_CHAPTER1_TRIAL_AUTODATA_AUDIT.md'
      - 'scripts/apply_deep_analysis_chapter1_v4_patch.py'
      - 'scripts/apply_deep_analysis_chapter1_v5_monitoring_patch.py'
      - 'scripts/apply_deep_analysis_chapter1_v6_trigger_builder_patch.py'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'
  pull_request:
    paths:
      - 'modules/deep_company_analysis/**'
      - 'sample_data/deep_company_analysis/**'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'tre_sidebar_nav.py'
      - 'docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER1.md'
      - 'docs/DGC_CHAPTER1_TRIAL_AUTODATA_AUDIT.md'
      - 'scripts/apply_deep_analysis_chapter1_v4_patch.py'
      - 'scripts/apply_deep_analysis_chapter1_v5_monitoring_patch.py'
      - 'scripts/apply_deep_analysis_chapter1_v6_trigger_builder_patch.py'
      - 'CHAY_TRECAPITAL_OFFLINE.bat'
      - 'CAI_THU_VIEN_MOT_LAN.bat'
      - 'HUONG_DAN_CHAY_OFFLINE.txt'
      - '.github/workflows/deep-company-analysis.yml'

permissions:
  contents: write

jobs:
  chapter1-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Apply Chapter 1 V4 Opportunity Signals patch
        run: |
          python scripts/apply_deep_analysis_chapter1_v4_patch.py
      - name: Apply Chapter 1 V5 Monitoring patch
        run: |
          python scripts/apply_deep_analysis_chapter1_v5_monitoring_patch.py
      - name: Apply Chapter 1 V6 Structured Trigger patch
        run: |
          python scripts/apply_deep_analysis_chapter1_v6_trigger_builder_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Chapter 1
        run: |
          python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py tre_sidebar_nav.py
      - name: Run full Chapter 1 regression suite
        run: |
          python -m pytest -q modules/deep_company_analysis
      - name: Run final DGC end-to-end acceptance explicitly
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter1_final_acceptance.py
      - name: Smoke-test Deep Company Analysis page startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            --server.headless true --server.port 8507 > /tmp/trecapital_dca.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8507/_stcore/health >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then
            cat /tmp/trecapital_dca.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - name: Commit generated V6 source on branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=(modules/deep_company_analysis/chapter1.py modules/deep_company_analysis/trecapital_auto.py modules/deep_company_analysis/monitoring.py pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py)
          if git diff --quiet -- "${TRACKED[@]}"; then
            echo "Chapter 1 source already at V6."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${TRACKED[@]}"
            git commit -m "feat(deep-analysis): integrate structured trigger builder [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build final lightweight Windows offline package V7
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="Trecapital_Deep_Analysis_Offline_V7"
          rm -rf dist
          mkdir -p "dist/${PKG_NAME}"
          rsync -a ./ "dist/${PKG_NAME}/" \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'offline_wheels' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.log'
          mkdir -p "dist/${PKG_NAME}/data_cache"
          test -f "dist/${PKG_NAME}/CHAY_TRECAPITAL_OFFLINE.bat"
          test -f "dist/${PKG_NAME}/pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter1.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/monitoring.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/structured_triggers.py"
          test ! -d "dist/${PKG_NAME}/offline_wheels"
          (cd dist && zip -qr "${PKG_NAME}.zip" "${PKG_NAME}")
          sha256sum "dist/${PKG_NAME}.zip" > "dist/${PKG_NAME}.zip.sha256"
      - name: Upload final Chapter 1 offline package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Offline_V7
          path: |
            dist/Trecapital_Deep_Analysis_Offline_V7.zip
            dist/Trecapital_Deep_Analysis_Offline_V7.zip.sha256
          if-no-files-found: error
          retention-days: 30
