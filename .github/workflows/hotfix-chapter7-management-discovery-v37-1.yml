name: Chapter 7 V37.1 — Management Discovery Hotfix + DGC Round 5AC

on:
  push:
    branches: [feature/deep-company-analysis-chapter7]
    paths: ['.github/workflows/hotfix-chapter7-management-discovery-v37-1.yml']

permissions:
  contents: write

jobs:
  hotfix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply cumulative V37.1 discovery fixes
        run: |
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5i.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5j.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5k.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5l.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5m.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5n.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5o.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5p.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5q.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5r.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5s.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5t.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5u.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5v.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5x.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5y.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5z.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5aa.py
          python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5ac.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Chapter 7 V37.1
        run: |
          python -m py_compile modules/deep_company_analysis/chapter7_management_discovery.py
          python -m py_compile modules/deep_company_analysis/chapter7_research.py
          python -m py_compile modules/deep_company_analysis/chapter7_research_ui.py
          python -m py_compile scripts/qa_chapter7_v37_1_dgc.py

      - name: QA 1 — Management discovery unit and analyst boundary
        run: pytest -q modules/deep_company_analysis/test_chapter7_management_discovery.py

      - name: QA 2 — Full Chapter 7 regression
        run: pytest -q modules/deep_company_analysis/test_chapter7*.py

      - name: DGC Round 5AC — strict production path live acceptance
        run: PYTHONPATH=. python scripts/qa_chapter7_v37_1_dgc.py

      - name: Streamlit smoke after hotfix
        shell: bash
        run: |
          timeout 55s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8538 >reports/DGC_V37_1_streamlit.log 2>&1 &
          PID=$!
          sleep 18
          curl --fail --silent http://127.0.0.1:8538/_stcore/health
          STATUS=$?
          kill $PID || true
          wait $PID || true
          tail -n 120 reports/DGC_V37_1_streamlit.log || true
          exit $STATUS

      - name: Write V37.1 audit record
        shell: bash
        run: |
          cat > docs/DEEP_ANALYSIS_CHAPTER7_V37_1_MANAGEMENT_DISCOVERY_AUDIT.md <<'EOF'
          # Chapter 7 V37.1 — Management Discovery Hotfix Audit

          Status: PASS

          - Company/IR discovery remains candidate-only and analyst-verification required.
          - Missing Chairman/CEO roles first receive a role-only search over the configured official company domain; no expected manager name is hard-coded into the query.
          - A fallback document can consume the role evidence budget only if the normal production parser extracts the requested person+role from that same document.
          - Generic role mentions plus unrelated names no longer starve later governance/BCTC evidence.
          - If a priority role still remains missing, Tier-A exchange/regulator fallback may search HSX/HNX/SSC/UPCoM official disclosures.
          - Secondary financial/news sources are excluded from management identity fallback even when their snippets name the manager.
          - A company/exchange result becomes a candidate only after original HTML/PDF text is fetched and the person plus role are locally explicit.
          - No OCR is introduced; image-only/scanned PDFs remain unresolved unless another text-extractable Tier-A official source provides the same identity evidence.
          - Company/IR and exchange/regulator candidates are merged with source URL, as-of date and analyst-verification status preserved.
          - Current Chairman/CEO identities must be reachable from Tier-A official evidence; no identity is inferred from a title, URL, family relationship or missing evidence.
          - Personnel event roles/dates remain occurrence- and clause-local; ended roles are not silently treated as current.
          - No automatic OO/LT/HH, Lion/Hyena, Management Quality, insider Buy/Sell, MOS or Research Gate conclusion.
          - DGC Round 5AC strict production-path live acceptance passed.
          - Unified Streamlit smoke passed.
          EOF

      - name: Commit V37.1 production hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter7_management_discovery.py
          git add modules/deep_company_analysis/chapter7_research.py
          git add modules/deep_company_analysis/test_chapter7_management_discovery.py
          git add modules/deep_company_analysis/test_chapter7_phase7c.py
          git add scripts/qa_chapter7_v37_1_dgc.py
          git add docs/DEEP_ANALYSIS_CHAPTER7_V37_1_MANAGEMENT_DISCOVERY_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(ch7): finalize management discovery V37.1 round5ac"
            git push origin HEAD:feature/deep-company-analysis-chapter7
          fi

      - name: Upload DGC Round 5AC diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DGC_V37_1_ROUND5AC_REPORT
          path: |
            reports/DGC_V37_1_ROUND3.json
            reports/DGC_V37_1_ROUND3.md
            reports/DGC_V37_1_discovered_managers.csv
            reports/DGC_V37_1_research_candidates.csv
            reports/DGC_V37_1_quality.csv
            reports/DGC_V37_1_streamlit.log
          if-no-files-found: warn
          retention-days: 30
