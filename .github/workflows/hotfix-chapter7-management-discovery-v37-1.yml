name: Chapter 7 V37.1 — Management Discovery Hotfix + DGC Round 5L

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter7
    paths:
      - '.github/workflows/hotfix-chapter7-management-discovery-v37-1.yml'

permissions:
  contents: write

jobs:
  hotfix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter7
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply Round 5I event/date/provenance fix
        run: python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5i.py

      - name: Apply Round 5J local-event anchoring fix
        run: python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5j.py

      - name: Apply Round 5K ended-role suppression fix
        run: python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5k.py

      - name: Apply Round 5L clause-local event cleanup
        run: python scripts/apply_chapter7_management_discovery_hotfix_v37_1_round5l.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Chapter 7 V37.1
        run: |
          python -m py_compile modules/deep_company_analysis/chapter7_management_discovery.py
          python -m py_compile modules/deep_company_analysis/chapter7_research.py
          python -m py_compile modules/deep_company_analysis/chapter7_research_ui.py
          python -m py_compile scripts/qa_chapter7_v37_1_dgc.py

      - name: QA 1 — Management discovery unit and analyst boundary
        run: pytest -q modules/deep_company_analysis/test_chapter7_management_discovery.py

      - name: QA 2 — Full Chapter 7 regression
        run: pytest -q modules/deep_company_analysis/test_chapter7*.py

      - name: DGC Round 5L — strict production path live acceptance
        run: PYTHONPATH=. python scripts/qa_chapter7_v37_1_dgc.py

      - name: Streamlit smoke after hotfix
        shell: bash
        run: |
          timeout 55s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8538 >reports/DGC_V37_1_streamlit.log 2>&1 &
          PID=$!
          sleep 18
          curl --fail --silent http://127.0.0.1:8538/_stcore/health
          STATUS=$?
          kill $PID || true
          wait $PID || true
          tail -n 120 reports/DGC_V37_1_streamlit.log || true
          exit $STATUS

      - name: Write V37.1 audit record
        shell: bash
        run: |
          printf '%s\n' \
            '# Chapter 7 V37.1 — Management Discovery Hotfix Audit' \
            '' \
            'Status: PASS' \
            '' \
            '- Empty Management Profile triggers candidate-manager discovery from company/IR sources.' \
            '- Candidate identity filtering rejects organization, navigation, document-heading, date-word and place fragments before they enter the manager dataset.' \
            '- Related-person wording is recognized only when the relationship label immediately follows the name.' \
            '- Research-target selection explicitly covers strongest available Chairman and CEO candidates before filling the remaining top-five queue.' \
            '- Roster/table rows use row-local role mapping; personnel-change prose uses occurrence-local role resolution.' \
            '- Bare-table and role-before-name fallback parsers are disabled for local contexts that already contain honorific person markers, preventing fallback role leakage in ordinary personnel prose.' \
            '- Repeated occurrences of the same manager in one document are anchored to the occurrence nearest the current extraction context.' \
            '- Candidate As-of Date uses manager-local event/reporting year before source-level fallback; unrelated later page years cannot silently make a candidate look newer.' \
            '- Generic navigation labels such as Tiếng Việt/English/Home are replaced with a usable official-disclosure source label derived from the URL.' \
            '- Final role-specific event cleanup is clause-local: it suppresses only a role explicitly ended for that manager in that event clause, preserving a later different-role appointment and preserving historical roles from separate earlier sources.' \
            '- DGC strict acceptance requires Lưu Bách Đạt CEO 2025+ and Đào Hữu Duy Anh Vice Chairman 2025+, and rejects the dismissed Duy Anh CEO 2025 row as current.' \
            '- Official genuinely bare table rows and signed role-before-name disclosures remain supported.' \
            '- Compound titles remain specificity-first.' \
            '- Discovered identities remain analyst-verification candidates and never overwrite Management Profile.' \
            '- No automatic OO/LT/HH, Lion/Hyena, Management Quality, insider Buy/Sell, MOS or Research Gate conclusion.' \
            '- DGC Round 5L strict production-path live acceptance passed.' \
            '- Unified Streamlit smoke passed.' \
            > docs/DEEP_ANALYSIS_CHAPTER7_V37_1_MANAGEMENT_DISCOVERY_AUDIT.md

      - name: Commit V37.1 production hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter7_management_discovery.py
          git add modules/deep_company_analysis/test_chapter7_management_discovery.py
          git add scripts/qa_chapter7_v37_1_dgc.py
          git add docs/DEEP_ANALYSIS_CHAPTER7_V37_1_MANAGEMENT_DISCOVERY_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(ch7): finalize management discovery V37.1 round5l"
            git push origin HEAD:feature/deep-company-analysis-chapter7
          fi

      - name: Upload DGC Round 5L diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DGC_V37_1_ROUND5L_REPORT
          path: |
            reports/DGC_V37_1_ROUND3.json
            reports/DGC_V37_1_ROUND3.md
            reports/DGC_V37_1_discovered_managers.csv
            reports/DGC_V37_1_research_candidates.csv
            reports/DGC_V37_1_quality.csv
            reports/DGC_V37_1_streamlit.log
          if-no-files-found: warn
          retention-days: 30
