name: Deep Company Analysis Chapter 8 Phase 8I V54

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-official-deep-retrieval-v54
  workflow_dispatch:

jobs:
  chapter8-phase8i:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V54 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_official_deep_retrieval.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v54.py
          python -m py_compile scripts/qa_chapter8_official_deep_v54.py

      - name: Chapter 8 Phase 8A-8I deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            2>&1 | tee reports/CH8_V54_DETERMINISTIC_TESTS.log

      - name: Live DGC official deep retrieval acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_official_deep_v54.py \
            2>&1 | tee reports/CH8_DGC_OFFICIAL_DEEP_LIVE_V54.log

      - name: Chapter 8 V54 source and analyst boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V54_BOUNDARY_AUDIT.log
          from pathlib import Path
          import pandas as pd
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_official_deep_retrieval import build_official_deep_targets

          page_support = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          compat = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8')
          core = Path('modules/deep_company_analysis/chapter8_official_deep_retrieval.py').read_text(encoding='utf-8').casefold()
          assert 'chapter8_research_v52 import CANDIDATE_COLUMNS, Chapter8ResearchAgent' in page_support
          assert 'chapter8_research_v54 import *' in compat
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          targets = build_official_deep_targets(pd.DataFrame(), max_targets=64)
          assert len(targets[targets['Question'].eq('Q43')]) == 14
          assert len(targets[targets['Question'].eq('Q46')]) == 5
          assert 'discipline_hurdle_context' not in set(targets['Dimension Key'])
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'buy-hold-sell' in core
          print('PASS: V54 deep retrieval targets only open source-locked dimensions and preserves analyst control.')
          PY

      - name: Full Deep Company Analysis regression
        shell: bash
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V54_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8526 \
            > reports/CH8_V54_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8526/_stcore/health \
              | tee reports/CH8_V54_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V54_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V54 package
        shell: bash
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8I V54\nBranch: feature/deep-company-analysis-chapter8-official-deep-retrieval-v54\nCommit: %s\nPurpose: bounded official-document deep retrieval for remaining source-locked dimensions; analyst verification/promotion remains required.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V54.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8I_V54.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8I_V54.zip | tail -n 3

      - name: Upload V54 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8I_V54
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8I_OFFICIAL_DEEP_RETRIEVAL.md
            reports/CH8_DGC_OFFICIAL_DEEP_ACCEPTANCE_V54.json
            reports/CH8_DGC_OFFICIAL_DEEP_TARGETS_V54.csv
            reports/CH8_DGC_OFFICIAL_DEEP_ATTEMPTS_V54.csv
            reports/CH8_DGC_OFFICIAL_DEEP_DOCUMENTS_V54.csv
            reports/CH8_DGC_OFFICIAL_DEEP_NEW_CANDIDATES_V54.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_BEFORE_V54.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_AFTER_V54.csv
            reports/CH8_DGC_REMAINING_GAPS_V54.csv
            reports/CH8_DGC_OFFICIAL_DEEP_LIVE_V54.log
            reports/CH8_V54_DETERMINISTIC_TESTS.log
            reports/CH8_V54_BOUNDARY_AUDIT.log
            reports/CH8_V54_FULL_DCA_REGRESSION.log
            reports/CH8_V54_STREAMLIT_SERVER.log
            reports/CH8_V54_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8I_V54.zip
