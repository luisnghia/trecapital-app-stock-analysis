name: Deep Company Analysis Chapter 8 Phase 8A V42 — Source Lock

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-phase8a-v42
    paths:
      - 'modules/deep_company_analysis/chapter8.py'
      - 'modules/deep_company_analysis/test_chapter8_phase8a.py'
      - 'docs/CHAPTER8_PHASE8A_SOURCE_LOCK.md'
      - '.github/workflows/chapter8-phase8a-source-lock-v42.yml'
  pull_request:
    paths:
      - 'modules/deep_company_analysis/chapter8.py'
      - 'modules/deep_company_analysis/test_chapter8_phase8a.py'
      - 'docs/CHAPTER8_PHASE8A_SOURCE_LOCK.md'

permissions:
  contents: read

jobs:
  chapter8-phase8a-source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Chapter 8 Phase 8A
        run: |
          python -m py_compile \
            modules/deep_company_analysis/chapter8.py \
            modules/deep_company_analysis/test_chapter8_phase8a.py

      - name: QA 1 — Chapter 8 source-lock contract
        run: pytest -q modules/deep_company_analysis/test_chapter8_phase8a.py

      - name: QA 2 — Full Deep Company Analysis regression
        run: pytest -q modules/deep_company_analysis/test_*.py

      - name: QA 3 — Static source boundary audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8

          assert ch8.QUESTION_KEYS == tuple(f"Q{i}" for i in range(39, 48))
          assert len(ch8.EMPLOYEE_RELATION_DIMENSIONS) == 14
          assert len(ch8.CAPITAL_ALLOCATION_ACTIONS) == 5
          assert not any('debt' in item.lower() for item in ch8.CAPITAL_ALLOCATION_ACTIONS)
          payload = ch8.empty_payload('DGC')
          assert all(v == 'Unknown' for v in payload['analyst_assessment'].values())
          source = Path('modules/deep_company_analysis/chapter8.py').read_text(encoding='utf-8')
          assert 'Chapter 7 remains the manager-identity/background source' in source
          print('Chapter 8 Phase 8A source boundary: PASS')
          PY

      - name: DCA Streamlit smoke — existing Ch1-Ch7 surface unchanged
        shell: bash
        run: |
          timeout 40s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8528 >/tmp/dca_v42_smoke.log 2>&1 &
          PID=$!
          sleep 15
          curl --fail --silent http://127.0.0.1:8528/_stcore/health
          kill $PID || true
          wait $PID || true
          tail -n 120 /tmp/dca_v42_smoke.log || true

      - name: Phase 8A acceptance marker
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marker = {
              'phase': 'Chapter 8 Phase 8A Source Lock V42',
              'acceptance': 'PASS',
              'questions': [f'Q{i}' for i in range(39, 48)],
              'employee_dimensions': 14,
              'shearn_capital_allocation_actions': 5,
              'ui_integration': 'deferred to later phase',
              'automated_research': 'deferred to Phase 8C',
              'analyst_boundary': 'locked',
          }
          Path('CHAPTER8_PHASE8A_V42_ACCEPTANCE.json').write_text(
              json.dumps(marker, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print(json.dumps(marker, indent=2, ensure_ascii=False))
          PY

      - name: Upload Phase 8A acceptance
        uses: actions/upload-artifact@v4
        with:
          name: CHAPTER8_PHASE8A_V42_ACCEPTANCE
          path: CHAPTER8_PHASE8A_V42_ACCEPTANCE.json
          retention-days: 90
