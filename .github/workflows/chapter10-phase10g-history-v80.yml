name: Deep Company Analysis Chapter 10 Phase 10G History V80

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter10-phase10g-v80
  workflow_dispatch:

jobs:
  chapter10-phase10g:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports
      - name: Compile Chapter 10 V80
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter10_history.py
          python -m py_compile modules/deep_company_analysis/chapter10_store.py
          python -m py_compile modules/deep_company_analysis/test_chapter10_phase10g.py
          python -m py_compile scripts/qa_chapter10_history_v80.py
          python -m py_compile app.py
      - name: Chapter 10 cumulative deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_chapter10_phase10*.py 2>&1 | tee reports/CH10_V80_DETERMINISTIC_TESTS.log
      - name: Chapter 10 V80 history acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter10_history_v80.py 2>&1 | tee reports/CH10_V80_HISTORY_ACCEPTANCE.log
      - name: Chapter 10 V80 source and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH10_V80_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter10 as ch10
          import modules.deep_company_analysis.chapter10_history as h
          import modules.deep_company_analysis.chapter10_store as s
          src = Path(h.__file__).read_text(encoding='utf-8').casefold()
          assert ch10.QUESTION_KEYS == ('Q53','Q54','Q55','Q56','Q57')
          assert len(ch10.dimension_ids()) == 34
          assert s.SCHEMA_VERSION == 2
          assert 'historical source freshness is never reconstructed' in src
          assert 'ccc =' not in src
          assert 'automatic_growth_score' in src
          assert 'automatic_investment_signal' in src
          print('PASS: V80 preserves source lock, immutable history, analyst ownership, SSOT and investment boundaries.')
          PY
      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH10_V80_FULL_DCA_REGRESSION.log
      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8550 > reports/CH10_V80_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8550/_stcore/health | tee reports/CH10_V80_STREAMLIT_HEALTH.txt | grep -q ok; then exit 0; fi
            sleep 1
          done
          cat reports/CH10_V80_STREAMLIT_SERVER.log
          exit 1
      - name: Build offline V80 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 10 Phase 10G V80\nBranch: feature/deep-company-analysis-chapter10-phase10g-v80\nCommit: %s\nPurpose: immutable Chapter 10 snapshots, neutral delta/version lineage and explicit analyst re-review; no growth score, forecast, duplicate financial SSOT, MOS/Research Gate change, or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH10_V80.txt
          zip -qr Trecapital_Deep_Analysis_Chapter10_Phase10G_V80.zip . -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter10_Phase10G_V80.zip | tail -n 3
      - name: Upload V80 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter10_Phase10G_V80
          retention-days: 90
          path: |
            docs/CHAPTER10_PHASE10G_HISTORY_V80.md
            docs/FORMULA_EXPLANATION_CHAPTER10_PHASE10G_V80.md
            reports/CH10_V80_DETERMINISTIC_TESTS.log
            reports/CH10_V80_HISTORY_ACCEPTANCE.log
            reports/CH10_V80_BOUNDARY_AUDIT.log
            reports/CH10_V80_FULL_DCA_REGRESSION.log
            reports/CH10_V80_STREAMLIT_SERVER.log
            reports/CH10_V80_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter10_Phase10G_V80.zip
