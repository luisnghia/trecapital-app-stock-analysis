name: Deep Company Analysis Chapter 8 Phase 8N OCR V59

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-ocr-v59
    paths:
      - 'modules/deep_company_analysis/**'
      - 'scripts/qa_chapter8_ocr_v59.py'
      - 'docs/CHAPTER8_PHASE8N_SCANNED_PDF_OCR_V59.md'
      - 'packages.txt'
      - '.github/workflows/chapter8-phase8n-ocr-v59.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter8-phase8n:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install OCR runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          pdftoppm -v 2>&1 | head -n 2 || true
          tesseract --version | head -n 2
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V59 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_pdf_ocr.py
          python -m py_compile modules/deep_company_analysis/chapter8_official_file_ingestion_v59.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v59.py
          python -m py_compile scripts/qa_chapter8_ocr_v59.py

      - name: Chapter 8 Phase 8A-8N deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            modules/deep_company_analysis/test_chapter8_phase8l.py \
            modules/deep_company_analysis/test_chapter8_phase8m.py \
            modules/deep_company_analysis/test_chapter8_phase8n.py \
            2>&1 | tee reports/CH8_V59_DETERMINISTIC_TESTS.log

      - name: Live DGC scanned-PDF OCR acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_ocr_v59.py \
            2>&1 | tee reports/CH8_DGC_OCR_LIVE_V59.log

      - name: Chapter 8 V59 source and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V59_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_pdf_ocr import ocr_runtime_status

          core = Path('modules/deep_company_analysis/chapter8_pdf_ocr.py').read_text(encoding='utf-8').casefold()
          ingestion = Path('modules/deep_company_analysis/chapter8_official_file_ingestion_v59.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH8_DGC_OCR_ACCEPTANCE_V59.json').read_text(encoding='utf-8'))
          ok, note = ocr_runtime_status('vie+eng')
          assert ok, note
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert 'candidate — analyst verify' in ingestion
          assert acceptance['ocr_text_is_preapproved_evidence'] is False
          assert acceptance['auto_promoted_evidence'] is False
          assert acceptance['analyst_workspace_mutated'] is False
          assert acceptance['candidate_page_provenance_markers'] is True
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V59 OCR is bounded, page-provenanced and analyst-controlled.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V59_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8531 \
            > reports/CH8_V59_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8531/_stcore/health \
              | tee reports/CH8_V59_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V59_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V59 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8N V59\nBranch: feature/deep-company-analysis-chapter8-ocr-v59\nCommit: %s\nPurpose: bounded vie+eng OCR fallback for scanned official PDFs with page provenance; all rows remain analyst-verified candidates.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V59.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8N_V59.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8N_V59.zip | tail -n 3

      - name: Upload V59 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8N_V59
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8N_SCANNED_PDF_OCR_V59.md
            reports/CH8_DGC_OCR_ACCEPTANCE_V59.json
            reports/CH8_DGC_OCR_MANIFEST_V59.csv
            reports/CH8_DGC_OCR_DOWNLOADS_V59.csv
            reports/CH8_DGC_OCR_FILE_ATTEMPTS_V59.csv
            reports/CH8_DGC_OCR_DOCUMENTS_V59.csv
            reports/CH8_DGC_OCR_NEW_CANDIDATES_V59.csv
            reports/CH8_DGC_OCR_COVERAGE_V59.csv
            reports/CH8_DGC_V54_OPEN_GAPS_NEWLY_COVERED_V59.csv
            reports/CH8_DGC_V54_OPEN_GAPS_REMAINING_V59.csv
            reports/CH8_DGC_OCR_LIVE_V59.log
            reports/CH8_V59_DETERMINISTIC_TESTS.log
            reports/CH8_V59_BOUNDARY_AUDIT.log
            reports/CH8_V59_FULL_DCA_REGRESSION.log
            reports/CH8_V59_STREAMLIT_SERVER.log
            reports/CH8_V59_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8N_V59.zip
