name: Deep Company Analysis Appendix A Phase C History Closure V92

on:
  push:
    branches:
      - feature/deep-company-analysis-appendix-a-phasec-v92
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  appendix-a-phasec-v92:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Appendix A V92
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/appendix_a.py
          python -m py_compile modules/deep_company_analysis/appendix_a_workspace.py
          python -m py_compile modules/deep_company_analysis/appendix_a_store.py
          python -m py_compile modules/deep_company_analysis/appendix_a_history.py
          python -m py_compile modules/deep_company_analysis/test_appendix_a_phasea_v90.py
          python -m py_compile modules/deep_company_analysis/test_appendix_a_phaseb_v91.py
          python -m py_compile modules/deep_company_analysis/test_appendix_a_phasec_v92.py
          python -m py_compile scripts/qa_appendix_a_history_v92.py
          python -m py_compile pages/10_Mang_nguon_tin.py
          python -m py_compile tre_sidebar_nav.py
          python -m py_compile app.py

      - name: Appendix A cumulative deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_appendix_a_phasea_v90.py modules/deep_company_analysis/test_appendix_a_phaseb_v91.py modules/deep_company_analysis/test_appendix_a_phasec_v92.py \
            2>&1 | tee reports/APPENDIX_A_V92_DETERMINISTIC_TESTS.log

      - name: Appendix A V92 history and closure acceptance
        run: |
          set -euo pipefail
          python scripts/qa_appendix_a_history_v92.py 2>&1 | tee reports/APPENDIX_A_V92_HISTORY_ACCEPTANCE.log

      - name: Appendix A V92 source, SSOT and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/APPENDIX_A_V92_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.appendix_a as appa
          import modules.deep_company_analysis.appendix_a_history as hist

          history = Path('modules/deep_company_analysis/appendix_a_history.py').read_text(encoding='utf-8').casefold()
          store = Path('modules/deep_company_analysis/appendix_a_store.py').read_text(encoding='utf-8').casefold()
          page = Path('pages/10_Mang_nguon_tin.py').read_text(encoding='utf-8').casefold()
          docs = Path('docs/FORMULA_EXPLANATION_APPENDIX_A_PHASEC_V92.md').read_text(encoding='utf-8').casefold()
          report = json.loads(Path('reports/APPENDIX_A_PHASEC_HISTORY_V92.json').read_text(encoding='utf-8'))

          assert appa.APPENDIX_TITLE == 'Building a Human Intelligence Network'
          assert tuple(appa.SOURCE_PRINT_PAGES) == (323, 330)
          assert set(hist.DELTA_COLUMNS) == {'Field','Before Version','Before','After Version','After','Delta'}
          assert 'import requests' not in history and 'import httpx' not in history
          assert 'import requests' not in store and 'import httpx' not in store
          assert 'buy/hold/sell' in page
          assert 'no new financial formulas' in docs
          assert report['acceptance'] == 'PASS'
          assert report['appendix_a_complete'] is True
          assert report['neutral_delta_only'] is True
          assert report['automatic_human_source_score'] is False
          assert report['automatic_credibility_score'] is False
          assert report['automatic_weighted_research_score'] is False
          assert report['automatic_investment_signal'] is False
          assert report['automatic_mos_change'] is False
          assert report['automatic_research_gate_change'] is False
          assert report['historical_source_freshness_reconstructed'] is False
          assert report['duplicate_financial_ssot_added'] is False
          print('PASS: Appendix A V92 closure preserves source lock, analyst ownership, neutral history, SSOT and investment boundaries.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/APPENDIX_A_V92_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 > reports/APPENDIX_A_V92_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health | tee reports/APPENDIX_A_V92_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/APPENDIX_A_V92_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V92 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Appendix A Phase C V92\nBranch: feature/deep-company-analysis-appendix-a-phasec-v92\nCommit: %s\nPurpose: immutable snapshots, interview/version lineage, neutral delta and Appendix A closure; no source/credibility score, duplicate financial SSOT, MOS/Research Gate change or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_APPENDIX_A_V92.txt
          zip -qr Trecapital_Deep_Analysis_AppendixA_PhaseC_V92.zip . -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_AppendixA_PhaseC_V92.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_AppendixA_PhaseC_V92.zip | tee reports/APPENDIX_A_V92_OFFLINE_SHA256.txt

      - name: Upload V92 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_AppendixA_PhaseC_V92
          retention-days: 90
          path: |
            docs/APPENDIX_A_PHASEC_HISTORY_V92.md
            docs/FORMULA_EXPLANATION_APPENDIX_A_PHASEC_V92.md
            reports/APPENDIX_A_PHASEC_HISTORY_V92.json
            reports/APPENDIX_A_V92_DETERMINISTIC_TESTS.log
            reports/APPENDIX_A_V92_HISTORY_ACCEPTANCE.log
            reports/APPENDIX_A_V92_BOUNDARY_AUDIT.log
            reports/APPENDIX_A_V92_FULL_DCA_REGRESSION.log
            reports/APPENDIX_A_V92_STREAMLIT_SERVER.log
            reports/APPENDIX_A_V92_STREAMLIT_HEALTH.txt
            reports/APPENDIX_A_V92_OFFLINE_SHA256.txt
            Trecapital_Deep_Analysis_AppendixA_PhaseC_V92.zip
