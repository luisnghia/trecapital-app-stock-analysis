name: Finalize Chapter 7 Phase 7D V37 — Final Source Closure + QA

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter7
    paths:
      - '.github/workflows/finalize-chapter7-phase7d-v37.yml'

permissions:
  contents: write

jobs:
  finalize-phase7d-v37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter7
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply approved Phase 7D integration
        run: python scripts/apply_chapter7_phase7d_v37.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Chapter 7 V37
        run: |
          python -m py_compile \
            modules/deep_company_analysis/chapter7.py \
            modules/deep_company_analysis/chapter7_page_support.py \
            modules/deep_company_analysis/chapter7_data_bridge.py \
            modules/deep_company_analysis/chapter7_research.py \
            modules/deep_company_analysis/chapter7_research_ui.py \
            modules/deep_company_analysis/chapter7_closure.py \
            modules/deep_company_analysis/chapter7_closure_ui.py \
            scripts/apply_chapter7_phase7d_v37.py \
            scripts/audit_chapter7_phase7d_v37.py \
            pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py

      - name: QA Pass 1 of 3 — Final closure + analyst boundary
        run: |
          pytest -q \
            modules/deep_company_analysis/test_chapter7_phase7d.py \
            modules/deep_company_analysis/test_chapter7_phase7c.py \
            modules/deep_company_analysis/test_chapter7_phase7b.py \
            modules/deep_company_analysis/test_chapter7.py \
            modules/deep_company_analysis/test_chapter7_phase7a_integration.py

      - name: QA Pass 2 of 3 — Format/sort + static source-lock audit
        run: |
          pytest -q \
            modules/deep_company_analysis/test_table_format.py \
            modules/deep_company_analysis/test_sortable_table_v32.py
          python scripts/audit_chapter7_phase7d_v37.py

      - name: QA Pass 3 of 3 — Full Deep Company Analysis regression
        run: pytest -q modules/deep_company_analysis/test_*.py

      - name: Static Chapter 7 production table audit
        shell: bash
        run: |
          echo '=== Direct production Streamlit table primitives ==='
          grep -RIn --include='*.py' -E 'st\.table\(|st\.dataframe\(|st\.data_editor\(' modules/deep_company_analysis/chapter7*.py \
            | grep -v '/test_' | grep -v 'table_format.py' && exit 1 || true
          echo '=== Phase7D required tokens ==='
          grep -n 'CLOSURE_BOUNDARY\|7K17\|Complete — Review Required\|Accepted Residual Unknown' \
            modules/deep_company_analysis/chapter7_closure.py \
            modules/deep_company_analysis/chapter7_closure_ui.py

      - name: Unified Streamlit smoke test
        shell: bash
        run: |
          timeout 40s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8523 >/tmp/dca_v37_smoke.log 2>&1 &
          PID=$!
          sleep 15
          curl --fail --silent http://127.0.0.1:8523/_stcore/health
          kill $PID || true
          wait $PID || true
          tail -n 120 /tmp/dca_v37_smoke.log || true

      - name: Write V37 audit record
        shell: bash
        run: |
          cat > docs/DEEP_ANALYSIS_CHAPTER7_V37_FINAL_SOURCE_CLOSURE_AUDIT.md <<EOF
          # Chapter 7 V37 — Final Source Closure Audit

          Status: PASS

          - QA Pass 1/3: Phase 7D source checklist, coverage, residual unknown, management-change review, completion gate and Phase 7A/7B/7C regressions PASS.
          - QA Pass 2/3: shared table format/sort and Phase 7D static source-lock audit PASS.
          - QA Pass 3/3: full Deep Company Analysis regression PASS.
          - Static Chapter 7 production table audit PASS.
          - Unified Streamlit page smoke test PASS.

          Chapter 7 is now framework/source complete for Q33-Q38: Phase 7A workspace + 7B structured bridge + 7C evidence research assistant + 7D Final Source Closure.

          Completion boundary: Complete means research/source completeness only. No Management Quality score; no auto OO/LT/HH or Lion/Hyena; no insider BUY/SELL signal; no MOS, investment Research Gate, portfolio sizing or BUY/HOLD/SELL; no fake TTM.

          A specific company record reaches Complete — Analyst Confirmed only after the analyst clears/accepts research gaps and conflicts, reviews management-change items, completes 7K01–7K17, provides the final analyst summary, and explicitly confirms the completion gate.

          Branch: feature/deep-company-analysis-chapter7
          Build source before commit: $(git rev-parse HEAD)
          EOF

      - name: Commit Chapter 7 V37 production integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            modules/deep_company_analysis/chapter7.py \
            modules/deep_company_analysis/chapter7_page_support.py \
            modules/deep_company_analysis/chapter7_data_bridge.py \
            docs/DEEP_ANALYSIS_CHAPTER7_V37_FINAL_SOURCE_CLOSURE_AUDIT.md
          git commit -m 'feat(ch7): finalize Phase 7D source closure V37'
          git push origin HEAD:feature/deep-company-analysis-chapter7

      - name: Build V37 offline package
        shell: bash
        run: |
          cat > OFFLINE_BUILD_INFO.txt <<EOF
          Trecapital Deep Company Analysis Chapters 1-7 V37 Offline
          Branch: feature/deep-company-analysis-chapter7
          Commit: $(git rev-parse HEAD)
          Chapter 7: Phase 7A + 7B + 7C + 7D Final Source Closure / framework source-complete.
          Includes: Q33-Q38 workspace; structured management data; evidence/counter-evidence research assistant; source coverage; 7K01-7K17 final checklist; residual unknown acceptance; source-conflict resolution; management-change review gate; analyst-confirmed versioned completion snapshot.
          Boundary: completion is research/source completeness only; no Management Quality score, auto classification, insider signal, MOS, investment Research Gate, portfolio sizing or BUY/HOLD/SELL; no fake TTM.
          EOF
          rm -f Trecapital_Deep_Analysis_Ch1-Ch7_V37_Offline.zip
          zip -qr Trecapital_Deep_Analysis_Ch1-Ch7_V37_Offline.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' \
               'Trecapital_Deep_Analysis_Ch1-Ch6_V33_Offline.zip' \
               'Trecapital_Deep_Analysis_Ch1-Ch7_V34_Offline.zip' \
               'Trecapital_Deep_Analysis_Ch1-Ch7_V35_Offline.zip' \
               'Trecapital_Deep_Analysis_Ch1-Ch7_V36_Offline.zip'
          unzip -t Trecapital_Deep_Analysis_Ch1-Ch7_V37_Offline.zip | tail -n 3

      - name: Upload V37 offline ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Ch1-Ch7_V37_Offline
          path: Trecapital_Deep_Analysis_Ch1-Ch7_V37_Offline.zip
          retention-days: 90
