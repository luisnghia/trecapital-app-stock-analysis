name: Chapter 4 Phase 4C V18 Final

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - '.github/workflows/chapter4-phase4c-v18-final.yml'
      - 'tools/dgc_chapter4_phase4c_e2e.py'

permissions:
  contents: read

jobs:
  chapter4c-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Chapters 1-4
        run: python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py tools/dgc_chapter4_phase4c_e2e.py
      - name: Run Chapter 4 automatic peer + Phase 4C tests
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter4_peer_auto.py
          python -m pytest -q modules/deep_company_analysis/test_chapter4_evidence.py
          python -m pytest -q modules/deep_company_analysis/test_chapter4_quant.py
          python -m pytest -q modules/deep_company_analysis/test_chapter4.py
      - name: Run full Deep Analysis regression
        run: python -m pytest -q modules/deep_company_analysis
      - name: Run live DGC Phase 4C diagnostic
        shell: bash
        run: |
          set -o pipefail
          python tools/dgc_chapter4_phase4c_e2e.py | tee dgc_chapter4_phase4c_e2e.log
      - name: Smoke-test unified page
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8512 > /tmp/ch4c_v18.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8512/_stcore/health >/dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" -ne 1 ]; then cat /tmp/ch4c_v18.log; kill "$PID" 2>/dev/null || true; exit 1; fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
      - name: Build lightweight Windows offline package V18
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="Trecapital_Deep_Analysis_Offline_V18"
          rm -rf dist
          mkdir -p "dist/${PKG_NAME}"
          rsync -a ./ "dist/${PKG_NAME}/" \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'offline_wheels' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.log'
          mkdir -p "dist/${PKG_NAME}/data_cache"
          test -f "dist/${PKG_NAME}/CHAY_TRECAPITAL_OFFLINE.bat"
          test -f "dist/${PKG_NAME}/pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter4.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter4_quant.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter4_peer_auto.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter4_evidence.py"
          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter4_page_support.py"
          test -f "dist/${PKG_NAME}/docs/CHAPTER4_PHASE4C_EVIDENCE_BRIDGE.md"
          test -f "dist/${PKG_NAME}/docs/formulas/DEEP_COMPANY_ANALYSIS_CHAPTER4_FORMULAS.md"
          (cd dist && zip -qr "${PKG_NAME}.zip" "${PKG_NAME}")
          sha256sum "dist/${PKG_NAME}.zip" > "dist/${PKG_NAME}.zip.sha256"
      - name: Upload DGC Phase 4C audit
        uses: actions/upload-artifact@v4
        with:
          name: DGC_Chapter4_Phase4C_E2E_Audit
          path: dgc_chapter4_phase4c_e2e.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload final V18
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Offline_V18_FINAL
          path: |
            dist/Trecapital_Deep_Analysis_Offline_V18.zip
            dist/Trecapital_Deep_Analysis_Offline_V18.zip.sha256
          if-no-files-found: error
          retention-days: 30
