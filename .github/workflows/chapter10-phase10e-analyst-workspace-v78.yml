name: Deep Company Analysis Chapter 10 Phase 10E Analyst Workspace V78

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter10-phase10e-v78
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter10-phase10e:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports
      - name: Compile Chapter 10 V78
        run: |
          python -m py_compile modules/deep_company_analysis/chapter10.py
          python -m py_compile modules/deep_company_analysis/chapter10_research.py
          python -m py_compile modules/deep_company_analysis/chapter10_store.py
          python -m py_compile modules/deep_company_analysis/chapter10_page_support.py
          python -m py_compile modules/deep_company_analysis/test_chapter10_phase10e.py
          python -m py_compile scripts/qa_chapter10_workspace_store_v78.py
          python -m py_compile pages/08_Phan_tich_tang_truong.py
      - name: Chapter 10 cumulative deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_chapter10_phase10*.py 2>&1 | tee reports/CH10_V78_DETERMINISTIC_TESTS.log
      - name: Chapter 10 V78 workspace acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter10_workspace_store_v78.py 2>&1 | tee reports/CH10_V78_WORKSPACE_ACCEPTANCE.log
      - name: Chapter 10 V78 investment and SSOT boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH10_V78_BOUNDARY_AUDIT.log
          from pathlib import Path
          store = Path('modules/deep_company_analysis/chapter10_store.py').read_text(encoding='utf-8').casefold()
          ui = Path('modules/deep_company_analysis/chapter10_page_support.py').read_text(encoding='utf-8').casefold()
          assert 'ccc =' not in store
          assert 'intrinsic_value' not in store
          assert 'buy/hold/sell' in ui
          assert 'promote selected evidence' in ui
          print('PASS: V78 preserves analyst ownership, explicit promotion, canonical SSOT, and investment boundaries.')
          PY
      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH10_V78_FULL_DCA_REGRESSION.log
      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8548 > reports/CH10_V78_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8548/_stcore/health | tee reports/CH10_V78_STREAMLIT_HEALTH.txt | grep -q ok; then exit 0; fi
            sleep 1
          done
          cat reports/CH10_V78_STREAMLIT_SERVER.log
          exit 1
      - name: Build offline V78 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 10 Phase 10E V78\nBranch: feature/deep-company-analysis-chapter10-phase10e-v78\nCommit: %s\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH10_V78.txt
          zip -qr Trecapital_Deep_Analysis_Chapter10_Phase10E_V78.zip . -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter10_Phase10E_V78.zip | tail -n 3
      - name: Upload V78 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter10_Phase10E_V78
          retention-days: 90
          path: |
            docs/CHAPTER10_PHASE10E_ANALYST_WORKSPACE_V78.md
            docs/FORMULA_EXPLANATION_CHAPTER10_PHASE10E_V78.md
            reports/CH10_PHASE10E_WORKSPACE_V78.json
            reports/CH10_V78_DETERMINISTIC_TESTS.log
            reports/CH10_V78_WORKSPACE_ACCEPTANCE.log
            reports/CH10_V78_BOUNDARY_AUDIT.log
            reports/CH10_V78_FULL_DCA_REGRESSION.log
            reports/CH10_V78_STREAMLIT_SERVER.log
            reports/CH10_V78_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter10_Phase10E_V78.zip
