name: KHDN Customer Work archive search regression
on:
  push:
    branches: [fix/khdn-customer-work-search-archive-20261105]
  pull_request:
    paths:
      - 'khdn_apps/planning_usability_v2_patch.py'
      - 'khdn_apps/planning_final_ux_patch.py'
      - 'khdn_apps/customer_work_archive_history.py'
      - 'khdn_apps/customer_work_archive_history_qa.py'
      - 'khdn_apps/Dockerfile'
      - '.github/workflows/khdn-customer-work-archive-qa.yml'
jobs:
  customer-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r khdn_apps/requirements.txt
      - run: python -m khdn_apps.customer_work_archive_history_qa
      - run: docker build --progress=plain -f khdn_apps/Dockerfile -t khdn-archive-qa .
