name: KHDN archived cancellation reason and complete audit QA
on:
  push:
    branches:
      - fix/khdn-archive-cancel-reason-full-audit-20261105
  pull_request:
    paths:
      - 'khdn_apps/customer_work_archive_history.py'
      - 'khdn_apps/customer_work_cancel_full_audit_qa.py'
      - 'khdn_apps/Dockerfile'
      - '.github/workflows/khdn-archive-cancel-full-audit-qa.yml'
jobs:
  archived-cancellation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r khdn_apps/requirements.txt
      - run: python -m khdn_apps.customer_work_archive_history_qa
      - run: python -m khdn_apps.customer_work_cancel_full_audit_qa
      - run: docker build --progress=plain -f khdn_apps/Dockerfile -t khdn-cancellation-history-qa .
