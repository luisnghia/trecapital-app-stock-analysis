name: Inspect KHDN assignment implementation (no data)
on:
  push:
    branches: [feature/khdn-edit-case-owner-controller-cif-leader-20261105]
jobs:
  inspect-assignment-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only embedded source (never connect to production data)
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, base64
          parts=sorted((Path('khdn_apps')/'_src').glob('*.txt'))
          src=gzip.decompress(base64.b64decode(''.join(x.read_text(encoding='ascii') for x in parts))).decode()
          ls=src.splitlines()
          tokens=['Chọn khách hàng để cập nhật phụ trách','CB QLKH phụ trách','Chưa gán','qlkh_user_id','def all_users','def admin_customers','def admin_page','WHERE role=']
          for target in tokens:
              inds=[i for i,s in enumerate(ls) if target in s]
              print('===',target,'MATCHES',len(inds),'===')
              for i in inds[:6]:
                  print('\\n'.join(f'{k+1}: {ls[k]}' for k in range(max(0,i-22),min(len(ls),i+31))))
          PY
