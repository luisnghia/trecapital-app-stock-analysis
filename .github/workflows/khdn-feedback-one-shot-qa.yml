name: KHDN one-shot feedback and notification center regressions
on:
  push:
    branches:
      - fix/khdn-one-shot-toast-notification-center-20261102
  pull_request:
    paths:
      - 'khdn_apps/action_feedback_patch.py'
      - 'khdn_apps/action_feedback_qa.py'
      - 'khdn_apps/action_feedback_one_shot_qa.py'
      - 'khdn_apps/notification_ui_patch.py'
      - 'khdn_apps/notification_lifecycle_qa.py'
      - 'khdn_apps/Dockerfile'
      - '.github/workflows/khdn-feedback-one-shot-qa.yml'
jobs:
  feedback-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r khdn_apps/requirements.txt
      - run: python -m khdn_apps.action_feedback_qa
      - run: python -m khdn_apps.action_feedback_one_shot_qa
      - run: python -m khdn_apps.notification_lifecycle_qa
      - run: python -m khdn_apps.runtime_page_qa
