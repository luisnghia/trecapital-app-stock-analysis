name: Deep Company Analysis Chapter 9 Phase 9B Source Contract V63

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter9-phase9b-v63
    paths:
      - 'modules/deep_company_analysis/**'
      - 'scripts/qa_chapter9_source_contract_v63.py'
      - 'docs/CHAPTER9_PHASE9B_SOURCE_CONTRACT_V63.md'
      - '.github/workflows/chapter9-phase9b-source-contract-v63.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter9-phase9b:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Chapter 9 V63
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter9.py
          python -m py_compile modules/deep_company_analysis/chapter9_source_contract_v63.py
          python -m py_compile scripts/qa_chapter9_source_contract_v63.py

      - name: Chapter 9 Phase 9A-9B deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter9_phase9a.py \
            modules/deep_company_analysis/test_chapter9_phase9b.py \
            2>&1 | tee reports/CH9_V63_DETERMINISTIC_TESTS.log

      - name: Chapter 9 V63 source-contract acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter9_source_contract_v63.py \
            2>&1 | tee reports/CH9_V63_SOURCE_CONTRACT_ACCEPTANCE.log

      - name: Chapter 9 V63 source and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH9_V63_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter9 as ch9
          import modules.deep_company_analysis.chapter9_source_contract_v63 as v63

          core = Path('modules/deep_company_analysis/chapter9_source_contract_v63.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH9_PHASE9B_SOURCE_CONTRACT_V63.json').read_text(encoding='utf-8'))
          snapshot = v63.validate_source_contract()
          assert ch9.QUESTION_KEYS == ('Q48', 'Q49', 'Q50', 'Q51', 'Q52')
          assert ch9.MANAGER_IDENTITY_SSOT == 'Chapter 7 manager master'
          assert snapshot['dimension_counts'] == {'Q48': 6, 'Q49': 4, 'Q50': 8, 'Q51': 3, 'Q52': 5}
          assert snapshot['total_dimensions'] == 26
          assert len(v63.Q49_ADVERSITY_RESPONSE_PATTERNS) == 5
          assert len(v63.Q50_SHAREHOLDER_LETTER_ELEMENTS) == 5
          assert len(v63.Q50_COMMUNICATION_CHECKS) == 4
          assert len(v63.Q52_SELF_PROMOTER_TRAITS) == 6
          for forbidden_import in ('import streamlit', 'from streamlit', 'import httpx', 'import requests', 'import psycopg', 'import sqlite3'):
              assert forbidden_import not in core
          assert acceptance['automatic_management_score'] is False
          assert acceptance['automatic_investment_signal'] is False
          assert acceptance['ui_or_db_added'] is False
          assert acceptance['web_research_added'] is False
          assert acceptance['financial_bridge_added'] is False
          assert acceptance['mos_or_research_gate_changed'] is False
          assert acceptance['analyst_workspace_mutated'] is False
          print('PASS: Chapter 9 Phase 9B preserves source detail and remains analyst-controlled.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH9_V63_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8535 \
            > reports/CH9_V63_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8535/_stcore/health \
              | tee reports/CH9_V63_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH9_V63_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V63 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 9 Phase 9B V63\nBranch: feature/deep-company-analysis-chapter9-phase9b-v63\nCommit: %s\nPurpose: source-lock Chapter 9 Q48-Q52 subdimensions, red flags, counter-signals, and evidence families without automated judgment.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH9_V63.txt
          zip -qr Trecapital_Deep_Analysis_Chapter9_Phase9B_V63.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter9_Phase9B_V63.zip | tail -n 3

      - name: Upload V63 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter9_Phase9B_V63
          retention-days: 90
          path: |
            docs/CHAPTER9_PHASE9B_SOURCE_CONTRACT_V63.md
            reports/CH9_PHASE9B_SOURCE_CONTRACT_V63.json
            reports/CH9_V63_DETERMINISTIC_TESTS.log
            reports/CH9_V63_SOURCE_CONTRACT_ACCEPTANCE.log
            reports/CH9_V63_BOUNDARY_AUDIT.log
            reports/CH9_V63_FULL_DCA_REGRESSION.log
            reports/CH9_V63_STREAMLIT_SERVER.log
            reports/CH9_V63_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter9_Phase9B_V63.zip
