name: Apply Chapter 2 Source-First Evidence Integration

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'tools/apply_chapter2_source_first_patch.py'
      - 'modules/deep_company_analysis/chapter2_evidence.py'
      - '.github/workflows/apply-chapter2-source-first.yml'

permissions:
  contents: write

jobs:
  apply-source-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source-first integration patch
        run: python tools/apply_chapter2_source_first_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed sources
        run: |
          python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py tools/dgc_chapter2_e2e.py
      - name: Run deep-analysis regression suite
        run: python -m pytest -q modules/deep_company_analysis
      - name: Commit source-first integration
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter2.py modules/deep_company_analysis/chapter2_auto.py modules/deep_company_analysis/chapter2_page_support.py tools/dgc_chapter2_e2e.py
          git commit -m "feat(deep-analysis): use source-first Chapter 2 evidence and exposure typing"
          git push origin HEAD:feature/deep-company-analysis-checklist
