name: Deep Company Analysis Chapter 8 Phase 8D V45

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-phase8d-ui-v45
  workflow_dispatch:

jobs:
  phase8d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Phase 8D UI
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_store.py
          python -m py_compile modules/deep_company_analysis/chapter8_workspace.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile modules/deep_company_analysis/test_chapter8_phase8d.py
          python -m py_compile scripts/qa_chapter8_phase8d_v45.py
          python -m py_compile pages/09_Phan_tich_chuyen_sau_Chuong_8.py
          python -m py_compile tre_sidebar_nav.py

      - name: Chapter 8 Phase 8A-8D tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            2>&1 | tee reports/CH8_PHASE8D_TESTS_V45.log

      - name: DGC canonical integration acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_phase8d_v45.py 2>&1 | tee reports/CH8_PHASE8D_DGC_ACCEPTANCE_V45.log

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH8_PHASE8D_FULL_REGRESSION_V45.log

      - name: Streamlit Chapter 8 smoke
        run: |
          set -euo pipefail
          streamlit run pages/09_Phan_tich_chuyen_sau_Chuong_8.py \
            --server.headless true --server.port 8514 > reports/CH8_PHASE8D_STREAMLIT_V45.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8514/_stcore/health | tee reports/CH8_PHASE8D_HEALTH_V45.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8D_STREAMLIT_V45.log
          exit 1

      - name: Build offline package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8D V45\nBranch: feature/deep-company-analysis-chapter8-phase8d-ui-v45\nCommit: %s\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V45.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8D_V45.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8D_V45.zip | tail -n 3

      - name: Upload acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8D_V45
          retention-days: 90
          path: |
            reports/CHAPTER8_PHASE8D_V45_ACCEPTANCE.json
            reports/CH8_PHASE8D_DGC_ACCEPTANCE_V45.log
            reports/CH8_PHASE8D_TESTS_V45.log
            reports/CH8_PHASE8D_FULL_REGRESSION_V45.log
            reports/CH8_PHASE8D_STREAMLIT_V45.log
            reports/CH8_PHASE8D_HEALTH_V45.txt
            docs/CHAPTER8_PHASE8D_UI.md
            Trecapital_Deep_Analysis_Chapter8_Phase8D_V45.zip
