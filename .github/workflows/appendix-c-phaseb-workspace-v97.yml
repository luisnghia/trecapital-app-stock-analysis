name: Deep Company Analysis Appendix C Phase B Workspace V97

on:
  push:
    branches:
      - feature/deep-company-analysis-appendix-c-phaseb-v97
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  appendix-c-phaseb-v97:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V97
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/appendix_c.py
          python -m py_compile modules/deep_company_analysis/appendix_c_workspace.py
          python -m py_compile modules/deep_company_analysis/test_appendix_c_phaseb_v97.py
          python -m py_compile scripts/qa_appendix_c_workspace_v97.py
          python -m py_compile pages/12_Appendix_C_Investment_Checklist.py
          python -m py_compile app.py

      - name: Appendix C V96 + V97 deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_appendix_c_phasea_v96.py modules/deep_company_analysis/test_appendix_c_phaseb_v97.py \
            2>&1 | tee reports/APPENDIX_C_V97_DETERMINISTIC_TESTS.log

      - name: Appendix C V97 workspace acceptance
        run: |
          set -euo pipefail
          python scripts/qa_appendix_c_workspace_v97.py \
            2>&1 | tee reports/APPENDIX_C_V97_WORKSPACE_ACCEPTANCE.log

      - name: Source SSOT investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/APPENDIX_C_V97_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          from modules.deep_company_analysis import appendix_c as appc
          from modules.deep_company_analysis import appendix_c_workspace as ws

          report = json.loads(Path('reports/APPENDIX_C_PHASEB_WORKSPACE_V97.json').read_text(encoding='utf-8'))
          rows = ws.build_live_rows('QA', owner_payloads={})
          assert appc.QUESTION_COUNT == 59
          assert len(rows) == 59
          assert not ws.validate_read_only_rows(rows)
          assert all(not (set(row) & ws.FORBIDDEN_KEYS) for row in rows)
          assert report['acceptance'] == 'PASS'
          assert report['live_owner_ssot_bridge'] is True
          assert report['appendix_answer_store_added'] is False
          assert report['duplicate_financial_or_question_ssot_added'] is False
          assert report['automatic_weighted_score'] is False
          assert report['automatic_management_or_growth_score'] is False
          assert report['automatic_investment_signal'] is False
          assert report['automatic_intrinsic_value_or_mos_change'] is False
          assert report['automatic_research_gate_change'] is False
          assert report['ai_role'] == 'Research Assistant'
          assert report['conclusion_owner'] == 'Analyst'
          page = Path('pages/12_Appendix_C_Investment_Checklist.py').read_text(encoding='utf-8').casefold()
          assert 'dataframe' in page
          assert 'weighted' in page
          assert 'read-only' in page
          print('PASS: V97 is a read-only Q01-Q59 live SSOT bridge with neutral research navigation.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/APPENDIX_C_V97_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 \
            > reports/APPENDIX_C_V97_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health \
              | tee reports/APPENDIX_C_V97_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/APPENDIX_C_V97_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V97 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Appendix C Phase B V97\nBranch: feature/deep-company-analysis-appendix-c-phaseb-v97\nCommit: %s\nPurpose: source-locked Q01-Q59 live read-only owner-SSOT bridge and research navigation; no duplicate answer/financial SSOT, weighted score, MOS/Research Gate change, or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_APPENDIX_C_V97.txt
          zip -qr Trecapital_Deep_Analysis_AppendixC_PhaseB_V97.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_AppendixC_PhaseB_V97.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_AppendixC_PhaseB_V97.zip | tee reports/APPENDIX_C_V97_OFFLINE_ZIP_SHA256.txt

      - name: Upload V97 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_AppendixC_PhaseB_V97
          retention-days: 90
          path: |
            docs/APPENDIX_C_PHASEB_WORKSPACE_V97.md
            docs/FORMULA_EXPLANATION_APPENDIX_C_PHASEB_V97.md
            reports/APPENDIX_C_PHASEB_WORKSPACE_V97.json
            reports/APPENDIX_C_V97_DETERMINISTIC_TESTS.log
            reports/APPENDIX_C_V97_WORKSPACE_ACCEPTANCE.log
            reports/APPENDIX_C_V97_BOUNDARY_AUDIT.log
            reports/APPENDIX_C_V97_FULL_DCA_REGRESSION.log
            reports/APPENDIX_C_V97_STREAMLIT_SERVER.log
            reports/APPENDIX_C_V97_STREAMLIT_HEALTH.txt
            reports/APPENDIX_C_V97_OFFLINE_ZIP_SHA256.txt
            Trecapital_Deep_Analysis_AppendixC_PhaseB_V97.zip
