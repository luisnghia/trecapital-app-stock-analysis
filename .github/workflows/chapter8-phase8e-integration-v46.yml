name: Deep Company Analysis Chapter 8 Phase 8E V46

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-phase8e-integration-v46
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase8e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Apply Phase 8E integration patch
        run: |
          set -euo pipefail
          python scripts/apply_chapter8_phase8e_v46.py
          git diff -- pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/04_Bao_cao_tong_hop.py

      - name: Commit integrated pages to V46 branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/04_Bao_cao_tong_hop.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/04_Bao_cao_tong_hop.py
            git commit -m "feat(dca): integrate Chapter 8 into unified workspace and report"
            git push origin HEAD:feature/deep-company-analysis-chapter8-phase8e-integration-v46
          else
            echo "Phase 8E patch already applied; no integration commit needed."
          fi

      - name: Compile Phase 8E integration
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_integration.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile modules/deep_company_analysis/test_chapter8_phase8e.py
          python -m py_compile scripts/apply_chapter8_phase8e_v46.py
          python -m py_compile scripts/qa_chapter8_phase8e_v46.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          python -m py_compile pages/04_Bao_cao_tong_hop.py

      - name: Chapter 8 Phase 8A-8E tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            2>&1 | tee reports/CH8_PHASE8E_TESTS_V46.log

      - name: Phase 8E acceptance probe
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_phase8e_v46.py 2>&1 | tee reports/CH8_PHASE8E_ACCEPTANCE_V46.log

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH8_PHASE8E_FULL_REGRESSION_V46.log

      - name: Streamlit unified DCA smoke
        run: |
          set -euo pipefail
          streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            --server.headless true --server.port 8515 > reports/CH8_PHASE8E_DCA_STREAMLIT_V46.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8515/_stcore/health | tee reports/CH8_PHASE8E_DCA_HEALTH_V46.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8E_DCA_STREAMLIT_V46.log
          exit 1

      - name: Streamlit consolidated report smoke
        run: |
          set -euo pipefail
          streamlit run pages/04_Bao_cao_tong_hop.py \
            --server.headless true --server.port 8516 > reports/CH8_PHASE8E_REPORT_STREAMLIT_V46.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8516/_stcore/health | tee reports/CH8_PHASE8E_REPORT_HEALTH_V46.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8E_REPORT_STREAMLIT_V46.log
          exit 1

      - name: Build offline package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8E V46\nBranch: feature/deep-company-analysis-chapter8-phase8e-integration-v46\nCommit: %s\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V46.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8E_V46.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8E_V46.zip | tail -n 3

      - name: Upload acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8E_V46
          retention-days: 90
          path: |
            reports/CHAPTER8_PHASE8E_V46_ACCEPTANCE.json
            reports/CH8_PHASE8E_ACCEPTANCE_V46.log
            reports/CH8_PHASE8E_TESTS_V46.log
            reports/CH8_PHASE8E_FULL_REGRESSION_V46.log
            reports/CH8_PHASE8E_DCA_STREAMLIT_V46.log
            reports/CH8_PHASE8E_DCA_HEALTH_V46.txt
            reports/CH8_PHASE8E_REPORT_STREAMLIT_V46.log
            reports/CH8_PHASE8E_REPORT_HEALTH_V46.txt
            docs/CHAPTER8_PHASE8E_INTEGRATION_V46.md
            Trecapital_Deep_Analysis_Chapter8_Phase8E_V46.zip
