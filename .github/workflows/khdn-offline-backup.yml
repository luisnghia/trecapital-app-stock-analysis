name: KHDN Offline Backup

on:
  push:
    branches:
      - feature/khdn-weekly-plan-v1

jobs:
  export:
    if: contains(github.event.head_commit.message, '[offline-backup]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch snapshot
        uses: actions/checkout@v4

      - name: Write backup metadata
        shell: bash
        run: |
          cat > OFFLINE_BACKUP_INFO.txt <<'EOF'
          KHDN offline source backup
          Branch: feature/khdn-weekly-plan-v1
          Generated by GitHub Actions from the exact pushed commit.
          The archive contains the complete khdn_apps source folder plus this metadata file.
          EOF
          echo "Commit: $GITHUB_SHA" >> OFFLINE_BACKUP_INFO.txt
          echo "Generated UTC: $(date -u '+%Y-%m-%d %H:%M:%S')" >> OFFLINE_BACKUP_INFO.txt

      - name: Upload offline source archive
        uses: actions/upload-artifact@v4
        with:
          name: KHDN-App-Offline-Backup
          path: |
            khdn_apps
            OFFLINE_BACKUP_INFO.txt
          if-no-files-found: error
          retention-days: 30
