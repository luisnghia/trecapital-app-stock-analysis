name: KHDN Offline Backup

on:
  push:
    branches:
      - feature/khdn-weekly-plan-v1
      - feature/khdn-official-bidv-ios-icon

jobs:
  export:
    if: contains(github.event.head_commit.message, '[offline-backup]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch snapshot
        uses: actions/checkout@v4

      - name: Build Windows offline package
        shell: bash
        run: |
          set -euo pipefail
          PKG="KHDN-App-Offline"
          rm -rf "$PKG"
          mkdir -p "$PKG/data" "$PKG/backups"
          cp -a khdn_apps "$PKG/khdn_apps"

          cat > "$PKG/OFFLINE_BACKUP_INFO.txt" <<EOF
          KHDN offline source backup
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Generated UTC: $(date -u '+%Y-%m-%d %H:%M:%S')
          This archive contains the complete khdn_apps source folder and Windows helper scripts.
          Production SQLite data is intentionally NOT embedded in GitHub artifacts.
          Put a downloaded production SQLite backup into data\\khdn_ops.db before first offline run if you want the same data.
          EOF

          cat > "$PKG/README_OFFLINE_VI.txt" <<'EOF'
          KHDN APPS - BAN OFFLINE WINDOWS 11
          ==================================

          1) YEU CAU LAN DAU
             - Windows 11
             - Python 3.11 64-bit da cai va co lenh py hoac python.
             - Can Internet mot lan duy nhat de cai thu vien Python.

          2) CAI DAT LAN DAU
             - Chay: 01_SETUP_OFFLINE.bat
             - Sau khi hien SETUP COMPLETE thi dong cua so.

          3) DUA DU LIEU PRODUCTION VAO OFFLINE
             - Tren app Production, vao Quan tri he thong > Sao luu / Backup.
             - Tai file SQLite backup hien tai.
             - Dat file .db vao thu muc data va doi ten thanh: khdn_ops.db
             - Neu data\\khdn_ops.db da ton tai, hay chay 03_BACKUP_DATA.bat truoc khi ghi de.

          4) CHAY APP OFFLINE
             - Chay: 02_START_OFFLINE.bat
             - Trinh duyet se mo tai http://127.0.0.1:8501
             - App su dung chinh logic Production hien tai nhung database nam tai data\\khdn_ops.db.

          5) SAO LUU DU LIEU OFFLINE
             - Chay: 03_BACKUP_DATA.bat
             - Script dung SQLite online backup API, kiem tra integrity va tao file .db + .sha256 trong thu muc backups.
             - Co the chay trong khi app dang mo.

          6) KHOI PHUC DU LIEU
             - Chay: 04_RESTORE_DATA.bat
             - Nhap duong dan file backup .db.
             - Script tu dong sao luu database hien tai truoc khi khoi phuc.
             - Nen dong app truoc khi restore.

          7) LUU Y
             - Khong chia se file data\\khdn_ops.db hoac cac file backups neu co du lieu khach hang.
             - Khong dua mat khau Production, VAPID key hay secret Railway vao goi offline.
          EOF

          cat > "$PKG/01_SETUP_OFFLINE.bat" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo [KHDN] Preparing Python environment...
          where py >nul 2>&1
          if %errorlevel%==0 (
            set "PY=py -3.11"
          ) else (
            set "PY=python"
          )
          %PY% --version || goto :python_error
          if not exist ".venv\Scripts\python.exe" (
            %PY% -m venv .venv || goto :fail
          )
          call ".venv\Scripts\activate.bat"
          python -m pip install --upgrade pip || goto :fail
          python -m pip install -r "khdn_apps\requirements.txt" || goto :fail
          if not exist data mkdir data
          if not exist backups mkdir backups
          echo.
          echo SETUP COMPLETE.
          echo Next: put production backup at data\khdn_ops.db if needed, then run 02_START_OFFLINE.bat
          pause
          exit /b 0
          :python_error
          echo Python 3.11 was not found. Install Python 3.11 64-bit, then run this file again.
          pause
          exit /b 1
          :fail
          echo SETUP FAILED. Review the messages above.
          pause
          exit /b 1
          EOF

          cat > "$PKG/02_START_OFFLINE.bat" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist ".venv\Scripts\python.exe" (
            echo Please run 01_SETUP_OFFLINE.bat first.
            pause
            exit /b 1
          )
          if not exist data mkdir data
          set "KHDN_CLOUD_MODE=0"
          set "KHDN_DATA_DIR=%CD%\data"
          set "KHDN_DB_PATH=%CD%\data\khdn_ops.db"
          set "PYTHONPATH=%CD%"
          set "TZ=Asia/Ho_Chi_Minh"
          echo [KHDN] Offline database: %KHDN_DB_PATH%
          echo [KHDN] Starting at http://127.0.0.1:8501
          start "" http://127.0.0.1:8501
          ".venv\Scripts\python.exe" -m streamlit run "khdn_apps\online_entry.py" --server.address 127.0.0.1 --server.port 8501 --server.headless true
          EOF

          cat > "$PKG/backup_data.py" <<'EOF'
          from __future__ import annotations
          import hashlib
          import sqlite3
          from datetime import datetime
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          src = ROOT / "data" / "khdn_ops.db"
          out_dir = ROOT / "backups"
          out_dir.mkdir(parents=True, exist_ok=True)
          if not src.exists():
              raise SystemExit(f"Database not found: {src}")
          stamp = datetime.now().strftime("%Y%m%d_%H%M%S")
          dst = out_dir / f"khdn_ops_backup_{stamp}.db"
          with sqlite3.connect(src) as source, sqlite3.connect(dst) as target:
              source.backup(target)
          with sqlite3.connect(dst) as check:
              result = check.execute("PRAGMA integrity_check").fetchone()[0]
          if str(result).lower() != "ok":
              dst.unlink(missing_ok=True)
              raise SystemExit(f"Backup integrity_check failed: {result}")
          digest = hashlib.sha256(dst.read_bytes()).hexdigest()
          sha_file = dst.with_suffix(dst.suffix + ".sha256")
          sha_file.write_text(f"{digest}  {dst.name}\n", encoding="utf-8")
          print(f"BACKUP_OK: {dst}")
          print(f"SHA256: {digest}")
          EOF

          cat > "$PKG/03_BACKUP_DATA.bat" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist ".venv\Scripts\python.exe" (
            echo Please run 01_SETUP_OFFLINE.bat first.
            pause
            exit /b 1
          )
          ".venv\Scripts\python.exe" backup_data.py
          echo.
          echo Backup folder: %CD%\backups
          pause
          EOF

          cat > "$PKG/restore_data.py" <<'EOF'
          from __future__ import annotations
          import hashlib
          import shutil
          import sqlite3
          import sys
          from datetime import datetime
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          data_dir = ROOT / "data"
          backup_dir = ROOT / "backups"
          data_dir.mkdir(parents=True, exist_ok=True)
          backup_dir.mkdir(parents=True, exist_ok=True)
          target = data_dir / "khdn_ops.db"

          raw = " ".join(sys.argv[1:]).strip().strip('"') if len(sys.argv) > 1 else input("Backup .db path: ").strip().strip('"')
          src = Path(raw).expanduser().resolve()
          if not src.exists() or not src.is_file():
              raise SystemExit(f"Backup file not found: {src}")
          with sqlite3.connect(src) as c:
              integrity = c.execute("PRAGMA integrity_check").fetchone()[0]
          if str(integrity).lower() != "ok":
              raise SystemExit(f"Source backup integrity_check failed: {integrity}")
          if target.exists():
              stamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              safety = backup_dir / f"pre_restore_{stamp}.db"
              with sqlite3.connect(target) as old, sqlite3.connect(safety) as safe:
                  old.backup(safe)
              print(f"Current database safety backup: {safety}")
          temp = target.with_suffix(".restore.tmp")
          shutil.copy2(src, temp)
          temp.replace(target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"RESTORE_OK: {target}")
          print(f"SHA256: {digest}")
          EOF

          cat > "$PKG/04_RESTORE_DATA.bat" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist ".venv\Scripts\python.exe" (
            echo Please run 01_SETUP_OFFLINE.bat first.
            pause
            exit /b 1
          )
          echo Close the KHDN offline app before restoring data.
          set /p "BACKUP=Enter full path to backup .db: "
          if "%BACKUP%"=="" exit /b 1
          ".venv\Scripts\python.exe" restore_data.py "%BACKUP%"
          pause
          EOF

          touch "$PKG/data/.keep" "$PKG/backups/.keep"

      - name: Upload offline source archive
        uses: actions/upload-artifact@v4
        with:
          name: KHDN-App-Offline-Backup
          path: KHDN-App-Offline
          if-no-files-found: error
          retention-days: 30
