name: Deep Company Analysis Chapter 8 Phase 8F V47

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-phase8f-closure-v47
    paths:
      - 'modules/deep_company_analysis/chapter8*.py'
      - 'modules/deep_company_analysis/test_chapter8_phase8f.py'
      - 'scripts/apply_chapter8_phase8f_v47.py'
      - 'scripts/qa_chapter8_phase8f_v47.py'
      - 'pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py'
      - 'pages/09_Phan_tich_chuyen_sau_Chuong_8.py'
      - 'pages/04_Bao_cao_tong_hop.py'
      - 'docs/CHAPTER8_PHASE8F_FINAL_CLOSURE_V47.md'
      - '.github/workflows/chapter8-phase8f-final-closure-v47.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase8f:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Apply Phase 8F completion-gate integration
        run: |
          set -euo pipefail
          python scripts/apply_chapter8_phase8f_v47.py
          git diff -- modules/deep_company_analysis/chapter8_page_support.py pages/04_Bao_cao_tong_hop.py

      - name: Commit integrated completion gate to V47 branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- modules/deep_company_analysis/chapter8_page_support.py pages/04_Bao_cao_tong_hop.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add modules/deep_company_analysis/chapter8_page_support.py pages/04_Bao_cao_tong_hop.py
            git commit -m "feat(dca): integrate Chapter 8 final completion gate"
            git push origin HEAD:feature/deep-company-analysis-chapter8-phase8f-closure-v47
          else
            echo "Phase 8F integration already applied."
          fi

      - name: Compile Phase 8F closure
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_completion.py
          python -m py_compile modules/deep_company_analysis/chapter8_page_support.py
          python -m py_compile modules/deep_company_analysis/test_chapter8_phase8f.py
          python -m py_compile scripts/apply_chapter8_phase8f_v47.py
          python -m py_compile scripts/qa_chapter8_phase8f_v47.py
          python -m py_compile pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          python -m py_compile pages/09_Phan_tich_chuyen_sau_Chuong_8.py
          python -m py_compile pages/04_Bao_cao_tong_hop.py

      - name: Chapter 8 Phase 8A-8F tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            2>&1 | tee reports/CH8_PHASE8F_TESTS_V47.log

      - name: Source-lock and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_PHASE8F_BOUNDARY_AUDIT_V47.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_completion import SOURCE_LOCKED_CAPITAL_ALLOCATION_ACTIONS

          assert tuple(ch8.CAPITAL_ALLOCATION_ACTIONS) == SOURCE_LOCKED_CAPITAL_ALLOCATION_ACTIONS
          assert len(ch8.EMPLOYEE_RELATION_DIMENSIONS) == 14
          page = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          assert 'st.data_editor(' not in page
          completion = Path('modules/deep_company_analysis/chapter8_completion.py').read_text(encoding='utf-8').casefold()
          assert 'research completeness only' in completion
          assert 'automatic_management_score' in completion
          assert 'automatic_investment_signal' in completion
          print('PASS: Q39-Q47 source lock, Q43=14, Q46=5, sortable editor boundary, analyst-only conclusion boundary.')
          PY

      - name: DGC Chapter 8 end-to-end closure acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_phase8f_v47.py 2>&1 | tee reports/CH8_PHASE8F_DGC_E2E_V47.log

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH8_PHASE8F_FULL_REGRESSION_V47.log

      - name: Streamlit unified DCA smoke
        run: |
          set -euo pipefail
          streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py \
            --server.headless true --server.port 8517 > reports/CH8_PHASE8F_DCA_STREAMLIT_V47.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8517/_stcore/health | tee reports/CH8_PHASE8F_DCA_HEALTH_V47.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8F_DCA_STREAMLIT_V47.log
          exit 1

      - name: Streamlit Chapter 8 standalone smoke
        run: |
          set -euo pipefail
          streamlit run pages/09_Phan_tich_chuyen_sau_Chuong_8.py \
            --server.headless true --server.port 8518 > reports/CH8_PHASE8F_CH8_STREAMLIT_V47.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8518/_stcore/health | tee reports/CH8_PHASE8F_CH8_HEALTH_V47.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8F_CH8_STREAMLIT_V47.log
          exit 1

      - name: Streamlit consolidated report smoke
        run: |
          set -euo pipefail
          streamlit run pages/04_Bao_cao_tong_hop.py \
            --server.headless true --server.port 8519 > reports/CH8_PHASE8F_REPORT_STREAMLIT_V47.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8519/_stcore/health | tee reports/CH8_PHASE8F_REPORT_HEALTH_V47.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_PHASE8F_REPORT_STREAMLIT_V47.log
          exit 1

      - name: Build offline package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8F V47\nBranch: feature/deep-company-analysis-chapter8-phase8f-closure-v47\nCommit: %s\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V47.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8F_V47.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8F_V47.zip | tail -n 3

      - name: Upload final Chapter 8 closure package
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8F_V47
          retention-days: 90
          path: |
            reports/CHAPTER8_PHASE8F_V47_ACCEPTANCE.json
            reports/CH8_PHASE8F_DGC_E2E_V47.json
            reports/CH8_PHASE8F_DGC_E2E_V47.log
            reports/CH8_PHASE8F_TESTS_V47.log
            reports/CH8_PHASE8F_BOUNDARY_AUDIT_V47.log
            reports/CH8_PHASE8F_FULL_REGRESSION_V47.log
            reports/CH8_PHASE8F_DCA_STREAMLIT_V47.log
            reports/CH8_PHASE8F_DCA_HEALTH_V47.txt
            reports/CH8_PHASE8F_CH8_STREAMLIT_V47.log
            reports/CH8_PHASE8F_CH8_HEALTH_V47.txt
            reports/CH8_PHASE8F_REPORT_STREAMLIT_V47.log
            reports/CH8_PHASE8F_REPORT_HEALTH_V47.txt
            docs/CHAPTER8_PHASE8F_FINAL_CLOSURE_V47.md
            Trecapital_Deep_Analysis_Chapter8_Phase8F_V47.zip
