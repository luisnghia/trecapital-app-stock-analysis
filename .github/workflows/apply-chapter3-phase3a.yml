name: Apply Chapter 3 Phase 3A Integration

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - '.github/workflows/apply-chapter3-phase3a.yml'

permissions:
  contents: write

jobs:
  apply-chapter3-phase3a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate Chapter 3 into unified page and CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py')
          text = page.read_text(encoding='utf-8')

          old_import = 'from modules.deep_company_analysis.chapter2_page_support import render_chapter2_tab\n'
          new_import = old_import + 'from modules.deep_company_analysis.chapter3 import render_chapter3\n'
          if 'from modules.deep_company_analysis.chapter3 import render_chapter3' not in text:
              if old_import not in text:
                  raise SystemExit('Chapter 2 import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_default = '''        st.session_state.get("dca_ch1_ticker")\n        or st.session_state.get("dca_ch2_ticker")\n        or st.session_state.get("active_ticker")'''
          new_default = '''        st.session_state.get("dca_ch1_ticker")\n        or st.session_state.get("dca_ch2_ticker")\n        or st.session_state.get("dca_ch3_ticker")\n        or st.session_state.get("active_ticker")'''
          if 'or st.session_state.get("dca_ch3_ticker")' not in text:
              if old_default not in text:
                  raise SystemExit('Default ticker anchor not found')
              text = text.replace(old_default, new_default, 1)

          old_tabs = '''chapter1_tab, chapter2_tab = st.tabs([\n    "📗 Chương 1 — Cơ hội đầu tư",\n    "📘 Chương 2 — Hiểu doanh nghiệp",\n])'''
          new_tabs = '''chapter1_tab, chapter2_tab, chapter3_tab = st.tabs([\n    "📗 Chương 1 — Cơ hội đầu tư",\n    "📘 Chương 2 — Hiểu doanh nghiệp",\n    "📙 Chương 3 — Góc nhìn khách hàng",\n])'''
          if 'chapter1_tab, chapter2_tab, chapter3_tab = st.tabs' not in text:
              if old_tabs not in text:
                  raise SystemExit('Tabs anchor not found')
              text = text.replace(old_tabs, new_tabs, 1)

          old_tail = '''with chapter2_tab:\n    chapter2_ticker = _safe_ticker(\n        str(\n            st.session_state.get("dca_ch2_ticker")\n            or st.session_state.get("dca_ch1_ticker")\n            or st.session_state.get("active_ticker")\n            or default_ticker\n        )\n    ) or default_ticker\n    render_chapter2_tab(chapter2_ticker)\n\napply_full_width()'''
          new_tail = '''with chapter2_tab:\n    chapter2_ticker = _safe_ticker(\n        str(\n            st.session_state.get("dca_ch2_ticker")\n            or st.session_state.get("dca_ch1_ticker")\n            or st.session_state.get("active_ticker")\n            or default_ticker\n        )\n    ) or default_ticker\n    render_chapter2_tab(chapter2_ticker)\n\nwith chapter3_tab:\n    chapter3_ticker = _safe_ticker(\n        str(\n            st.session_state.get("dca_ch3_ticker")\n            or st.session_state.get("dca_ch2_ticker")\n            or st.session_state.get("dca_ch1_ticker")\n            or st.session_state.get("active_ticker")\n            or default_ticker\n        )\n    ) or default_ticker\n    render_chapter3(chapter3_ticker)\n\napply_full_width()'''
          if 'with chapter3_tab:' not in text:
              if old_tail not in text:
                  raise SystemExit('Chapter 2 tail anchor not found')
              text = text.replace(old_tail, new_tail, 1)

          page.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/deep-company-analysis.yml')
          c = ci.read_text(encoding='utf-8')

          c = c.replace(
              'Compile deep-analysis Chapters 1-2',
              'Compile deep-analysis Chapters 1-3'
          )
          c = c.replace(
              'python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/08_Phan_tich_chuyen_sau_Chuong_2.py tre_sidebar_nav.py tools/dgc_chapter2_e2e.py',
              'python -m compileall -q modules/deep_company_analysis pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py pages/08_Phan_tich_chuyen_sau_Chuong_2.py tre_sidebar_nav.py tools/dgc_chapter2_e2e.py'
          )

          phase3_step = '''      - name: Run Chapter 3 Phase 3A acceptance explicitly\n        run: |\n          python -m pytest -q modules/deep_company_analysis/test_chapter3.py\n'''
          anchor = '''      - name: Run live DGC Chapter 2 end-to-end diagnostic\n'''
          if 'Run Chapter 3 Phase 3A acceptance explicitly' not in c:
              if anchor not in c:
                  raise SystemExit('CI live DGC anchor not found')
              c = c.replace(anchor, phase3_step + anchor, 1)

          c = c.replace('Trecapital_Deep_Analysis_Offline_V11', 'Trecapital_Deep_Analysis_Offline_V12')
          c = c.replace('Build lightweight Windows offline package V11', 'Build lightweight Windows offline package V12')
          c = c.replace('Upload offline package V11', 'Upload offline package V12')

          chapter3_assert = '          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter3.py"\n'
          chapter2_assert = '          test -f "dist/${PKG_NAME}/modules/deep_company_analysis/chapter2.py"\n'
          if chapter3_assert not in c:
              if chapter2_assert not in c:
                  raise SystemExit('Package module assertion anchor not found')
              c = c.replace(chapter2_assert, chapter2_assert + chapter3_assert, 1)

          doc_assert = '          test -f "dist/${PKG_NAME}/docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER3.md"\n'
          doc_anchor = '          test -f "dist/${PKG_NAME}/docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER2.md"\n'
          if doc_assert not in c:
              if doc_anchor not in c:
                  raise SystemExit('Package doc assertion anchor not found')
              c = c.replace(doc_anchor, doc_anchor + doc_assert, 1)

          lock_assert = '          test -f "dist/${PKG_NAME}/docs/CHAPTER2_LOCKED_ACCEPTANCE_DGC.md"\n'
          if lock_assert not in c:
              c = c.replace(doc_assert, doc_assert + lock_assert, 1)

          ci.write_text(c, encoding='utf-8')
          PY
      - name: Install dependencies for validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate Chapter 3 before commit
        run: |
          python -m compileall -q modules/deep_company_analysis/chapter3.py pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          python -m pytest -q modules/deep_company_analysis/test_chapter3.py
          python -m pytest -q modules/deep_company_analysis
      - name: Commit Phase 3A integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luisnghia"
          git config user.email "nghia1214@gmail.com"
          git add pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py .github/workflows/deep-company-analysis.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat(deep-analysis): integrate Chapter 3 Phase 3A tab"
          git push origin HEAD:feature/deep-company-analysis-checklist
