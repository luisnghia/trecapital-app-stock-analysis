name: Apply Chapter 6 Approved Phase 6A V29

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter6
    paths:
      - '.github/workflows/apply-chapter6-approved-phase6a-v29.yml'

permissions:
  contents: write

