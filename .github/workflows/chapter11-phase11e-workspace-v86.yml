name: Deep Company Analysis Chapter 11 Phase 11E Analyst Workspace V86

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter11-phase11e-v86
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  chapter11-phase11e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile Chapter 11 V86
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter11.py
          python -m py_compile modules/deep_company_analysis/chapter11_data_bridge.py
          python -m py_compile modules/deep_company_analysis/chapter11_research.py
          python -m py_compile modules/deep_company_analysis/chapter11_store.py
          python -m py_compile modules/deep_company_analysis/chapter11_page_support.py
          python -m py_compile modules/deep_company_analysis/test_chapter11_phase11e.py
          python -m py_compile scripts/qa_chapter11_workspace_v86.py
          python -m py_compile pages/09_Phan_tich_MA.py
          python -m py_compile app.py

      - name: Chapter 11 cumulative deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_chapter11_phase11a.py \
            modules/deep_company_analysis/test_chapter11_phase11b.py \
            modules/deep_company_analysis/test_chapter11_phase11c.py \
            modules/deep_company_analysis/test_chapter11_phase11d.py \
            modules/deep_company_analysis/test_chapter11_phase11e.py \
            2>&1 | tee reports/CH11_V86_DETERMINISTIC_TESTS.log

      - name: Chapter 11 V86 workspace acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter11_workspace_v86.py \
            2>&1 | tee reports/CH11_V86_WORKSPACE_ACCEPTANCE.log

      - name: Chapter 11 V86 source SSOT and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH11_V86_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter11 as ch11
          source = Path('modules/deep_company_analysis/chapter11_store.py').read_text(encoding='utf-8').casefold()
          ui = Path('modules/deep_company_analysis/chapter11_page_support.py').read_text(encoding='utf-8').casefold()
          docs = Path('docs/FORMULA_EXPLANATION_CHAPTER11_PHASE11E_V86.md').read_text(encoding='utf-8').casefold()
          assert ch11.QUESTION_KEYS == ('Q58', 'Q59')
          assert ch11.dimension_count_by_question() == {'Q58': 8, 'Q59': 7}
          assert len(ch11.dimension_ids()) == 15
          assert 'canonical_financials' not in source
          assert 'ev_ebitda' not in source
          assert 'promote selected evidence' in ui
          assert 'analyst owns conclusions' in ui
          assert 'does **not calculate** ev/ebit' in docs
          forbidden = ('buy/hold/sell', 'weighted ma score', 'weighted m&a score', 'automatic synergy forecast')
          assert all(term not in source for term in forbidden)
          print('PASS: V86 preserves Q58-Q59/15 source lock, analyst ownership, SSOT and investment boundaries.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH11_V86_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8549 \
            > reports/CH11_V86_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8549/_stcore/health \
              | tee reports/CH11_V86_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH11_V86_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V86 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 11 Phase 11E V86\nBranch: feature/deep-company-analysis-chapter11-phase11e-v86\nCommit: %s\nPurpose: analyst workspace, persistence and explicit Research Assistant promotion for Q58-Q59/15 dimensions; no duplicate financial SSOT, M&A score, success conclusion, synergy forecast, MOS/Research Gate change, or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH11_V86.txt
          zip -qr Trecapital_Deep_Analysis_Chapter11_Phase11E_V86.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter11_Phase11E_V86.zip | tail -n 3

      - name: Upload V86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter11_Phase11E_V86
          retention-days: 90
          path: |
            docs/CHAPTER11_PHASE11E_WORKSPACE_V86.md
            docs/FORMULA_EXPLANATION_CHAPTER11_PHASE11E_V86.md
            reports/CH11_PHASE11E_WORKSPACE_V86.json
            reports/CH11_V86_DETERMINISTIC_TESTS.log
            reports/CH11_V86_WORKSPACE_ACCEPTANCE.log
            reports/CH11_V86_BOUNDARY_AUDIT.log
            reports/CH11_V86_FULL_DCA_REGRESSION.log
            reports/CH11_V86_STREAMLIT_SERVER.log
            reports/CH11_V86_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter11_Phase11E_V86.zip
