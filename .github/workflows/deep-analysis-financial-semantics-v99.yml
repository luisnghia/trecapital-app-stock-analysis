name: Deep Company Analysis Financial Semantics TTM Provenance V99

on:
  push:
    branches:
      - feature/deep-company-analysis-financial-semantics-v99
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  financial-semantics-v99:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V99
        run: |
          set -euo pipefail
          python -m py_compile adapters/base.py
          python -m py_compile adapters/vn_public_crawler.py
          python -m py_compile module1_engine.py
          python -m py_compile modules/deep_company_analysis/financial_semantics.py
          python -m py_compile modules/deep_company_analysis/chapter6_quant.py
          python -m py_compile modules/deep_company_analysis/chapter6_page_support.py
          python -m py_compile modules/deep_company_analysis/test_financial_semantics_v99.py
          python -m py_compile scripts/qa_financial_semantics_v99.py
          python -m py_compile app.py

      - name: V99 deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_financial_semantics_v99.py \
            2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_DETERMINISTIC_TESTS.log

      - name: Parser TTM Chapter 6 regressions
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter6_quant.py \
            modules/deep_company_analysis/test_ttm_coverage_v32.py \
            modules/deep_company_analysis/test_chapter6_phase6b_integration.py \
            tools/test_fireant_parser.py \
            tools/test_fireant_raw_parser.py \
            2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_TARGETED_REGRESSION.log

      - name: Checklist financial bridge regression
        run: |
          set -euo pipefail
          pytest -q \
            modules/investment_checklist/tests/test_trecapital_bridge.py \
            modules/investment_checklist/tests/test_sign_safe_financial_formulas.py \
            2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_CHECKLIST_BRIDGE.log

      - name: V99 deterministic acceptance
        run: |
          set -euo pipefail
          python scripts/qa_financial_semantics_v99.py \
            2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_ACCEPTANCE.log

      - name: Financial SSOT and investment boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_BOUNDARY_AUDIT.log
          import json
          from pathlib import Path
          from adapters.base import MODULE1_TIMESERIES_COLUMNS

          required = {
              'net_profit_bil', 'net_profit_consolidated_bil', 'net_profit_parent_bil',
              'period_display', 'ttm_end_period', 'net_profit_scope',
              'comparability_status', 'comparability_note',
          }
          assert required.issubset(set(MODULE1_TIMESERIES_COLUMNS))
          report = json.loads(Path('reports/FINANCIAL_SEMANTICS_V99_ACCEPTANCE.json').read_text(encoding='utf-8'))
          assert report['acceptance'] == 'PASS'
          assert report['duplicate_financial_ssot_added'] is False
          assert report['automatic_weighted_score'] is False
          assert report['automatic_buy_hold_sell'] is False
          assert report['valuation_formula_changed'] is False
          assert report['ai_role'] == 'Research Assistant'
          assert report['conclusion_owner'] == 'Analyst'
          print('PASS: V99 hardens canonical semantics/provenance without a second SSOT or automatic investment judgement.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/FINANCIAL_SEMANTICS_V99_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8555 \
            > reports/FINANCIAL_SEMANTICS_V99_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8555/_stcore/health \
              | tee reports/FINANCIAL_SEMANTICS_V99_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/FINANCIAL_SEMANTICS_V99_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V99 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Financial Semantics V99\nBranch: feature/deep-company-analysis-financial-semantics-v99\nCommit: %s\nPurpose: canonical consolidated-vs-parent PAT semantics, EPS scope guardrail, complete-four-quarter TTM and dated period provenance.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_FINANCIAL_SEMANTICS_V99.txt
          zip -qr Trecapital_Deep_Analysis_Financial_Semantics_V99.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Financial_Semantics_V99.zip | tail -n 3
          sha256sum Trecapital_Deep_Analysis_Financial_Semantics_V99.zip | tee reports/FINANCIAL_SEMANTICS_V99_OFFLINE_ZIP_SHA256.txt

      - name: Upload V99 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Financial_Semantics_V99
          retention-days: 90
          path: |
            CHANGELOG_V99_DEEP_ANALYSIS_FINANCIAL_SEMANTICS.md
            docs/DEEP_ANALYSIS_FINANCIAL_SEMANTICS_TTM_PROVENANCE_V99.md
            docs/FORMULA_EXPLANATION_FINANCIAL_SEMANTICS_TTM_V99.md
            reports/FINANCIAL_SEMANTICS_V99_ACCEPTANCE.json
            reports/FINANCIAL_SEMANTICS_V99_DETERMINISTIC_TESTS.log
            reports/FINANCIAL_SEMANTICS_V99_TARGETED_REGRESSION.log
            reports/FINANCIAL_SEMANTICS_V99_CHECKLIST_BRIDGE.log
            reports/FINANCIAL_SEMANTICS_V99_ACCEPTANCE.log
            reports/FINANCIAL_SEMANTICS_V99_BOUNDARY_AUDIT.log
            reports/FINANCIAL_SEMANTICS_V99_FULL_DCA_REGRESSION.log
            reports/FINANCIAL_SEMANTICS_V99_STREAMLIT_SERVER.log
            reports/FINANCIAL_SEMANTICS_V99_STREAMLIT_HEALTH.txt
            reports/FINANCIAL_SEMANTICS_V99_OFFLINE_ZIP_SHA256.txt
            Trecapital_Deep_Analysis_Financial_Semantics_V99.zip
