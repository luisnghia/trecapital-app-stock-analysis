name: Apply Deep Analysis Table Format Lock V30B

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter6
    paths:
      - '.github/workflows/apply-deep-analysis-format-lock-v30b.yml'

permissions:
  contents: write

jobs:
  apply-format-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter6
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Apply shared table format lock
        shell: bash
        run: |
          cat > modules/deep_company_analysis/table_format.py <<'PY'
          from __future__ import annotations

          from html import escape
          from typing import Any

          import pandas as pd
          import streamlit as st


          def infer_numeric_kind(column: str) -> str:
              name = str(column or '').strip()
              low = name.casefold()
              if '(tỷ)' in low or ' tỷ' in low or low.endswith('tỷ'):
                  return 'amount_bil'
              if '(ngày)' in low or ' ngày' in low or low in {'dso', 'dio', 'dpo', 'ccc'} or low.startswith(('dso ', 'dio ', 'dpo ', 'ccc ')):
                  return 'days'
              if '(x)' in low or '/ebit' in low or '/interest' in low or 'current ratio' in low or 'turnover' in low or 'turns' in low:
                  return 'ratio'
              if any(token in low for token in ('%', 'margin', 'roic', 'yield', 'growth', 'tăng trưởng', 'revenue share', 'market share', 'retention rate', 'churn rate')):
                  return 'percent'
              return 'text'


          def format_numeric(value: Any, kind: str) -> str:
              try:
                  if value is None or pd.isna(value):
                      return '—'
                  number = float(value)
              except Exception:
                  return escape(str(value or ''))
              if kind == 'amount_bil':
                  return f'{number:,.0f}'
              if kind == 'percent':
                  return f'{number:,.1f}%'
              if kind == 'ratio':
                  return f'{number:,.1f}x'
              if kind == 'days':
                  return f'{number:,.1f}'
              return escape(str(value))


          def _heat_eligible(column: str) -> bool:
              low = str(column or '').casefold()
              return any(token.casefold() in low for token in (
                  'tăng trưởng', 'growth', 'change', 'delta', 'Δ', 'margin', 'roic',
                  'cfo', 'fcf', 'ebit', 'profit', 'lợi nhuận', 'cash flow', 'dòng tiền',
                  'headroom', 'impact',
              ))


          def _heat_style(value: Any, max_abs: float) -> str:
              try:
                  number = float(value)
              except Exception:
                  return ''
              if pd.isna(number) or number == 0:
                  return ''
              scale = min(1.0, abs(number) / max_abs) if max_abs > 0 else 0.0
              alpha = 0.07 + 0.23 * scale
              if number < 0:
                  return f'color:#991B1B;font-weight:700;background:rgba(185,28,28,{alpha:.3f});'
              return f'color:#047857;font-weight:700;background:rgba(4,120,87,{alpha:.3f});'


          def _coerce_frame(value: Any) -> pd.DataFrame:
              if isinstance(value, pd.DataFrame):
                  return value.copy()
              data = getattr(value, 'data', None)
              if isinstance(data, pd.DataFrame):
                  return data.copy()
              try:
                  return pd.DataFrame(value)
              except Exception:
                  return pd.DataFrame()


          def static_table_html(value: Any, *, height: int | None = None) -> str:
              frame = _coerce_frame(value)
              if frame.empty:
                  return ''
              cols = list(frame.columns)
              max_abs: dict[str, float] = {}
              for column in cols:
                  kind = infer_numeric_kind(column)
                  if kind == 'text' or not _heat_eligible(column):
                      continue
                  numeric = pd.to_numeric(frame[column], errors='coerce').abs().dropna()
                  max_abs[column] = float(numeric.max()) if not numeric.empty else 0.0

              head = ''.join(f'<th>{escape(str(column))}</th>' for column in cols)
              body: list[str] = []
              for _, row in frame.iterrows():
                  cells: list[str] = []
                  for column in cols:
                      kind = infer_numeric_kind(column)
                      raw = row.get(column)
                      if kind == 'text':
                          if raw is None or (isinstance(raw, float) and pd.isna(raw)):
                              text = '—'
                          else:
                              text = escape(str(raw))
                          cells.append(f'<td>{text}</td>')
                      else:
                          style = _heat_style(raw, max_abs.get(column, 0.0)) if _heat_eligible(column) else ''
                          cells.append(f'<td class="num" style="{style}">{format_numeric(raw, kind)}</td>')
                  body.append('<tr>' + ''.join(cells) + '</tr>')

              max_height = f'max-height:{int(height)}px;' if height else ''
              return (
                  '<div class="tre-dca-static-table"><style>'
                  '.tre-dca-static-table{overflow:auto;width:100%;' + max_height + '}'
                  '.tre-dca-static-table table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:.92rem;}'
                  '.tre-dca-static-table th,.tre-dca-static-table td{border:1px solid rgba(148,163,184,.35);padding:7px 8px;'
                  'white-space:normal;overflow-wrap:anywhere;vertical-align:top;}'
                  '.tre-dca-static-table th{position:sticky;top:0;z-index:1;background:#F0FDF4;color:#065F46;font-weight:800;}'
                  '.tre-dca-static-table td.num{text-align:right;font-variant-numeric:tabular-nums;}'
                  '</style><table><thead><tr>' + head + '</tr></thead><tbody>' + ''.join(body) + '</tbody></table></div>'
              )


          def render_static_table(value: Any, **kwargs: Any) -> None:
              frame = _coerce_frame(value)
              if frame.empty:
                  st.caption('Chưa có dữ liệu.')
                  return
              height = kwargs.get('height')
              st.html(static_table_html(frame, height=int(height) if height else None))


          __all__ = ['format_numeric', 'infer_numeric_kind', 'render_static_table', 'static_table_html']
          PY

          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('modules/deep_company_analysis/chapter2.py'),
              Path('modules/deep_company_analysis/chapter2_page_support.py'),
              Path('modules/deep_company_analysis/chapter3.py'),
              Path('modules/deep_company_analysis/chapter3_page_support.py'),
              Path('modules/deep_company_analysis/chapter4.py'),
              Path('modules/deep_company_analysis/chapter4_page_support.py'),
              Path('modules/deep_company_analysis/chapter5.py'),
              Path('modules/deep_company_analysis/chapter5_page_support.py'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              import_line = 'from modules.deep_company_analysis.table_format import render_static_table\n'
              if import_line not in text:
                  marker = 'import streamlit as st\n'
                  assert marker in text, path
                  text = text.replace(marker, marker + '\n' + import_line, 1)
              text = text.replace('st.dataframe(', 'render_static_table(')
              path.write_text(text, encoding='utf-8')

          p = Path('modules/deep_company_analysis/chapter5_page_support.py')
          text = p.read_text(encoding='utf-8')
          old = '''                def _fmt(value, suffix=""):\n                    try:\n                        if value is None or pd.isna(value):\n                            return "—"\n                        return f"{float(value):,.1f}{suffix}"\n                    except Exception:\n                        return "—"\n                cols[0].metric("Nợ vay ròng", _fmt(latest.get("Nợ vay ròng (tỷ)"), " tỷ"))\n'''
          new = '''                def _fmt(value, suffix="", decimals=1):\n                    try:\n                        if value is None or pd.isna(value):\n                            return "—"\n                        return f"{float(value):,.{int(decimals)}f}{suffix}"\n                    except Exception:\n                        return "—"\n                cols[0].metric("Nợ vay ròng", _fmt(latest.get("Nợ vay ròng (tỷ)"), " tỷ", decimals=0))\n'''
          assert old in text, 'Chapter 5 amount metric formatter changed.'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > docs/DEEP_ANALYSIS_TABLE_FORMAT_LOCK.md <<'MD'
          # Deep Company Analysis — Table & Numeric Display Format Lock V30

          Scope: Chapters 1–6 unified Deep Company Analysis workspace.

          - Amounts denominated in VND: **tỷ đồng, 0 decimals**.
          - Percentages: **1 decimal**.
          - Ratios: **1 decimal**.
          - CCC/DSO/DIO/DPO: **1 decimal**.
          - Negative signed performance/cash-flow values: red heat; positive signed performance/growth: emerald heat. Heat is not an investment-quality conclusion.
          - Read-only/static tables: `st.html()` via `render_static_table()`.
          - Editable analyst registers: `st.data_editor()`.
          - CSS: `table-layout: fixed`, `white-space: normal`, `overflow-wrap: anywhere`.
          - Missing values: `—`; no fabricated unit/value.

          Audit: Chapter 1 already had no legacy `st.dataframe`; Chapters 2–5 static tables are migrated to the shared renderer. Chapter 5 `Nợ vay ròng (tỷ)` metric is corrected from 1 decimal to 0 decimals. Chapter 6 retains approved V29 formatting and follows the same contract.
          MD

          cat > modules/deep_company_analysis/test_table_format.py <<'PY'
          from pathlib import Path
          import pandas as pd
          from modules.deep_company_analysis.table_format import format_numeric, infer_numeric_kind, static_table_html

          def test_numeric_contract():
              assert infer_numeric_kind('Doanh thu (tỷ)') == 'amount_bil'
              assert infer_numeric_kind('ROIC canonical %') == 'percent'
              assert infer_numeric_kind('Debt/EBITDA (x)') == 'ratio'
              assert infer_numeric_kind('CCC ngày') == 'days'
              assert format_numeric(1234.56, 'amount_bil') == '1,235'
              assert format_numeric(12.345, 'percent') == '12.3%'
              assert format_numeric(2.345, 'ratio') == '2.3x'
              assert format_numeric(45.67, 'days') == '45.7'

          def test_html_contract():
              df = pd.DataFrame([
                  {'Kỳ':'2025','FCF (tỷ)':-123.6,'Tăng trưởng DT %':10.25,'Debt/EBITDA (x)':2.34},
                  {'Kỳ':'2026','FCF (tỷ)':250.4,'Tăng trưởng DT %':-5.44,'Debt/EBITDA (x)':3.11},
              ])
              html = static_table_html(df)
              assert 'table-layout:fixed' in html
              assert 'white-space:normal' in html
              assert 'overflow-wrap:anywhere' in html
              assert 'rgba(185,28,28' in html
              assert 'rgba(4,120,87' in html
              assert '-124' in html and '250' in html
              assert '10.2%' in html and '-5.4%' in html and '2.3x' in html

          def test_no_legacy_static_dataframes_ch2_ch5():
              root = Path(__file__).resolve().parent
              files = ['chapter2.py','chapter2_page_support.py','chapter3.py','chapter3_page_support.py','chapter4.py','chapter4_page_support.py','chapter5.py','chapter5_page_support.py']
              for name in files:
                  text = (root / name).read_text(encoding='utf-8')
                  assert 'st.dataframe(' not in text, name
                  assert 'render_static_table(' in text, name

          def test_ch5_amount_metric_zero_decimals():
              text = (Path(__file__).resolve().parent / 'chapter5_page_support.py').read_text(encoding='utf-8')
              assert '_fmt(latest.get("Nợ vay ròng (tỷ)"), " tỷ", decimals=0)' in text
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile and test
        run: |
          python -m py_compile \
            modules/deep_company_analysis/table_format.py \
            modules/deep_company_analysis/chapter1.py \
            modules/deep_company_analysis/chapter2.py \
            modules/deep_company_analysis/chapter2_page_support.py \
            modules/deep_company_analysis/chapter3.py \
            modules/deep_company_analysis/chapter3_page_support.py \
            modules/deep_company_analysis/chapter4.py \
            modules/deep_company_analysis/chapter4_page_support.py \
            modules/deep_company_analysis/chapter5.py \
            modules/deep_company_analysis/chapter5_page_support.py \
            modules/deep_company_analysis/chapter6.py \
            modules/deep_company_analysis/chapter6_page_support.py \
            pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py
          pytest -q modules/deep_company_analysis/test_table_format.py
          pytest -q modules/deep_company_analysis

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            modules/deep_company_analysis/chapter2.py
            modules/deep_company_analysis/chapter2_page_support.py
            modules/deep_company_analysis/chapter3.py
            modules/deep_company_analysis/chapter3_page_support.py
            modules/deep_company_analysis/chapter4.py
            modules/deep_company_analysis/chapter4_page_support.py
            modules/deep_company_analysis/chapter5.py
            modules/deep_company_analysis/chapter5_page_support.py
          )
          if grep -n 'st\.dataframe(' "${targets[@]}"; then exit 1; fi
          if grep -nE ':,\.1f\} ?tỷ|:,.1f.*tỷ' "${targets[@]}"; then exit 1; fi
          grep -q 'table-layout:fixed' modules/deep_company_analysis/table_format.py
          grep -q 'white-space:normal' modules/deep_company_analysis/table_format.py
          grep -q 'overflow-wrap:anywhere' modules/deep_company_analysis/table_format.py

      - name: Commit V30 format lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            modules/deep_company_analysis/table_format.py \
            modules/deep_company_analysis/test_table_format.py \
            modules/deep_company_analysis/chapter2.py \
            modules/deep_company_analysis/chapter2_page_support.py \
            modules/deep_company_analysis/chapter3.py \
            modules/deep_company_analysis/chapter3_page_support.py \
            modules/deep_company_analysis/chapter4.py \
            modules/deep_company_analysis/chapter4_page_support.py \
            modules/deep_company_analysis/chapter5.py \
            modules/deep_company_analysis/chapter5_page_support.py \
            docs/DEEP_ANALYSIS_TABLE_FORMAT_LOCK.md
          git commit -m 'fix(dca): normalize Chapters 1-5 table and numeric formats V30'
          git push origin HEAD:feature/deep-company-analysis-chapter6
