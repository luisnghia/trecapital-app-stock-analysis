name: Apply Chapter 3 Phase 3D Lock Hardening

on:
  push:
    branches:
      - feature/deep-company-analysis-checklist
    paths:
      - 'scripts/apply_chapter3_phase3d_lock_patch.py'
      - '.github/workflows/apply-chapter3-phase3d-lock.yml'

permissions:
  contents: write

jobs:
  apply-phase3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-checklist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Apply Phase 3D patch
        run: python scripts/apply_chapter3_phase3d_lock_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile changed sources
        run: |
          python -m compileall -q modules/deep_company_analysis/chapter3_auto.py modules/deep_company_analysis/chapter3_page_support.py tools/dgc_chapter3_e2e.py
      - name: Run Phase 3D tests
        run: python -m pytest -q modules/deep_company_analysis/test_chapter3_phase3d.py
      - name: Run Chapter 3 regression
        run: |
          python -m pytest -q modules/deep_company_analysis/test_chapter3.py
          python -m pytest -q modules/deep_company_analysis/test_chapter3_auto.py
      - name: Run full deep-analysis regression
        run: python -m pytest -q modules/deep_company_analysis
      - name: Run DGC Chapter 3 live diagnostic
        run: python tools/dgc_chapter3_e2e.py
      - name: Commit Phase 3D generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/chapter3_auto.py \
                  modules/deep_company_analysis/chapter3_page_support.py \
                  modules/deep_company_analysis/test_chapter3_phase3d.py \
                  tools/dgc_chapter3_e2e.py \
                  docs/CONTEXT_DEEP_COMPANY_ANALYSIS_CHAPTER3.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat(ch3): harden Phase 3D DGC acceptance"
            git push origin HEAD:feature/deep-company-analysis-checklist
          fi
