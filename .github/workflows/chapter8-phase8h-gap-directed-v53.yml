name: Deep Company Analysis Chapter 8 Phase 8H V53

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-gap-directed-research-v53
  workflow_dispatch:

jobs:
  chapter8-phase8h:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V53 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_gap_directed_research.py
          python -m py_compile modules/deep_company_analysis/chapter8_research_v53.py
          python -m py_compile scripts/qa_chapter8_gap_directed_v53.py

      - name: Chapter 8 Phase 8A-8H deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            2>&1 | tee reports/CH8_V53_DETERMINISTIC_TESTS.log

      - name: Live DGC gap-directed acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_gap_directed_v53.py \
            2>&1 | tee reports/CH8_DGC_GAP_DIRECTED_LIVE_V53.log

      - name: Chapter 8 V53 source and analyst boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V53_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_gap_directed_research import build_gap_targets
          import pandas as pd

          page_support = Path('modules/deep_company_analysis/chapter8_page_support.py').read_text(encoding='utf-8')
          compat = Path('modules/deep_company_analysis/chapter8_research_v52.py').read_text(encoding='utf-8')
          core = Path('modules/deep_company_analysis/chapter8_gap_directed_research.py').read_text(encoding='utf-8').casefold()
          assert 'chapter8_research_v52 import CANDIDATE_COLUMNS, Chapter8ResearchAgent' in page_support
          assert 'chapter8_research_v53 import *' in compat
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          targets = build_gap_targets(pd.DataFrame(), pd.DataFrame(), max_targets=9)
          assert len(targets) == 9
          assert 'discipline_hurdle_context' not in set(targets['Dimension Key'])
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          print('PASS: V53 targets only open source-locked dimensions and preserves analyst control.')
          PY

      - name: Full Deep Company Analysis regression
        shell: bash
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V53_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8525 \
            > reports/CH8_V53_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8525/_stcore/health \
              | tee reports/CH8_V53_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V53_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V53 package
        shell: bash
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8H V53\nBranch: feature/deep-company-analysis-chapter8-gap-directed-research-v53\nCommit: %s\nPurpose: gap-directed research from open source-locked dimensions; analyst verification/promotion remains required.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V53.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8H_V53.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8H_V53.zip | tail -n 3

      - name: Upload V53 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8H_V53
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8H_GAP_DIRECTED_RESEARCH.md
            reports/CH8_DGC_GAP_DIRECTED_ACCEPTANCE_V53.json
            reports/CH8_DGC_GAP_TARGETS_V53.csv
            reports/CH8_DGC_GAP_QUERY_LOG_V53.csv
            reports/CH8_DGC_GAP_DIRECTED_NEW_CANDIDATES_V53.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_BEFORE_V53.csv
            reports/CH8_DGC_DIMENSION_COVERAGE_AFTER_V53.csv
            reports/CH8_DGC_REMAINING_GAPS_V53.csv
            reports/CH8_DGC_GAP_DIRECTED_LIVE_V53.log
            reports/CH8_V53_DETERMINISTIC_TESTS.log
            reports/CH8_V53_BOUNDARY_AUDIT.log
            reports/CH8_V53_FULL_DCA_REGRESSION.log
            reports/CH8_V53_STREAMLIT_SERVER.log
            reports/CH8_V53_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8H_V53.zip
