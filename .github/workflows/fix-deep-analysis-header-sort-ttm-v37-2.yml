name: Deep Analysis V37.2 — Native Header Sort + TTM Latest

on:
  push:
    branches: [feature/deep-company-analysis-chapter7]
    paths: ['.github/workflows/fix-deep-analysis-header-sort-ttm-v37-2.yml']

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deep-company-analysis-chapter7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply V37.2 header-sort + TTM migration
        run: |
          python scripts/apply_deep_analysis_header_sort_ttm_v37_2.py
          python scripts/apply_deep_analysis_header_sort_ttm_v37_2b.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile changed production files
        run: |
          python -m py_compile modules/deep_company_analysis/table_format.py
          python -m py_compile modules/deep_company_analysis/chapter1.py
          python -m py_compile modules/deep_company_analysis/monitoring.py

      - name: QA 1 — Native header-sort contract
        run: pytest -q modules/deep_company_analysis/test_sortable_table_v32.py

      - name: QA 2 — TTM coverage remains source-safe
        run: pytest -q modules/deep_company_analysis/test_ttm_coverage_v32.py

      - name: QA 3 — Full Deep Company Analysis regression
        run: pytest -q modules/deep_company_analysis/test_*.py

      - name: Static audit — no old visible sort controls
        shell: bash
        run: |
          if grep -R --line-number --include='*.py' '"Sort theo cột"\|"Thứ tự"' modules/deep_company_analysis | grep -v '/test_'; then
            echo 'Legacy visible sort controls remain in production.'
            exit 1
          fi
          if grep -R --line-number --include='*.py' 'interactive_sort_frame(' modules/deep_company_analysis | grep -v 'table_format.py' | grep -v '/test_'; then
            echo 'Legacy production caller remains.'
            exit 1
          fi

      - name: Streamlit smoke
        shell: bash
        run: |
          mkdir -p reports
          timeout 55s streamlit run pages/07_Phan_tich_chuyen_sau_doanh_nghiep.py --server.headless true --server.port 8542 >reports/DCA_V37_2_streamlit.log 2>&1 &
          PID=$!
          sleep 18
          curl --fail --silent http://127.0.0.1:8542/_stcore/health
          STATUS=$?
          kill $PID || true
          wait $PID || true
          tail -n 100 reports/DCA_V37_2_streamlit.log || true
          exit $STATUS

      - name: Write V37.2 audit record
        shell: bash
        run: |
          cat > docs/DEEP_ANALYSIS_V37_2_HEADER_SORT_TTM_AUDIT.md <<'EOF'
          # Deep Analysis V37.2 — Native Header Sort + TTM Latest

          Status: PASS

          - Removed the visible `Sort theo cột / Thứ tự` controls from the shared table layer.
          - Read-only tables use Streamlit native dataframe grids; users sort by clicking the column header.
          - Editable tables no longer receive a separate sort widget; they use the native Streamlit editor behavior.
          - Chapter 1 Opportunity Inventory, Gate History, and Monitoring Review Queue migrated from custom static HTML to the shared native grid.
          - TTM, when already present in canonical data, is kept as the latest/default displayed period.
          - No TTM row is fabricated when canonical TTM is unavailable.
          - Existing numeric units/precision and positive/negative heat rules remain in the shared table layer.
          - Full Deep Company Analysis regression and Streamlit smoke passed.
          EOF

      - name: Commit V37.2 production migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/deep_company_analysis/table_format.py
          git add modules/deep_company_analysis/chapter1.py
          git add modules/deep_company_analysis/monitoring.py
          git add modules/deep_company_analysis/test_sortable_table_v32.py
          git add docs/DEEP_ANALYSIS_V37_2_HEADER_SORT_TTM_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(dca): use native header sorting and TTM latest V37.2"
            git push origin HEAD:feature/deep-company-analysis-chapter7
          fi

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DCA_V37_2_HEADER_SORT_TTM_REPORT
          path: reports/DCA_V37_2_streamlit.log
          if-no-files-found: warn
          retention-days: 30
