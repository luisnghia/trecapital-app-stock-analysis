name: Deep Company Analysis Chapter 11 Phase 11G History V88

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter11-phase11g-v88
  workflow_dispatch:

jobs:
  chapter11-phase11g:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports
      - name: Compile Chapter 11 V88
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter11_history.py
          python -m py_compile modules/deep_company_analysis/chapter11_store.py
          python -m py_compile modules/deep_company_analysis/test_chapter11_phase11g.py
          python -m py_compile scripts/qa_chapter11_history_v88.py
          python -m py_compile app.py
      - name: Chapter 11 cumulative deterministic tests
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_chapter11_phase11*.py 2>&1 | tee reports/CH11_V88_DETERMINISTIC_TESTS.log
      - name: Chapter 11 V88 history acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter11_history_v88.py 2>&1 | tee reports/CH11_V88_HISTORY_ACCEPTANCE.log
      - name: Chapter 11 V88 source and investment-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH11_V88_BOUNDARY_AUDIT.log
          from pathlib import Path
          import modules.deep_company_analysis.chapter11 as ch11
          import modules.deep_company_analysis.chapter11_history as h
          import modules.deep_company_analysis.chapter11_store as s
          src = Path(h.__file__).read_text(encoding='utf-8').casefold()
          assert ch11.QUESTION_KEYS == ('Q58','Q59')
          assert len(ch11.dimension_ids()) == 15
          assert s.SCHEMA_VERSION == 3
          assert 'historical source freshness is never reconstructed' in src
          assert 'ebitda =' not in src
          assert 'intrinsic_value =' not in src
          assert 'automatic_ma_score' in src
          assert 'automatic_acquisition_success_classification' in src
          assert 'automatic_synergy_forecast' in src
          assert 'automatic_investment_signal' in src
          print('PASS: V88 preserves source lock, immutable history, analyst ownership, SSOT and investment boundaries.')
          PY
      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py 2>&1 | tee reports/CH11_V88_FULL_DCA_REGRESSION.log
      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8550 > reports/CH11_V88_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8550/_stcore/health | tee reports/CH11_V88_STREAMLIT_HEALTH.txt | grep -q ok; then exit 0; fi
            sleep 1
          done
          cat reports/CH11_V88_STREAMLIT_SERVER.log
          exit 1
      - name: Build offline V88 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 11 Phase 11G V88\nBranch: feature/deep-company-analysis-chapter11-phase11g-v88\nCommit: %s\nPurpose: immutable Chapter 11 snapshots, neutral delta/version lineage and explicit analyst re-review; no M&A score, acquisition-success classification, synergy forecast, duplicate financial SSOT, MOS/Research Gate change, or automatic investment conclusion.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH11_V88.txt
          zip -qr Trecapital_Deep_Analysis_Chapter11_Phase11G_V88.zip . -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter11_Phase11G_V88.zip | tail -n 3
      - name: Upload V88 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter11_Phase11G_V88
          retention-days: 90
          path: |
            docs/CHAPTER11_PHASE11G_HISTORY_V88.md
            docs/FORMULA_EXPLANATION_CHAPTER11_PHASE11G_V88.md
            reports/CH11_V88_DETERMINISTIC_TESTS.log
            reports/CH11_V88_HISTORY_ACCEPTANCE.log
            reports/CH11_V88_BOUNDARY_AUDIT.log
            reports/CH11_V88_FULL_DCA_REGRESSION.log
            reports/CH11_V88_STREAMLIT_SERVER.log
            reports/CH11_V88_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter11_Phase11G_V88.zip
