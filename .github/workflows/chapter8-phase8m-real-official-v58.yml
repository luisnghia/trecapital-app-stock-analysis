name: Deep Company Analysis Chapter 8 Phase 8M V58

on:
  push:
    branches:
      - feature/deep-company-analysis-chapter8-real-official-v58
    paths:
      - 'modules/deep_company_analysis/**'
      - 'scripts/qa_chapter8_real_official_v58.py'
      - 'docs/CHAPTER8_PHASE8M_REAL_OFFICIAL_DOCUMENT_ACCEPTANCE_V58.md'
      - '.github/workflows/chapter8-phase8m-real-official-v58.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter8-phase8m:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          mkdir -p reports

      - name: Compile V58 modules
        run: |
          set -euo pipefail
          python -m py_compile modules/deep_company_analysis/chapter8_real_official_sources.py
          python -m py_compile scripts/qa_chapter8_real_official_v58.py

      - name: Chapter 8 Phase 8A-8M deterministic tests
        run: |
          set -euo pipefail
          pytest -q \
            modules/deep_company_analysis/test_chapter8_phase8a.py \
            modules/deep_company_analysis/test_chapter8_phase8b.py \
            modules/deep_company_analysis/test_chapter8_phase8c.py \
            modules/deep_company_analysis/test_chapter8_phase8d.py \
            modules/deep_company_analysis/test_chapter8_phase8e.py \
            modules/deep_company_analysis/test_chapter8_phase8f.py \
            modules/deep_company_analysis/test_chapter8_phase8g.py \
            modules/deep_company_analysis/test_chapter8_phase8h.py \
            modules/deep_company_analysis/test_chapter8_phase8i.py \
            modules/deep_company_analysis/test_chapter8_phase8j.py \
            modules/deep_company_analysis/test_chapter8_phase8k.py \
            modules/deep_company_analysis/test_chapter8_phase8l.py \
            modules/deep_company_analysis/test_chapter8_phase8m.py \
            2>&1 | tee reports/CH8_V58_DETERMINISTIC_TESTS.log

      - name: Live DGC real official document acceptance
        run: |
          set -euo pipefail
          python scripts/qa_chapter8_real_official_v58.py \
            2>&1 | tee reports/CH8_DGC_REAL_OFFICIAL_LIVE_V58.log

      - name: Chapter 8 V58 source and analyst-boundary audit
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee reports/CH8_V58_BOUNDARY_AUDIT.log
          from pathlib import Path
          import json
          import modules.deep_company_analysis.chapter8 as ch8
          from modules.deep_company_analysis.chapter8_gap_engine import validate_source_locks
          from modules.deep_company_analysis.chapter8_real_official_sources import (
              DGC_REAL_OFFICIAL_SOURCES, v54_historical_open_keys,
          )
          from modules.deep_company_analysis.chapter8_official_source_adapters import is_official_url

          core = Path('modules/deep_company_analysis/chapter8_real_official_sources.py').read_text(encoding='utf-8').casefold()
          qa = Path('scripts/qa_chapter8_real_official_v58.py').read_text(encoding='utf-8').casefold()
          acceptance = json.loads(Path('reports/CH8_DGC_REAL_OFFICIAL_ACCEPTANCE_V58.json').read_text(encoding='utf-8'))
          assert len(v54_historical_open_keys()) == 40
          assert len(DGC_REAL_OFFICIAL_SOURCES) >= 4
          assert all(is_official_url(x.document_url, 'DGC') for x in DGC_REAL_OFFICIAL_SOURCES)
          assert 'promote_selected_candidates' not in core
          assert 'save_record' not in core
          assert 'analyst_assessment' not in core
          assert acceptance['real_docs_are_preapproved_evidence'] is False
          assert acceptance['auto_promoted_evidence'] is False
          assert acceptance['analyst_workspace_mutated'] is False
          locks = validate_source_locks()
          assert locks['q43_dimension_count'] == 14
          assert locks['q46_source_locked_actions'] == tuple(ch8.CAPITAL_ALLOCATION_ACTIONS)
          assert locks['q46_source_locked_count'] == 5
          assert locks['q47_share_count_is_proof'] is False
          print('PASS: V58 uses real issuer PDFs, preserves the 40-gap V54 baseline, and keeps analyst control.')
          PY

      - name: Full Deep Company Analysis regression
        run: |
          set -euo pipefail
          pytest -q modules/deep_company_analysis/test_*.py \
            2>&1 | tee reports/CH8_V58_FULL_DCA_REGRESSION.log

      - name: Production Streamlit health
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless true --server.port 8530 \
            > reports/CH8_V58_STREAMLIT_SERVER.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8530/_stcore/health \
              | tee reports/CH8_V58_STREAMLIT_HEALTH.txt | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          cat reports/CH8_V58_STREAMLIT_SERVER.log
          exit 1

      - name: Build offline V58 package
        run: |
          set -euo pipefail
          printf 'Trecapital Deep Company Analysis Chapter 8 Phase 8M V58\nBranch: feature/deep-company-analysis-chapter8-real-official-v58\nCommit: %s\nPurpose: real DGC official-document acceptance against the historical V54 40-gap baseline; all evidence remains analyst-verified candidates.\n' "$(git rev-parse HEAD)" > OFFLINE_BUILD_INFO_CH8_V58.txt
          zip -qr Trecapital_Deep_Analysis_Chapter8_Phase8M_V58.zip . \
            -x '.git/*' 'data_cache/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.sqlite' '*.db' '*.zip'
          unzip -t Trecapital_Deep_Analysis_Chapter8_Phase8M_V58.zip | tail -n 3

      - name: Upload V58 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trecapital_Deep_Analysis_Chapter8_Phase8M_V58
          retention-days: 90
          path: |
            docs/CHAPTER8_PHASE8M_REAL_OFFICIAL_DOCUMENT_ACCEPTANCE_V58.md
            reports/CH8_DGC_REAL_OFFICIAL_ACCEPTANCE_V58.json
            reports/CH8_DGC_REAL_OFFICIAL_MANIFEST_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_DOWNLOADS_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_FILE_ATTEMPTS_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_DOCUMENTS_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_NEW_CANDIDATES_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_COVERAGE_V58.csv
            reports/CH8_DGC_V54_OPEN_GAPS_NEWLY_COVERED_V58.csv
            reports/CH8_DGC_V54_OPEN_GAPS_REMAINING_V58.csv
            reports/CH8_DGC_REAL_OFFICIAL_LIVE_V58.log
            reports/CH8_V58_DETERMINISTIC_TESTS.log
            reports/CH8_V58_BOUNDARY_AUDIT.log
            reports/CH8_V58_FULL_DCA_REGRESSION.log
            reports/CH8_V58_STREAMLIT_SERVER.log
            reports/CH8_V58_STREAMLIT_HEALTH.txt
            Trecapital_Deep_Analysis_Chapter8_Phase8M_V58.zip
