<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;width:0;height:0;overflow:hidden;background:transparent}</style>
</head>
<body>
<script>
const parentOrigin = new URL(document.referrer || location.href).origin;
const send = (type, value) => parent.postMessage({isStreamlitMessage:true,type,...value}, parentOrigin);
function reportTheme(theme){
  const t=theme||{};
  parent.postMessage({type:'khdn-theme-sync',base:String(t.base||''),backgroundColor:String(t.backgroundColor||''),textColor:String(t.textColor||'')}, parentOrigin);
  send('streamlit:setFrameHeight',{height:0});
}
window.addEventListener('message',event=>{
  if(event.source!==parent || event.origin!==parentOrigin || event.data.type!=='streamlit:render') return;
  reportTheme(event.data.theme||{});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script>
</body>
</html>
