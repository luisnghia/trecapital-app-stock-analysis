[theme]
base = "light"
font = "sans serif"
showSidebarBorder = true

# V2.14-inspired light theme: white canvas/sidebar, dark teal text and clear borders.
[theme.light]
primaryColor = "#007F78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#163B39"
borderColor = "#BFD8D2"
dataframeHeaderBackgroundColor = "#F1F7F5"
showWidgetBorder = true

[theme.dark]
primaryColor = "#6FD6C4"
backgroundColor = "#0E1F1E"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"
dataframeHeaderBackgroundColor = "#1B4540"
showWidgetBorder = true

[theme.light.sidebar]
primaryColor = "#007F78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#163B39"
borderColor = "#BFD8D2"

[theme.dark.sidebar]
primaryColor = "#6FD6C4"
backgroundColor = "#102624"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"

[server]
# Serve bundled favicon/PWA assets so iOS and Android can use the BIDV icon.
enableStaticServing = true
