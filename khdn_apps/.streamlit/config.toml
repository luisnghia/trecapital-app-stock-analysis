[theme]
base = "light"
font = "sans serif"
showSidebarBorder = true

# V2.14 visual baseline: white page, pale native controls, dark teal text.
[theme.light]
primaryColor = "#0B7F75"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#12302D"
borderColor = "#C9D8D5"
dataframeHeaderBackgroundColor = "#EEF7F4"
showWidgetBorder = true

[theme.dark]
primaryColor = "#6FD6C4"
backgroundColor = "#0E1F1E"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"
dataframeHeaderBackgroundColor = "#1B4540"
showWidgetBorder = true

[theme.light.sidebar]
primaryColor = "#0B7F75"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#12302D"
borderColor = "#C9D8D5"

[theme.dark.sidebar]
primaryColor = "#6FD6C4"
backgroundColor = "#102624"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"

[server]
headless = true
enableStaticServing = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
