[theme]
base = "dark"
font = "sans serif"
showSidebarBorder = true

# Light mode follows the institutional Trecapital / Oaktree UI used by the
# stock-analysis app. Dark values below are intentionally left unchanged.
[theme.light]
primaryColor = "#12362F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17231F"
borderColor = "#C9DCD3"
dataframeHeaderBackgroundColor = "#F0F7F3"
showWidgetBorder = true

[theme.dark]
primaryColor = "#6FD6C4"
backgroundColor = "#0E1F1E"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"
dataframeHeaderBackgroundColor = "#1B4540"
showWidgetBorder = true

[theme.light.sidebar]
primaryColor = "#12362F"
backgroundColor = "#F0F7F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B2A25"
borderColor = "#C9DCD3"

[theme.dark.sidebar]
primaryColor = "#6FD6C4"
backgroundColor = "#102624"
secondaryBackgroundColor = "#17312F"
textColor = "#F4FFFC"
borderColor = "#365A56"

[server]
headless = true
maxUploadSize = 50
enableStaticServing = true

[browser]
gatherUsageStats = false
