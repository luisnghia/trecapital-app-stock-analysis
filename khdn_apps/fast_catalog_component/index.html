<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;font-family:Inter,"Source Sans Pro",Arial,sans-serif}
  .wrap{padding:0 1px 2px}
  label{display:block;font-size:13px;font-weight:700;line-height:1.25;margin:0 0 6px}
  .row{display:flex;gap:8px;align-items:stretch}
  input{flex:1 1 auto;min-width:0;height:42px;border-radius:7px;padding:0 12px;font-size:16px;outline:none;transition:none!important;box-shadow:none!important}
  button{flex:0 0 auto;min-height:42px;border-radius:999px;padding:0 18px;font-size:14px;font-weight:800;cursor:pointer;transition:none!important;box-shadow:none!important}
  body.light label{color:#0F172A}
  body.light input{background:#FFFFFF;color:#0F172A;border:1px solid #CBD5E1;caret-color:#0F172A}
  body.light input:focus{background:#FFFFFF;border-color:#0F766E;outline:2px solid rgba(15,118,110,.13)}
  body.light input::placeholder{color:#64748B}
  body.light button{background:#0F766E;color:#FFFFFF;border:1px solid #0F766E}
  body.light button:hover{background:#115E59;border-color:#F4B41A}
  body.dark label{color:#F4FFFC}
  body.dark input{background:#17312F;color:#F4FFFC;border:1px solid #4E7771;caret-color:#F4FFFC}
  body.dark input:focus{border-color:#6FD6C4;outline:2px solid rgba(111,214,196,.15)}
  body.dark input::placeholder{color:#AFCAC5}
  body.dark button{background:#176B63;color:#FFFFFF;border:1px solid #5B8F87}
  body.dark button:hover{background:#1B7E74;border-color:#F4B41A}
  @media(max-width:520px){.row{gap:6px;flex-direction:column}button{width:100%}}
</style>
</head>
<body class="dark">
<div class="wrap">
  <label id="label" for="input"></label>
  <div class="row">
    <input id="input" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false">
    <button id="submit" type="button"></button>
  </div>
</div>
<script>
const parentOrigin = new URL(document.referrer || location.href).origin;
const send = (type, value) => parent.postMessage({isStreamlitMessage:true,type,...value}, parentOrigin);
const labelEl=document.getElementById('label');
const inputEl=document.getElementById('input');
const buttonEl=document.getElementById('submit');
let resetToken=null;
let submitSeq=0;
function fit(){send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight+2});}
function submit(){
  const value=inputEl.value;
  submitSeq+=1;
  const submit_id=`${Date.now()}-${submitSeq}-${Math.random().toString(36).slice(2,8)}`;
  send('streamlit:setComponentValue',{value:{submit_id,value},dataType:'json'});
}
buttonEl.addEventListener('click',submit);
inputEl.addEventListener('keydown',event=>{
  if(event.key==='Enter' && !event.isComposing){event.preventDefault();submit();}
});
window.addEventListener('message',event=>{
  if(event.source!==parent || event.origin!==parentOrigin || event.data.type!=='streamlit:render') return;
  const args=event.data.args||{};
  const mode=args.themeType==='light'?'light':'dark';
  document.body.className=mode;
  labelEl.textContent=args.label||'';
  buttonEl.textContent=args.buttonLabel||'Lưu';
  inputEl.placeholder=args.placeholder||'';
  const nextToken=String(args.resetToken||'');
  if(resetToken===null){
    inputEl.value=String(args.defaultValue||'');
    resetToken=nextToken;
  }else if(nextToken!==resetToken){
    inputEl.value=String(args.defaultValue||'');
    resetToken=nextToken;
  }
  fit();
});
send('streamlit:componentReady',{apiVersion:1});
fit();
</script>
</body>
</html>
