<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const parentOrigin = new URL(document.referrer || location.href).origin;
const send = (type, value) => parent.postMessage({isStreamlitMessage:true,type,...value}, parentOrigin);
let last;
window.addEventListener('message', async event => {
  if (event.source !== parent || event.origin !== parentOrigin || event.data.type !== 'streamlit:render') return;
  const args=event.data.args;
  if (!args.command || args.command.id === last) return;
  last=args.command.id;
  let ok=false;
  try {
    const response=await fetch('/_khdn/device-session', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(args.command)
    });
    ok=response.ok && (await response.json()).ok === true;
  } catch (_) {}
  send('streamlit:setComponentValue',{value:{id:last,ok}, dataType:'json'});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script></body></html>
