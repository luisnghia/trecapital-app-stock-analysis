<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:transparent;font-family:Inter,"Source Sans Pro",Arial,sans-serif;color:var(--text,#F4FFFC)}
body{contain:layout style paint;overscroll-behavior:contain}
.wrap{padding:1px 1px 3px;max-width:100%;overflow:hidden}
.title{font-size:20px;font-weight:800;margin:0 0 12px;color:var(--text,#F4FFFC)}
.help{font-size:14px;line-height:1.45;margin:-4px 0 11px;color:var(--muted,#AFCAC5)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:12px 16px;align-items:start;min-width:0;max-width:100%}
.field{min-width:0;max-width:100%;overflow:hidden}.field.full{grid-column:1/-1}
.section{grid-column:1/-1;min-width:0;max-width:100%;overflow:hidden;margin-top:2px}.section-title{font-size:16px;font-weight:800;line-height:1.3;margin:4px 0 4px;color:var(--text,#F4FFFC)}.section-help{font-size:13px;line-height:1.42;color:var(--muted,#AFCAC5);margin:0 0 2px}
label{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:650;line-height:1.25;margin:0 0 7px;color:var(--text,#F4FFFC)}
input,textarea,select{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;inline-size:100%;max-inline-size:100%;min-inline-size:0;border-radius:8px;padding:11px 14px;font-size:16px;line-height:1.3;outline:none;transition:none!important;box-shadow:none!important;background:var(--secondary,#17312F);color:var(--text,#F4FFFC);border:1px solid var(--border,#4E7771);caret-color:var(--text,#F4FFFC);touch-action:manipulation}
input,select{height:52px}textarea{min-height:92px;resize:none}
.date-control{width:100%;max-width:100%;min-width:0}
.date-display{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:52px;padding:11px 14px;border:1px solid var(--border,#4E7771);border-radius:8px;background:var(--secondary,#17312F);font-size:16px;line-height:1.3;color:var(--text,#F4FFFC);white-space:nowrap;overflow:hidden;cursor:pointer;touch-action:manipulation;text-align:left}
.date-display.empty{color:var(--muted,#AFCAC5)}.date-text{min-width:0;overflow:hidden;text-overflow:ellipsis}.date-icon{flex:0 0 auto;opacity:.9}
.date-display:focus-visible{border-color:var(--focus,#79D8C8);outline:2px solid var(--focus,#79D8C8)}
.calendar{padding:10px;margin-top:7px;border:1px solid var(--border,#4E7771);border-radius:8px;background:var(--secondary,#17312F);color:var(--text,#F4FFFC)}
.calendar-nav{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(72px,.7fr) 42px;gap:5px;align-items:center;margin-bottom:8px}
.calendar-nav select{height:44px;padding:6px;font-size:16px}.calendar button{min-height:44px;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;font-size:16px;cursor:pointer;touch-action:manipulation}
.calendar button:focus-visible{outline:2px solid var(--focus,#79D8C8)}.calendar button:disabled{opacity:.35;cursor:not-allowed}
.calendar-days,.calendar-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}.calendar-weekdays{font-size:13px;font-weight:750;margin-bottom:4px}
.calendar-days button{padding:4px}.calendar-days button.selected{background:var(--primary,#69D2C3);color:#fff;font-weight:850}.calendar-days button.today{border-color:var(--focus,#79D8C8)}
.date-error{color:#FF8484;font-size:14px;margin-top:5px}.field-help{font-size:13px;line-height:1.4;color:var(--muted,#AFCAC5);margin-top:5px}
input:focus,textarea:focus,select:focus{border-color:var(--focus,#79D8C8);outline:1px solid var(--focus,#79D8C8)}
input::placeholder,textarea::placeholder{color:var(--muted,#AFCAC5);opacity:.82}
input:required:invalid,textarea:required:invalid,select:required:invalid{border-color:#FF4B4B}
.field:has(:required:invalid)>label{color:#FF4B4B}
.field:has(input[type="date"]:required:invalid) .date-display{border-color:#FF4B4B}
input:disabled,select:disabled,textarea:disabled{opacity:.82;cursor:not-allowed}
.number-control{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px;width:100%;max-width:100%;min-width:0;border-radius:8px;overflow:hidden}
.number-control input{border-radius:8px 0 0 8px;border-right:0}
.step-button{height:52px;margin:0;border-radius:0;border:1px solid var(--border,#4E7771);background:var(--secondary,#17312F);color:var(--text,#F4FFFC);font-size:23px;font-weight:800;line-height:1;box-shadow:none!important;transition:none!important;touch-action:manipulation}
.step-button+ .step-button{border-left:0}.step-button:active{background:var(--focus,#6FD6C4);color:#0E2724}.step-button:focus{outline:none;border-color:var(--focus,#79D8C8)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:2px 0}.check input{width:25px;height:25px;flex:0 0 25px;padding:0;accent-color:var(--focus,#6FD6C4);-webkit-appearance:auto;appearance:auto}.check label{margin:0;font-weight:550}
.submit-button{width:100%;min-height:52px;margin-top:14px;border-radius:9px;padding:10px 14px;font-size:17px;font-weight:850;cursor:pointer;transition:none!important;box-shadow:none!important;background:var(--primary,#69D2C3);color:var(--submitText,#FFFFFF);border:1px solid var(--primary,#69D2C3);touch-action:manipulation}.submit-button:active{filter:brightness(.94)}
body.light{--text:#17231F;--muted:#47665A;--secondary:#FFFFFF;--border:#C9DCD3;--focus:#D8A420;--primary:#0B2A25;--submitText:#FFFFFF}
body.light input,body.light textarea,body.light select,body.light .step-button{background:#FFFFFF;color:#17231F;border-color:#C9DCD3}
body.light .date-display,body.light .calendar{background:#FFFFFF;border-color:#C9DCD3}body.light .date-error{color:#B42318}
body.light input:focus,body.light textarea:focus,body.light select:focus{border-color:#D8A420;outline:1px solid #D8A420}
body.light .submit-button{background:#0B2A25;color:#FFFFFF;border-color:#0B2A25}
@media(max-width:700px){.grid{grid-template-columns:1fr!important;gap:12px}.field,.field.full,.section{grid-column:1/-1!important}.number-control{grid-template-columns:minmax(0,1fr) 54px 54px}.step-button{height:52px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="title" class="title" hidden></div>
  <div id="help" class="help" hidden></div>
  <form id="form" autocomplete="off">
    <div id="grid" class="grid"></div>
    <button id="submit" class="submit-button" type="submit">Lưu</button>
  </form>
</div>
<script>
const parentOrigin=new URL(document.referrer||location.href).origin;
const send=(type,value)=>parent.postMessage({isStreamlitMessage:true,type,...value},parentOrigin);
const signalFocus=active=>parent.postMessage({type:'khdn-fast-input-focus',active:!!active},parentOrigin);
const form=document.getElementById('form'),grid=document.getElementById('grid'),submit=document.getElementById('submit');
const titleEl=document.getElementById('title'),helpEl=document.getElementById('help'),wrap=document.querySelector('.wrap');
let resetToken=null,signature='',submitSeq=0,lastHeight=0;
const state={};
function fit(){const h=Math.ceil(wrap.getBoundingClientRect().height)+2;if(h>2&&h!==lastHeight){lastHeight=h;send('streamlit:setFrameHeight',{height:h});}}
function escName(v){return String(v||'').replace(/[^a-zA-Z0-9_\-]/g,'_')}
function fieldSignature(fields){return JSON.stringify((fields||[]).map(f=>[f.name,f.type,f.label,f.options,f.min,f.max,f.minFrom,f.step,f.span,f.disabled,f.help]))}
function tuneInput(input,type,name){
  input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocorrect','off');
  input.setAttribute('autocapitalize',name==='full_name'?'words':'sentences');
  if(type==='number')input.setAttribute('inputmode','decimal');
  if(type==='password')input.setAttribute('autocomplete','new-password');
}
function formatDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?`${m[3]}/${m[2]}/${m[1]}`:'';}
function updateDateDisplay(input){
  if(!input||!input._dateDisplay||!input._dateText)return;
  const text=formatDate(input.value);input._dateText.textContent=text||'— Chọn ngày —';
  input._dateDisplay.classList.toggle('empty',!text);
}
function isoDay(day){return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;}
function parseDay(value){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12):null;}
function dateCalendar(input,f){
  const ctl=document.createElement('div');ctl.className='date-control';
  const display=document.createElement('button');display.type='button';display.className='date-display';display.id=input.id+'_picker';display.disabled=!!f.disabled;
  display.setAttribute('aria-label',String(f.label||f.name));display.setAttribute('aria-expanded','false');display.setAttribute('aria-controls',input.id+'_calendar');
  const text=document.createElement('span');text.className='date-text';const icon=document.createElement('span');icon.className='date-icon';icon.textContent='📅';icon.setAttribute('aria-hidden','true');display.append(text,icon);
  const calendar=document.createElement('div');calendar.className='calendar';calendar.hidden=true;calendar.id=input.id+'_calendar';calendar.setAttribute('role','group');calendar.setAttribute('aria-label','Lịch chọn '+String(f.label||f.name));
  const nav=document.createElement('div');nav.className='calendar-nav';
  const prev=document.createElement('button'),next=document.createElement('button');prev.type=next.type='button';prev.textContent='‹';next.textContent='›';prev.setAttribute('aria-label','Tháng trước');next.setAttribute('aria-label','Tháng sau');
  const month=document.createElement('select'),year=document.createElement('select');month.setAttribute('aria-label','Tháng');year.setAttribute('aria-label','Năm');
  for(let i=0;i<12;i++){const o=document.createElement('option');o.value=String(i);o.textContent='Tháng '+(i+1);month.appendChild(o);}
  const weekdays=document.createElement('div');weekdays.className='calendar-weekdays';for(const label of ['T2','T3','T4','T5','T6','T7','CN']){const el=document.createElement('span');el.textContent=label;weekdays.appendChild(el);}
  const days=document.createElement('div');days.className='calendar-days';nav.append(prev,month,year,next);calendar.append(nav,weekdays,days);
  const error=document.createElement('div');error.className='date-error';error.setAttribute('role','alert');error.hidden=true;
  input.hidden=true;input.required=false;input._dateRequired=!!f.required;input._dateDisplay=display;input._dateText=text;input._dateError=error;input._dateCalendar=calendar;input._minFrom=String(f.minFrom||'');
  let shown=parseDay(input.value)||parseDay(input.min)||new Date();
  function bounds(){const linked=state[input._minFrom];return {min:linked?.value||input.min,max:input.max};}
  function close(){calendar.hidden=true;display.setAttribute('aria-expanded','false');fit();}
  function paint(){
    const y=shown.getFullYear(),m=shown.getMonth(),bound=bounds();
    month.value=String(m);year.replaceChildren();const lo=Math.min(1900,y-1),hi=Math.max(2100,y+1);for(let n=lo;n<=hi;n++){const o=document.createElement('option');o.value=String(n);o.textContent=String(n);year.appendChild(o);}year.value=String(y);
    days.replaceChildren();const first=new Date(y,m,1,12),offset=(first.getDay()+6)%7;
    for(let n=0;n<offset;n++)days.appendChild(document.createElement('span'));
    const count=new Date(y,m+1,0,12).getDate(),today=isoDay(new Date());
    for(let n=1;n<=count;n++){
      const day=new Date(y,m,n,12),iso=isoDay(day),button=document.createElement('button');button.type='button';button.textContent=String(n);button.setAttribute('aria-label','Ngày '+formatDate(iso));
      button.disabled=!!((bound.min&&iso<bound.min)||(bound.max&&iso>bound.max));button.classList.toggle('selected',iso===input.value);button.classList.toggle('today',iso===today);button.setAttribute('aria-pressed',String(iso===input.value));
      button.addEventListener('click',()=>{input.value=iso;error.hidden=true;updateDateDisplay(input);close();display.focus({preventScroll:true});});days.appendChild(button);
    }
    prev.disabled=!!(bound.min&&isoDay(new Date(y,m,0,12))<bound.min);next.disabled=!!(bound.max&&isoDay(new Date(y,m+1,1,12))>bound.max);fit();
  }
  display.addEventListener('click',()=>{if(!calendar.hidden){close();return;}for(const other of Object.values(state)){if(other!==input&&other._dateCalendar){other._dateCalendar.hidden=true;other._dateDisplay.setAttribute('aria-expanded','false');}}shown=parseDay(input.value)||parseDay(bounds().min)||new Date();calendar.hidden=false;display.setAttribute('aria-expanded','true');paint();});
  prev.addEventListener('click',()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1,12);paint();});next.addEventListener('click',()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1,12);paint();});
  month.addEventListener('change',()=>{shown=new Date(shown.getFullYear(),Number(month.value),1,12);paint();});year.addEventListener('change',()=>{shown=new Date(Number(year.value),shown.getMonth(),1,12);paint();});
  calendar.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();close();display.focus({preventScroll:true});}});
  ctl.append(input,display,calendar,error);updateDateDisplay(input);return ctl;
}
function datesValid(){
  for(const input of Object.values(state)){
    if(input.type!=='date'||input.disabled)continue;
    const min=state[input._minFrom]?.value||input.min,message=!input.value&&input._dateRequired?'Vui lòng chọn ngày.':input.value&&((min&&input.value<min)||(input.max&&input.value>input.max))?'Ngày đã chọn nằm ngoài khoảng cho phép.':'';
    if(message){input._dateError.textContent=message;input._dateError.hidden=false;input._dateDisplay.focus({preventScroll:true});fit();return false;}
  }
  return true;
}
function clampNumber(input,delta){
  const step=Number(input.step||1)||1,min=input.min===''?-Infinity:Number(input.min),max=input.max===''?Infinity:Number(input.max);
  let cur=input.value===''?0:Number(input.value);if(!Number.isFinite(cur))cur=0;
  let next=cur+delta*step;next=Math.min(max,Math.max(min,next));
  const decimals=(String(step).split('.')[1]||'').length;input.value=decimals?next.toFixed(decimals):String(Math.round(next));
  input.focus({preventScroll:true});
}
function createField(f){
  const type=String(f.type||'text');
  if(type==='section'){
    const sec=document.createElement('div');sec.className='section';
    const ttl=document.createElement('div');ttl.className='section-title';ttl.textContent=String(f.label||'');sec.appendChild(ttl);
    if(f.help){const h=document.createElement('div');h.className='section-help';h.textContent=String(f.help);sec.appendChild(h);}return sec;
  }
  const name=String(f.name||'');if(!name)return null;
  const box=document.createElement('div');box.className='field'+(f.full?' full':'');
  const span=Math.max(1,Number(f.span||1));box.dataset.span=String(span);if(!f.full&&span>1)box.style.gridColumn=`span ${span}`;
  if(type==='checkbox'){
    box.className+=' check';const input=document.createElement('input');input.type='checkbox';input.id='f_'+escName(name);input.dataset.name=name;input.checked=!!f.default;input.disabled=!!f.disabled;state[name]=input;
    const label=document.createElement('label');label.htmlFor=input.id;label.textContent=String(f.label||name)+(f.required?' *':'');box.append(input,label);return box;
  }
  const label=document.createElement('label');label.htmlFor='f_'+escName(name);label.textContent=String(f.label||name)+(f.required?' *':'');box.appendChild(label);
  let input;
  if(type==='textarea'){input=document.createElement('textarea');input.rows=Math.max(3,Math.min(12,Number(f.rows||4)));}
  else if(type==='select'){
    input=document.createElement('select');for(const opt of (f.options||[])){const o=document.createElement('option');if(opt&&typeof opt==='object'){o.value=String(opt.value??'');o.textContent=String(opt.label??opt.value??'');}else{o.value=String(opt??'');o.textContent=String(opt??'');}input.appendChild(o);}
  } else {input=document.createElement('input');input.type=type==='password'?'password':type==='number'?'number':type==='date'?'date':type==='time'?'time':'text';}
  input.id='f_'+escName(name);input.dataset.name=name;input.placeholder=String(f.placeholder||'');tuneInput(input,type,name);input.disabled=!!f.disabled;input.setAttribute('aria-label',String(f.label||name));
  if(type==='number'){if(f.min!==undefined&&f.min!==null)input.min=String(f.min);if(f.max!==undefined&&f.max!==null)input.max=String(f.max);if(f.step!==undefined&&f.step!==null)input.step=String(f.step);}
  if(type==='date'){if(f.min)input.min=String(f.min);if(f.max)input.max=String(f.max);}
  if(f.required)input.required=true;input.value=String(f.default??'');state[name]=input;
  if(type==='date'){
    label.htmlFor=input.id+'_picker';box.appendChild(dateCalendar(input,f));
  }else if(type==='number'){
    const ctl=document.createElement('div');ctl.className='number-control';const minus=document.createElement('button'),plus=document.createElement('button');minus.type=plus.type='button';minus.className=plus.className='step-button';minus.textContent='−';plus.textContent='+';minus.disabled=plus.disabled=!!f.disabled;minus.setAttribute('aria-label','Giảm');plus.setAttribute('aria-label','Tăng');minus.addEventListener('click',()=>clampNumber(input,-1));plus.addEventListener('click',()=>clampNumber(input,1));ctl.append(input,minus,plus);box.appendChild(ctl);
  }else box.appendChild(input);
  if(f.help){const help=document.createElement('div');help.className='field-help';help.textContent=String(f.help);box.appendChild(help);}return box;
}
function rebuild(fields){grid.replaceChildren();for(const k of Object.keys(state))delete state[k];for(const f of fields||[]){const node=createField(f||{});if(node)grid.appendChild(node);}fit();}
function applyDefaults(fields){for(const f of fields||[]){const el=state[String(f.name||'')];if(!el)continue;if(String(f.type||'')==='checkbox')el.checked=!!f.default;else{el.value=String(f.default??'');if(el.type==='date'){updateDateDisplay(el);el._dateCalendar.hidden=true;el._dateDisplay.setAttribute('aria-expanded','false');el._dateError.hidden=true;}}}}
function values(){const out={};for(const [name,el] of Object.entries(state)){if(el.type==='checkbox')out[name]=!!el.checked;else if(el.type==='number')out[name]=el.value===''?null:Number(el.value);else out[name]=el.value;}return out;}
function applyTheme(theme){const t=theme||{},light=t.base==='light';document.body.className=light?'light':'dark';const root=document.documentElement.style;root.setProperty('--primary',t.primaryColor||(light?'#0B2A25':'#69D2C3'));root.setProperty('--secondary',t.secondaryBackgroundColor||(light?'#FFFFFF':'#17312F'));root.setProperty('--text',t.textColor||(light?'#17231F':'#F4FFFC'));root.setProperty('--border',light?'#C9DCD3':'#4E7771');root.setProperty('--muted',light?'#47665A':'#AFCAC5');}
form.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))signalFocus(true);});
form.addEventListener('focusout',()=>{queueMicrotask(()=>{if(!form.contains(document.activeElement))signalFocus(false);});});
window.addEventListener('pagehide',()=>signalFocus(false),{once:true});
// Keep the iframe height stable while the phone keyboard opens or closes.
// Calendar actions and Streamlit render messages fit the form explicitly.
form.addEventListener('submit',e=>{e.preventDefault();if(submit.disabled||!datesValid()||!form.reportValidity())return;signalFocus(false);submit.disabled=true;form.setAttribute('aria-busy','true');submit.textContent='Đang xử lý…';submitSeq+=1;send('streamlit:setComponentValue',{value:{submit_id:`${Date.now()}-${submitSeq}-${Math.random().toString(36).slice(2,8)}`,reset_token:resetToken,values:values()},dataType:'json'});});
window.addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==parentOrigin||event.data.type!=='streamlit:render')return;
  const args=event.data.args||{},fields=Array.isArray(args.fields)?args.fields:[];applyTheme(event.data.theme||{});titleEl.textContent=String(args.title||'');titleEl.hidden=!titleEl.textContent;helpEl.textContent=String(args.helpText||'');helpEl.hidden=!helpEl.textContent;submit.disabled=false;form.setAttribute('aria-busy','false');submit.textContent=String(args.buttonLabel||'Lưu');
  const cols=Math.max(1,Math.min(4,Number(args.columns||1)||1));grid.style.setProperty('--cols',String(cols));grid.dataset.cols=String(cols);
  const nextSig=fieldSignature(fields),nextToken=String(args.resetToken||'');if(signature!==nextSig){signature=nextSig;resetToken=nextToken;rebuild(fields);}else if(resetToken===null||resetToken!==nextToken){resetToken=nextToken;applyDefaults(fields);}fit();
});
send('streamlit:componentReady',{apiVersion:1});fit();
</script>
</body>
</html>
